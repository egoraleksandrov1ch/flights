<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Travel Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
  :root{
    --bg:#05070d; --panel:rgba(14,18,30,.9); --line:rgba(255,255,255,.08);
    --text:#e8ecf5; --muted:#8a93a8; --accent:#ffb347; --accent2:#5ad1ff; --danger:#ff6b6b;
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;min-height:100lvh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
  #map,#globe{position:fixed;top:0;left:0;right:0;height:100%;height:100lvh;background:var(--bg)}

  /* ---------- Panel (desktop) ---------- */
  .panel{position:fixed;top:16px;left:16px;bottom:16px;width:360px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;z-index:5;transition:transform .3s ease}
  .panel.hidden{transform:translateX(calc(-100% - 20px))}
  .grip{display:none}
  header{display:flex;align-items:center;gap:8px;padding:18px 18px 10px}
  h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;flex:1}
  h1 span{color:var(--accent)}
  .icon-btn{padding:5px 10px;font-size:15px;line-height:1}
  #addToggle{display:none}
  /* ---------- Паспорт (модальное окно) ---------- */
  .pmodal{position:fixed;inset:0;z-index:50;background:rgba(3,5,12,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
  .pbox{max-width:480px;margin:0 auto}
  .phead{display:flex;align-items:center;margin-bottom:12px}
  .phead h2{flex:1;margin:0;font-size:20px}
  .phead h2 span{color:var(--accent)}
  .phead button{padding:6px 11px;font-size:15px}
  .periods{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
  .periods::-webkit-scrollbar{display:none}
  .periods button{flex:none;border-radius:999px;padding:7px 14px;font-size:14px}
  .periods button.on{background:var(--accent);color:#1a1205;border-color:transparent}
  .pcard{position:relative;aspect-ratio:3/4;filter:drop-shadow(0 20px 40px rgba(0,0,0,.45))}
  .pcard canvas{display:block;width:100%;height:auto}
  .ploading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
  .psave{width:100%;margin-top:14px;font-size:16px;height:48px;border-radius:12px}
  .psave:disabled{opacity:.5}
  .phint{color:var(--muted);font-size:12px;text-align:center;margin-top:10px}
  body.modal-open .ctrls{display:none}

  .sel{margin:0 18px 10px;padding:10px 12px;border-radius:10px;background:rgba(255,179,71,.12);border:1px solid rgba(255,179,71,.3);
    display:flex;align-items:center;gap:10px}
  .sel .route{font-family:"JetBrains Mono",monospace;font-size:15px}
  .sel .route.plain{font-family:Inter,system-ui,sans-serif;font-weight:600}
  .sel .meta{color:var(--muted);font-size:12px;margin-top:2px}
  .sel button{margin-left:auto;background:none;border:0;color:var(--muted);font-size:18px;padding:2px 6px}

  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 18px 14px}
  .stat{background:rgba(255,255,255,.04);border-radius:10px;padding:8px 4px;text-align:center;min-width:0}
  .stat b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em}

  form{padding:14px 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;gap:8px}
  .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
  .field{position:relative;min-width:0}
  label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
  input{display:block;width:100%;min-width:0;max-width:100%;height:40px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);border-radius:8px;
    padding:0 10px;font:inherit;font-size:14px;outline:none;-webkit-appearance:none;appearance:none}
  input:focus{border-color:var(--accent)}
  input[type=date]{color-scheme:dark;text-align:left}
  input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
  input[type=date]::-webkit-calendar-picker-indicator{opacity:.6}
  .sugg{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:#121827;border:1px solid var(--line);border-radius:8px;
    max-height:240px;overflow:auto;z-index:20;display:none;min-width:220px}
  .field:last-child .sugg{left:auto}
  .sugg div{padding:9px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
  .sugg div:last-child{border:0}
  .sugg div:hover,.sugg div.active{background:rgba(255,179,71,.14)}
  .code{font-family:"JetBrains Mono",monospace;color:var(--accent);margin-right:6px}
  .sub{color:var(--muted);font-size:11px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);padding:9px 12px;font-size:13px}
  button:hover{background:rgba(255,255,255,.12)}
  button.primary{background:var(--accent);color:#1a1205;border:0;font-weight:600;height:42px}
  button.primary:hover{filter:brightness(1.08)}

  .list{flex:1;overflow:auto;padding:8px 10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .flight{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:10px;cursor:pointer}
  .flight:hover{background:rgba(255,255,255,.05)}
  .flight.active{background:rgba(255,179,71,.12)}
  .flight .info{min-width:0;flex:1}
  .flight .route{font-family:"JetBrains Mono",monospace;font-size:14px}
  .route i{color:var(--muted);font-style:normal;margin:0 4px}
  .flight .meta{color:var(--muted);font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .flight .del{background:none;border:0;color:var(--muted);padding:6px 10px;font-size:18px;flex:none}
  .flight .del:hover{color:var(--danger)}
  .year.up{color:var(--accent2)}
  .flight.upcoming .route{color:#c9cfdb}
  .badge{font:600 10px Inter,system-ui,sans-serif;color:var(--accent2);background:rgba(90,209,255,.12);border-radius:6px;padding:2px 6px;margin-left:8px;vertical-align:2px}
  .year{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.08em;padding:12px 8px 4px}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:13px}
  footer{display:flex;gap:6px;padding:10px 18px 14px;border-top:1px solid var(--line)}
  footer button{flex:1;padding:8px;font-size:12px}
  .err{color:var(--danger);font-size:12px}
  /* ---------- Страницы шторки ---------- */
  .tabs{display:flex;gap:4px;margin:0 18px 12px;background:rgba(255,255,255,.04);border-radius:10px;padding:3px}
  .tabs button{flex:1;border:0;background:none;padding:7px 4px;font-size:13px;border-radius:8px;color:var(--muted)}
  .tabs button.on{background:rgba(255,255,255,.1);color:var(--text)}
  .pages{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
  .track{flex:1;min-height:0;display:flex;width:300%;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  .track.dragging{transition:none}
  .page{width:33.3334%;min-width:0;display:flex;flex-direction:column;min-height:0}
  .page .list{flex:1;min-height:0}
  .modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .modes button{padding:8px 2px;font-size:12px;white-space:nowrap}
  .modes button.on{background:rgba(255,179,71,.18);border-color:rgba(255,179,71,.55)}
  .mode-ico{font-size:19px;flex:none;width:28px;text-align:center}
  .flight.trip .route,.flight.country .route{font-family:Inter,system-ui,sans-serif;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flag{font-size:26px;flex:none;width:34px;text-align:center;line-height:1}
  .flight.country .cnt{color:var(--muted);font-size:12px;flex:none;padding-right:6px}
  .sugg .kind{margin-right:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips:not(:empty){margin-bottom:6px}
  .chip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.08);border-radius:999px;padding:4px 4px 4px 10px;font-size:13px}
  .chip button{background:none;border:0;padding:0 6px;color:var(--muted);font-size:15px;line-height:1}
  .jhint{font-size:12px;color:var(--accent2)}
  .jhint:empty{display:none}
  .flags{flex:none;width:44px;font-size:18px;line-height:1.1;text-align:center;letter-spacing:-3px}
  .flight.journey .route{font-family:Inter,system-ui,sans-serif;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .err:empty{display:none}

  .toggle{position:fixed;top:16px;left:16px;z-index:6;display:none;background:var(--panel)}
  .panel.hidden ~ .toggle{display:block}

  /* ---------- Map controls ---------- */
  .ctrls{position:fixed;top:calc(var(--safe-t) + 16px);right:16px;z-index:6;display:flex;gap:6px;align-items:flex-start}
  .ctrls > button,.ctrls .layers > button{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .layers{position:relative}
  .menu{position:absolute;top:calc(100% + 6px);right:0;min-width:170px;background:#121827;border:1px solid var(--line);border-radius:12px;padding:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);display:none}
  .layers.open .menu{display:block}
  .menu button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;padding:9px 10px;border-radius:8px;text-align:left}
  .menu button:hover{background:rgba(255,255,255,.07)}
  .menu button.on{color:var(--accent)}
  .menu button.on::after{content:"✓";margin-left:auto}
  .menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
  .menu .cnt{color:var(--muted);font-size:12px;margin-left:auto}
  .menu button.on .cnt{display:none}
  #yearMenu{max-height:60vh;overflow:auto}

  .maplibregl-popup-content{background:#121827;color:var(--text);border-radius:10px;padding:10px 12px;font:13px Inter,system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .maplibregl-popup-tip{border-top-color:#121827!important;border-bottom-color:#121827!important}
  .maplibregl-popup-close-button{color:var(--muted);font-size:16px;padding:0 6px}
  .maplibregl-ctrl-bottom-right{right:6px}

  /* ---------- Mobile: bottom sheet ---------- */
  @media (max-width:640px){
    .panel{top:auto;left:0;right:0;bottom:0;width:auto;height:88dvh;border-radius:18px 18px 0 0;border-bottom:0;
      transform:translateY(var(--sheet-y,50%));transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--safe-b)}
    .panel.dragging{transition:none}
    /* шторка продолжается вниз под панель Safari — без чёрной полосы */
    .panel::after{content:"";position:absolute;left:0;right:0;top:100%;height:50vh;background:#0e121e}
    .panel{overflow:visible}
    .panel > .list{overflow:auto}
    html,body{background:#0e121e}
    .panel.hidden{transform:translateY(var(--sheet-y,50%))}
    .sheet-top{touch-action:none;cursor:grab}
    .grip{display:block;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:8px auto 0}
    header{padding:10px 16px 10px}
    h1{font-size:19px}
    #hideBtn{display:none}
    .share-lbl{display:none}
    #shareBtn{padding:7px 11px;font-size:16px}
    #addToggle{display:block;background:var(--accent);color:#1a1205;border:0;font-weight:700;padding:7px 12px;font-size:14px}
    .panel.adding #addToggle{background:rgba(255,255,255,.08);color:var(--text)}
    .sel{margin:0 16px 10px}
    .stats{padding:0 16px 12px;gap:6px}
    .stat{padding:7px 2px}
    .stat b{font-size:15px}
    .stat small{font-size:9px}
    form{display:none;padding:12px 16px}
    .panel.adding form{display:grid}
    input{font-size:16px;height:42px} /* 16px = без автозума iOS */
    .list{padding:4px 8px}
    .flight{padding:11px 8px}
    footer{padding:10px 16px 12px}
    .ctrls{top:calc(var(--safe-t) + 12px);right:12px}
    .ctrls button{padding:8px 11px}
    .ctrls .lbl{display:none}
    /* точки страниц вместо вкладок */
    .tabs{margin:2px auto 8px;background:none;padding:0;gap:7px;justify-content:center;width:auto}
    .tabs button{flex:none;width:7px;height:7px;padding:0;border-radius:4px;background:rgba(255,255,255,.25);font-size:0;transition:width .2s,background .2s}
    .tabs button.on{background:var(--accent);width:20px}
    .grip{margin-bottom:6px}
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="globe" hidden></div>

<aside class="panel" id="panel">
  <div class="sheet-top" id="sheetTop">
    <div class="grip"></div>
    <header>
      <h1 id="title">Diary <span>Fly</span></h1>
      <button class="icon-btn" id="shareBtn" type="button" title="Поделиться">⤴<span class="share-lbl"> Поделиться</span></button>
      <button class="icon-btn" id="addToggle" type="button">+ Добавить</button>
      <button class="icon-btn" id="hideBtn" type="button" title="Скрыть панель">✕</button>
    </header>
    <div class="tabs" id="tabs">
      <button type="button" data-page="0">✈ Fly</button>
      <button type="button" data-page="1">🚆 Road</button>
      <button type="button" data-page="2">🌍 Country</button>
    </div>
    <div class="sel" id="sel" hidden>
      <div><div class="route" id="selRoute"></div><div class="meta" id="selMeta"></div></div>
      <button id="selClose" type="button" title="Снять выделение">×</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="sv0">0</b><small id="sl0">рейсов</small></div>
      <div class="stat"><b id="sv1">0</b><small id="sl1">км</small></div>
      <div class="stat"><b id="sv2">0</b><small id="sl2">аэроп.</small></div>
      <div class="stat"><b id="sv3">0</b><small id="sl3">стран</small></div>
    </div>
  </div>
  <div class="pages" id="pages"><div class="track" id="track">
  <section class="page">
  <form id="form" autocomplete="off">
    <div class="row">
      <div class="field"><label>Откуда</label><input id="from" placeholder="WAW, Варшава…" required><div class="sugg"></div></div>
      <div class="field"><label>Куда</label><input id="to" placeholder="IST, London…" required><div class="sugg"></div></div>
    </div>
    <div class="row">
      <div class="field"><label>Дата</label><input id="date" type="date"></div>
      <div class="field"><label>Авиакомпания / рейс</label><input id="airline" placeholder="LO 123"></div>
    </div>
    <div class="err" id="err"></div>
    <button class="primary" type="submit">Добавить перелёт</button>
  </form>
  <div class="list" id="list"></div>
  </section>
  <section class="page">
  <form id="tripForm" autocomplete="off">
    <div class="modes" id="modes">
      <button type="button" data-mode="train" class="on">🚆 Поезд</button>
      <button type="button" data-mode="bus">🚌 Автобус</button>
      <button type="button" data-mode="car">🚗 Машина</button>
      <button type="button" data-mode="ferry">⛴ Паром</button>
    </div>
    <div class="row">
      <div class="field"><label>Откуда</label><input id="tFrom" placeholder="Город или вокзал" required><div class="sugg"></div></div>
      <div class="field"><label>Куда</label><input id="tTo" placeholder="Город или вокзал" required><div class="sugg"></div></div>
    </div>
    <div class="row">
      <div class="field"><label>Дата</label><input id="tDate" type="date"></div>
      <div class="field"><label>Перевозчик / заметка</label><input id="tNote" placeholder="PKP Intercity"></div>
    </div>
    <div class="err" id="tErr"></div>
    <button class="primary" type="submit" id="tSubmit">Добавить поездку</button>
  </form>
  <div class="list" id="tripList"></div>
  </section>
  <section class="page">
  <form id="jForm" autocomplete="off">
    <div class="field"><label>Страны путешествия</label>
      <div class="chips" id="jChips"></div>
      <input id="jCountry" placeholder="Швейцария, Франция…"><div class="sugg"></div>
    </div>
    <div class="row">
      <div class="field"><label>С</label><input id="jStart" type="date"></div>
      <div class="field"><label>По</label><input id="jEnd" type="date"></div>
    </div>
    <div class="field"><label>Название (необязательно)</label><input id="jTitle" placeholder="Альпы на машине"></div>
    <div class="jhint" id="jHint"></div>
    <div class="err" id="jErr"></div>
    <button class="primary" type="submit">Добавить путешествие</button>
  </form>
  <div class="list" id="countryList"></div>
  </section>
  </div></div>
  <footer>
    <button id="exportBtn" type="button">Экспорт</button>
    <button id="importBtn" type="button">Импорт</button>
    <button id="clearBtn" type="button">Очистить</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </footer>
</aside>
<button class="toggle" id="showBtn">☰ Diary</button>

<div class="pmodal" id="passportModal" hidden>
  <div class="pbox">
    <div class="phead">
      <h2>Посадочный <span>талон</span></h2>
      <button id="passClose" type="button" title="Закрыть">✕</button>
    </div>
    <div class="periods" id="passPeriods"></div>
    <div class="periods" id="passThemes" hidden></div>
    <div class="pcard"><canvas id="passCv" width="1080" height="1440"></canvas><div class="ploading" id="passLoading">Готовлю картинку…</div></div>
    <button class="primary psave" id="passSave" type="button" disabled>Сохранить фото</button>
    <div class="phint">Только совершённые перелёты. Время в воздухе — оценка по расстоянию.</div>
  </div>
</div>

<div class="ctrls">
  <div class="layers" id="years">
    <button id="yearBtn" type="button">📅 Всё время</button>
    <div class="menu" id="yearMenu"></div>
  </div>
  <button id="rotateBtn" type="button" title="Вращение">⟳<span class="lbl"> Вращение</span></button>
  <div class="layers" id="layers">
    <button id="layersBtn" type="button">🗺 Карта</button>
    <div class="menu" id="menu">
      <button data-view="map" type="button">🗺 Карта</button>
      <button data-view="dark" type="button">🌑 Тёмная</button>
      <button data-view="sat" type="button">🛰 Спутник</button>
      <button data-view="globe3d" type="button">🌍 3D глобус</button>
      <div id="dayNightWrap" hidden>
        <hr>
        <button id="dayNightBtn" type="button">☀ Дневная Земля</button>
      </div>
    </div>
  </div>
</div>

<script src="lib/maplibre-gl.js"></script>
<script>
const KEY = 'flights.v1';
let AIRPORTS = [], BY_IATA = {};
let flights = load();
let selected = null;
let ARCS = [], PTS = [];          // данные, которые рисуют обе карты
const isMobile = () => matchMedia('(max-width:640px)').matches;

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(flights)); }catch(e){ alert('Не удалось сохранить в localStorage'); } }
function lsGet(k,d){ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

// ---------- Helpers ----------
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtKm(n){ return Math.round(n).toLocaleString('ru-RU'); }
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return `${d}.${m}.${y}`; }
const RAD = Math.PI/180;
function dist(a,b){
  const dLat=(b.lat-a.lat)*RAD, dLon=(b.lon-a.lon)*RAD;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*RAD)*Math.cos(b.lat*RAD)*Math.sin(dLon/2)**2;
  return 2*6371*Math.asin(Math.sqrt(h));
}
function midLng(a,b){ let d=b-a; if(d>180)d-=360; if(d<-180)d+=360; return a+d/2; }
// дуга большого круга — реальный кратчайший путь самолёта
function greatCircle(a,b,n){
  const toV=p=>[Math.cos(p.lat*RAD)*Math.cos(p.lon*RAD), Math.cos(p.lat*RAD)*Math.sin(p.lon*RAD), Math.sin(p.lat*RAD)];
  const A=toV(a), B=toV(b);
  const d=Math.acos(Math.min(1,Math.max(-1,A[0]*B[0]+A[1]*B[1]+A[2]*B[2])));
  if(d<1e-6) return [[a.lon,a.lat],[b.lon,b.lat]];
  n = n || Math.max(16, Math.ceil(d/RAD*1.5));
  const out=[]; let prev=null;
  for(let i=0;i<=n;i++){
    const f=i/n, s1=Math.sin((1-f)*d)/Math.sin(d), s2=Math.sin(f*d)/Math.sin(d);
    const x=s1*A[0]+s2*B[0], y=s1*A[1]+s2*B[1], z=s1*A[2]+s2*B[2];
    let lon=Math.atan2(y,x)/RAD; const lat=Math.atan2(z,Math.hypot(x,y))/RAD;
    if(prev!==null){ while(lon-prev>180) lon-=360; while(lon-prev<-180) lon+=360; } // без разрыва на 180°
    out.push([lon,lat]); prev=lon;
  }
  return out;
}

let lastT = 0;
function spin(t){
  if(map && view!=='globe3d' && rotating && !document.hidden && map.getZoom() < 3.5 && !map.isMoving()){
    const dt = lastT ? Math.min(100, t-lastT) : 16;
    const c = map.getCenter(); c.lng -= dt * 0.004;
    map.jumpTo({center:c});
  }
  lastT = t;
  requestAnimationFrame(spin);
}

function styleOverlay(){
  if(!map || !map.getLayer('flights-base')) return;
  // страны: на странице Country видны только они, перелёты и поездки скрыты
  const onC = page===2;
  for(const l of ['country-fill','country-flags']) map.setLayoutProperty(l,'visibility', onC ? 'visible' : 'none');
  // каждая страница показывает только своё: Fly — перелёты, Road — поездки, Country — страны
  // на Country при выбранном путешествии показываем его перелёты и поездки
  const hideFlights = !(page===0 || (onC && J)), hideTrips = !(page===1 || (onC && J));
  for(const l of ['flights-base','flights-up','flights-sel','flights-pulse','flights-hit','airports','airport-labels'])
    if(map.getLayer(l)) map.setLayoutProperty(l,'visibility', hideFlights ? 'none' : 'visible');
  for(const l of ['trips-line','trips-up','trips-sel','trips-hit','trip-pts','trip-labels'])
    if(map.getLayer(l)) map.setLayoutProperty(l,'visibility', hideTrips ? 'none' : 'visible');
  map.setPaintProperty('country-fill','fill-opacity', selCountry ? ['case',['==',['get','iso'],selCountry],0.62,0.3] : 0.4);
  // поездки
  map.setFilter('trips-sel', ['==',['get','id'], selTrip==null ? -1 : selTrip]);
  map.setPaintProperty('trips-line','line-opacity', (selTrip!=null || selected!=null) ? 0.35 : 0.9);
  const hasSel = selected!=null;
  map.setPaintProperty('flights-base','line-opacity', hasSel ? 0.18 : 0.4);
  map.setFilter('flights-sel', ['==',['get','id'], hasSel ? selected : -1]);
  // при выборе импульс бежит только по выбранному маршруту
  const notUp = ['!',['get','up']];
  map.setFilter('flights-pulse', hasSel ? ['all',['==',['get','id'],selected],notUp] : notUp);
  map.setPaintProperty('flights-up','line-opacity', hasSel ? 0.35 : 0.85);
  map.setPaintProperty('flights-sel','line-color', ['case',['get','up'], VIEWS[view]?.upSel || '#9aa3b5', VIEWS[view]?.selLine || '#fff']);
}

// ---------- Импульс вдоль линий ----------
const PULSE_MS = 4000, PULSE_LEN = 0.4;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function hexRgb(h){ h=h.replace('#',''); return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)); }
function pulseExpr(phase){
  const v = VIEWS[view] || VIEWS.map;
  const A = hexRgb(v.line), B = hexRgb(v.line2);
  const head = phase*(1+PULSE_LEN), tail = head-PULSE_LEN;
  const col = (x,a)=>{ const c=A.map((av,i)=>Math.round(av+(B[i]-av)*x)); return `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)})`; };
  const alphaAt = x => (x>=tail && x<=head) ? Math.pow((x-tail)/PULSE_LEN, 1.1) : 0;
  const xs = new Set([0,1]);
  for(let i=1;i<40;i++) xs.add(i/40);
  for(const x of [tail, head, head+0.004]) if(x>0 && x<1) xs.add(x);
  const sorted = [...xs].sort((a,b)=>a-b);
  const expr = ['interpolate',['linear'],['line-progress']];
  let prev = -1;
  for(const x of sorted){
    if(x-prev < 1e-4) continue;
    expr.push(x, col(x, x>head ? 0 : alphaAt(x)));
    prev = x;
  }
  return expr;
}
let lastPulse = 0;
function pulse(t){
  if(map && mapReady && view!=='globe3d' && !document.hidden && !reduceMotion && t-lastPulse > 33 && map.getLayer('flights-pulse')){
    lastPulse = t;
    map.setPaintProperty('flights-pulse','line-gradient', pulseExpr((t % PULSE_MS)/PULSE_MS));
  }
  requestAnimationFrame(pulse);
}
requestAnimationFrame(pulse);
function flightsGeo(){
  return {type:'FeatureCollection',features:(J ? J.arcs : ARCS).map((d,i)=>({type:'Feature',
    properties:{id:d.id, up:!!d.up},
    geometry:{type:'LineString',coordinates:d.line}}))};
}
function airportsGeo(){
  return {type:'FeatureCollection',features:(J ? J.pts : PTS).map(p=>({type:'Feature',properties:{iata:p.iata,n:p.n},geometry:{type:'Point',coordinates:[p.lon,p.lat]}}))};
}
function updateMap(){
  if(!map || !mapReady) return;
  map.getSource('trips')?.setData(tripsGeo());
  map.getSource('trip-pts')?.setData(tripPtsGeo());
  map.getSource('countries')?.setData(J ? J.fc : VISITED_FC);
  map.getSource('country-flags')?.setData(J ? J.flags : FLAGS_FC);
  map.getSource('flights')?.setData(flightsGeo());
  map.getSource('airports')?.setData(airportsGeo());
  styleOverlay();
}
function focusMap(d){
  const lons=d.line.map(c=>c[0]), lats=d.line.map(c=>c[1]);
  map.fitBounds([[Math.min(...lons),Math.min(...lats)],[Math.max(...lons),Math.max(...lats)]],
    {padding:40, maxZoom:6.5, duration:1200});
}
function setMapStyle(){
  mapReady = false; countriesOnMap = false;
  popup?.remove();
  map.setStyle(VIEWS[view].style, {diff:false});
}

//  Вид 2: 3D глобус (globe.gl) — загружается только когда нужен
// ======================================================================
let globe = null, globeLoading = null, zoomK = 1;
const BASE_ALT = 2.2;
const EARTH = { night:'img/earth-night.jpg', day:'img/earth-blue-marble.jpg' };
let earthMode = lsGet('flights.map','night')==='day' ? 'day' : 'night';

function loadGlobe(){
  if(globe) return Promise.resolve();
  if(globeLoading) return globeLoading;
  globeLoading = new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src='lib/globe.gl.min.js';
    s.onload=()=>{ createGlobe(); res(); }; s.onerror=rej; document.head.appendChild(s);
  });
  return globeLoading;
}
function createGlobe(){
  globe = Globe({ rendererConfig:{ antialias:true } })(document.getElementById('globe'))
    .globeImageUrl(EARTH[earthMode])
    .bumpImageUrl('img/earth-topology.png')
    .backgroundImageUrl('img/night-sky.png')
    .atmosphereColor('#5ad1ff').atmosphereAltitude(0.18)
    .arcStartLat(d=>d.a.lat).arcStartLng(d=>d.a.lon).arcEndLat(d=>d.b.lat).arcEndLng(d=>d.b.lon)
    .arcStroke(null)   // 1px — не утолщается при приближении
    .arcAltitudeAutoScale(0.3)
    .arcDashLength(d=>d.up?0.02:0.5).arcDashGap(d=>d.up?0.015:0.15).arcDashAnimateTime(d=>d.up?0:4000)
    .arcLabel(d=>`<b>${d.a.iata} → ${d.b.iata}</b><br>${esc(d.a.city)} → ${esc(d.b.city)}<br>${fmtKm(d.km)} км${d.date?'<br>'+fmtDate(d.date):''}${d.airline?' · '+esc(d.airline):''}`)
    .pointLat('lat').pointLng('lon').pointColor(()=> '#ffb347').pointAltitude(0.002).pointResolution(12)
    .pointLabel(d=>`<b>${d.iata}</b> ${esc(d.name)}<br>${esc(d.city)}, ${d.country} · ${d.n} рейс(ов)`)
    .labelLat('lat').labelLng('lon').labelText('iata').labelDotRadius(0)
    .labelColor(()=> 'rgba(255,255,255,0.8)').labelAltitude(0.004).labelResolution(2)
    .onArcClick(d=> selectFlight(d.id))
    .onZoom(pov=>{
      const k = Math.max(0.06, Math.min(1, pov.altitude / BASE_ALT));
      if(Math.abs(k-zoomK)/zoomK > 0.08){ zoomK = k; globeSizes(); }
    });
  globeSizes();
  globe.controls().autoRotateSpeed = 0.35;
  globe.controls().addEventListener('start', ()=>{ if(rotating){ rotating=false; rotBtnUpdate(); } });
  const c = map ? map.getCenter() : {lat:50,lng:21};
  globe.pointOfView({lat:c.lat, lng:c.lng, altitude:BASE_ALT});
}
function globeSizes(){
  const k=zoomK;
  globe.pointRadius(d=>(0.16+Math.min(d.n,20)*0.015)*k).labelSize(()=>0.42*Math.max(k,0.2));
}
function updateGlobe(){
  if(!globe) return;
  globe.arcColor(d=> d.up ? (d.id===selected ? ['#ffffff','#ffffff'] : selected==null ? ['rgba(170,178,195,0.8)','rgba(170,178,195,0.8)'] : ['rgba(170,178,195,0.3)','rgba(170,178,195,0.3)'])
                  : selected==null ? ['rgba(255,179,71,0.95)','rgba(90,209,255,0.95)']
                  : d.id===selected ? ['#ffffff','#ffffff'] : ['rgba(255,179,71,0.25)','rgba(90,209,255,0.25)']);
  const gF = page===0 || !!J, gT = page===1 || !!J;
  const gA = J ? J.arcs : ARCS, gP = J ? J.pts : PTS;
  globe.arcsData(gF?gA:[]).pointsData(gF?gP:[]).labelsData(gF?gP:[]);
  globe.pathsData(gT?(J ? J.trips : TRIPS):[]).pathPoints('line').pathPointLat(p=>p[1]).pathPointLng(p=>p[0]).pathPointAlt(0.002)
    .pathStroke(null).pathTransitionDuration(0)
    .pathColor(d=> d.id===selTrip ? '#ffffff' : d.up ? 'rgba(170,178,195,0.8)' : MODES[d.mode]?.color || '#fff')
    .pathDashLength(d=>d.up?0.02:1).pathDashGap(d=>d.up?0.015:0)
    .pathLabel(d=>`${MODES[d.mode]?.ico||''} ${esc(d.from.name)} → ${esc(d.to.name)}<br>${fmtKm(d.km)} км${d.date?' · '+fmtDate(d.date):''}`)
    .onPathClick(d=> selectTrip(d.id));
  globe.controls().autoRotate = rotating;
}
function focusGlobe(d){
  globe.pointOfView({lat:(d.a.lat+d.b.lat)/2, lng:midLng(d.a.lon,d.b.lon), altitude: Math.min(2.5, 0.5+d.km/5500)}, 1200);
}

async function setView(v){
  if(v===view && (v!=='globe3d' || globe)) return;

    try{ await loadGlobe(); }catch(e){ alert('Не удалось загрузить 3D глобус'); view=prev; viewUi(); return; }

  }
}

// ---------- Selection ----------
function focusFlight(d){
  rotating=false; rotBtnUpdate();
  if(view==='globe3d'){ if(globe) focusGlobe(d); } else if(map) focusMap(d);
}
function selectFlight(id){
  selected = id; selTrip = null; selCountry = null; selJourney = null;
  render();
  const d = ARCS.find(a=>a.id===id);
  if(!d) return;
  if(isMobile()) setSheet('peek');
  focusFlight(d);
}
document.getElementById('selClose').onclick = e=>{ e.stopPropagation(); selected=null; selTrip=null; selCountry=null; selJourney=null; render(); };

// ---------- Фильтр по годам ----------
const yearsEl = document.getElementById('years'), yearMenu = document.getElementById('yearMenu');
function yearLabel(y){ return y==='all' ? 'Всё время' : y==='none' ? 'Без даты' : y; }
function renderYears(){
  const counts = {};
  for(const f of [...flights, ...trips, ...journeys.map(j=>({date:j.start}))]) counts[yearOf(f)] = (counts[yearOf(f)]||0)+1;
  if(yearFilter!=='all' && !counts[yearFilter]){ yearFilter='all'; lsSet('flights.year','all'); }
  const ys = Object.keys(counts).filter(y=>y!=='none').sort((a,b)=>b.localeCompare(a));
  if(counts.none) ys.push('none');
  const item = (y,n)=>`<button type="button" data-year="${y}" class="${y===yearFilter?'on':''}">${yearLabel(y)}<span class="cnt">${n}</span></button>`;
  yearMenu.innerHTML = item('all', flights.length + trips.length + journeys.length) + (ys.length?'<hr>':'') + ys.map(y=>item(y,counts[y])).join('');
  document.getElementById('yearBtn').textContent = '📅 ' + yearLabel(yearFilter);
}
document.getElementById('yearBtn').onclick = e=>{ e.stopPropagation(); layersEl.classList.remove('open'); yearsEl.classList.toggle('open'); };
yearMenu.addEventListener('click', e=>{
  const b = e.target.closest('[data-year]'); if(!b) return;
  yearFilter = b.dataset.year; lsSet('flights.year', yearFilter);
  yearsEl.classList.remove('open');
  selected = null; selTrip = null; selCountry = null; selJourney = null; render();
  fitAll();
});
document.addEventListener('click', e=>{ if(!yearsEl.contains(e.target)) yearsEl.classList.remove('open'); });
// показать все перелёты выбранного периода
function fitAll(){
  // только то, что видно на текущей странице
  const A = page===0 ? ARCS : [], T = page===1 ? TRIPS : [];
  const C = page===2 ? VISITED_FC.features.flatMap(f=>f.geometry.coordinates[0]) : [];
  if(!A.length && !T.length && !C.length) return;
  rotating=false; rotBtnUpdate();
  if(view==='globe3d'){
    if(!globe) return;
    const a = [...A.flatMap(d=>[d.a,d.b]), ...T.flatMap(t=>[t.from,t.to]), ...C.map(([lon,lat])=>({lon,lat}))];
    const lat = a.reduce((s,p)=>s+p.lat,0)/a.length, lng = a.reduce((s,p)=>s+p.lon,0)/a.length;
    globe.pointOfView({lat, lng, altitude:2}, 1200); return;
  }
  if(!map) return;
  const pts = [...A.flatMap(d=>d.line), ...T.flatMap(t=>t.line), ...C];
  const lons = pts.map(c=>c[0]), lats = pts.map(c=>c[1]);
  map.fitBounds([[Math.min(...lons),Math.min(...lats)],[Math.max(...lons),Math.max(...lats)]], {padding:40, maxZoom:6, duration:1200});
}

// ---------- Render ----------
let yearFilter = lsGet('flights.year','all');
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
const isUpcoming = f => !!f.date && f.date > todayStr();
function untilLabel(date){
  const days = Math.round((new Date(date+'T00:00') - new Date(todayStr()+'T00:00'))/864e5);
  if(days===1) return 'завтра';
  const m = days%10, h = days%100;
  const w = (m===1 && h!==11) ? 'день' : (m>=2 && m<=4 && (h<12||h>14)) ? 'дня' : 'дней';
  return `через ${days} ${w}`;
}
const yearOf = f => f.date ? f.date.slice(0,4) : 'none';
function render(){
  renderYears();
  const arcs = [], used = {};
  for(const f of flights){
    if(yearFilter!=='all' && yearOf(f)!==yearFilter) continue;
    const a=BY_IATA[f.from], b=BY_IATA[f.to];
    if(!a||!b) continue;
    const up = isUpcoming(f);
    arcs.push({...f, a, b, up, km: dist(a,b), line: greatCircle(a,b)});
    for(const x of [a,b]) used[x.iata] = (used[x.iata]||0)+1;
  }
  // статистика — только по совершённым перелётам
  const done = arcs.filter(a=>!a.up), doneAp = new Set(done.flatMap(a=>[a.a.iata,a.b.iata]));
  ARCS = arcs;
  PTS = Object.entries(used).map(([k,n])=>({...BY_IATA[k], n}));
  if(selected!=null && !arcs.some(a=>a.id===selected)) selected=null;

  const total = done.reduce((s,a)=>s+a.km,0);
  FSTATS = [[done.length,'рейсов'], [kmShort(total),'км'], [doneAp.size,'аэроп.'], [new Set([...doneAp].map(k=>BY_IATA[k].country)).size,'стран']];
  renderTrips();
  renderCountries();
  updateMap(); updateGlobe();

  const s = arcs.find(a=>a.id===selected), st = TRIPS.find(t=>t.id===selTrip), sel = document.getElementById('sel');
  if(s){
    sel.hidden = false;
    document.getElementById('selRoute').classList.remove('plain');
    document.getElementById('selRoute').innerHTML = `${s.a.iata}<i>→</i>${s.b.iata}`;
    document.getElementById('selMeta').textContent = `${s.a.city} → ${s.b.city} · ${fmtKm(s.km)} км${s.date?' · '+fmtDate(s.date):''}${s.airline?' · '+s.airline:''}`;
  } else if(st){
    sel.hidden = false;
    document.getElementById('selRoute').classList.add('plain');
    document.getElementById('selRoute').textContent = `${MODES[st.mode].ico} ${st.from.name} → ${st.to.name}`;
    document.getElementById('selMeta').textContent = `${MODES[st.mode].name} · ${st.line && st.routed ? '' : '≈'}${fmtKm(st.km)} км${st.date?' · '+fmtDate(st.date):''}${st.note?' · '+st.note:''}`;
  } else if(J){
    const it = journeyItems(J.j);
    sel.hidden = false;
    document.getElementById('selRoute').classList.add('plain');
    document.getElementById('selRoute').textContent = `${J.j.countries.slice(0,4).map(flagEmoji).join(' ')} ${journeyTitle(J.j)}`;
    document.getElementById('selMeta').textContent = [fmtRange(J.j.start, J.j.end), it.f.length?`✈ ${it.f.length}`:'', it.t.length?`🚆 ${it.t.length}`:''].filter(Boolean).join(' · ');
  } else sel.hidden = true;
  renderChrome();
  updatePeek();

  const list = document.getElementById('list');
  if(!arcs.length){ list.innerHTML = flights.length ? '<div class="empty">За этот период перелётов нет.</div>' : '<div class="empty">Пока нет перелётов.<br>Нажмите «Добавить» — перелёт появится линией на карте.</div>'; return; }
  // предстоящие — сверху, ближайший первым; дальше прошедшие по годам
  const upcoming = arcs.filter(a=>a.up).sort((x,y)=> x.date.localeCompare(y.date));
  const past = arcs.filter(a=>!a.up).sort((x,y)=> (y.date||'').localeCompare(x.date||'') || y.id-x.id);
  let lastYear = null, html = '';
  if(upcoming.length) html += `<div class="year up">Предстоящие</div>`;
  for(const f of [...upcoming, ...past]){
    if(!f.up){
      const y = f.date ? f.date.slice(0,4) : 'Без даты';
      if(y!==lastYear){ html += `<div class="year">${y}</div>`; lastYear=y; }
    }
    html += `
    <div class="flight${f.id===selected?' active':''}${f.up?' upcoming':''}" data-id="${f.id}">
      <div class="info">
        <div class="route">${f.a.iata}<i>→</i>${f.b.iata}${f.up?`<span class="badge">${untilLabel(f.date)}</span>`:''}</div>
        <div class="meta">${esc(f.a.city)} → ${esc(f.b.city)} · ${fmtKm(f.km)} км${f.date?' · '+fmtDate(f.date):''}${f.airline?' · '+esc(f.airline):''}</div>
      </div>
      <button class="del" data-del="${f.id}" title="Удалить" type="button">×</button>
    </div>`;
  }
  list.innerHTML = html;
}

document.getElementById('list').addEventListener('click', e=>{
  const del = e.target.closest('[data-del]');
  if(del){
    e.stopPropagation();
    const f = flights.find(f=>f.id==del.dataset.del);
    if(f && confirm(`Удалить перелёт ${f.from} → ${f.to}?`)){ flights = flights.filter(x=>x!==f); save(); render(); }
    return;
  }
  const row = e.target.closest('.flight');
  if(row) selectFlight(+row.dataset.id);
});

// ---------- Autocomplete ----------
function search(q){
  q = q.trim().toLowerCase(); if(!q) return [];
  const exact=[], start=[], rest=[];
  for(const a of AIRPORTS){
    if(a.iata.toLowerCase()===q || a.icao.toLowerCase()===q) exact.push(a);
    else if(a.city.toLowerCase().startsWith(q) || a.name.toLowerCase().startsWith(q)) start.push(a);
    else if(rest.length<20 && (a.city.toLowerCase().includes(q) || a.name.toLowerCase().includes(q))) rest.push(a);
    if(exact.length+start.length > 30) break;
  }
  return [...exact,...start,...rest].slice(0,12);
}
function setupAC(input){
  const box = input.nextElementSibling; let items=[], idx=-1;
  const close=()=>{ box.style.display='none'; idx=-1; };
  const pick=a=>{ input.value = `${a.iata} — ${a.city}`; input.dataset.iata=a.iata; close(); };
  input.addEventListener('input', ()=>{
    input.dataset.iata='';
    items = search(input.value);
    if(!items.length){ close(); return; }
    box.innerHTML = items.map((a,i)=>`<div data-i="${i}"><span class="code">${a.iata}</span>${esc(a.city||a.name)}<div class="sub">${esc(a.name)} · ${a.country}</div></div>`).join('');
    box.style.display='block'; idx=-1;
  });
  input.addEventListener('keydown', e=>{
    if(box.style.display!=='block') return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault(); idx = (idx + (e.key==='ArrowDown'?1:-1) + items.length) % items.length;
      [...box.children].forEach((c,i)=>c.classList.toggle('active',i===idx));
    } else if(e.key==='Enter'){ e.preventDefault(); pick(items[Math.max(idx,0)]); }
    else if(e.key==='Escape') close();
  });
  box.addEventListener('pointerdown', e=>{ const d=e.target.closest('[data-i]'); if(d){ e.preventDefault(); pick(items[d.dataset.i]); } });
  input.addEventListener('blur', ()=> setTimeout(close,150));
}
function resolve(input){
  if(input.dataset.iata) return input.dataset.iata;
  const q = input.value.trim().split(/\s|—/)[0].toUpperCase();
  if(BY_IATA[q]) return q;
  const icao = AIRPORTS.find(a=>a.icao===q); return icao ? icao.iata : null;
}

// ---------- Form ----------
document.getElementById('form').addEventListener('submit', e=>{
  e.preventDefault();
  const fromEl=document.getElementById('from'), toEl=document.getElementById('to'), err=document.getElementById('err');
  const from=resolve(fromEl), to=resolve(toEl);
  if(!from||!to){ err.textContent='Выберите аэропорты из списка или введите IATA-код (например WAW).'; return; }
  if(from===to){ err.textContent='Аэропорты вылета и прилёта совпадают.'; return; }
  err.textContent='';
  const f = { id: Date.now(), from, to, date: document.getElementById('date').value, airline: document.getElementById('airline').value.trim() };
  flights.push(f); save();
  fromEl.value = toEl.value; fromEl.dataset.iata = to; toEl.value=''; toEl.dataset.iata=''; document.getElementById('airline').value='';
  if(isMobile()){ document.activeElement?.blur(); panel.classList.remove('adding'); }
  else toEl.focus();
  selectFlight(f.id);
});

// ---------- Export / import / clear ----------
document.getElementById('exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify({version:3, flights, trips, journeys},null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `flights-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
};
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = async e=>{
  const file = e.target.files[0]; if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    const inF = Array.isArray(data) ? data : Array.isArray(data?.flights) ? data.flights : null;
    const inT = Array.isArray(data?.trips) ? data.trips : [];
    const inJ = Array.isArray(data?.journeys) ? data.journeys : [];
    const cleanJ = inJ.filter(j=>j && Array.isArray(j.countries) && j.countries.length && /^\d{4}-\d{2}-\d{2}$/.test(j.start||''))
      .map((j,i)=>({id:Number(j.id)||Date.now()+9000+i, countries:j.countries.map(String), start:j.start, end:j.end||j.start, title:String(j.title||'')}));
    if(!inF) throw 0;
    const clean = inF.filter(f=>f && BY_IATA[f.from] && BY_IATA[f.to])
      .map((f,i)=>({id: Number(f.id)||Date.now()+i, from:f.from, to:f.to, date:String(f.date||''), airline:String(f.airline||'')}));
    const okP = p => p && isFinite(p.lat) && isFinite(p.lon) && p.name;
    const cleanT = inT.filter(t=>t && okP(t.from) && okP(t.to) && MODES[t.mode])
      .map((t,i)=>({id:Number(t.id)||Date.now()+5000+i, mode:t.mode, from:t.from, to:t.to, date:String(t.date||''), note:String(t.note||''),
                    km:+t.km||Math.round(dist(t.from,t.to)), line:Array.isArray(t.line)?t.line:null}));
    const replace = (flights.length || trips.length || journeys.length) && confirm(`Найдено перелётов: ${clean.length}, поездок: ${cleanT.length}, путешествий: ${cleanJ.length}.\nОК — заменить текущие, Отмена — добавить к ним.`);
    const ids = new Set(flights.map(f=>f.id)), tids = new Set(trips.map(t=>t.id));
    flights = replace ? clean : [...flights, ...clean.filter(f=>!ids.has(f.id))];
    trips = replace ? cleanT : [...trips, ...cleanT.filter(t=>!tids.has(t.id))];
    const jids = new Set(journeys.map(j=>j.id));
    journeys = replace ? cleanJ : [...journeys, ...cleanJ.filter(j=>!jids.has(j.id))];
    saveJourneys();
    save(); saveTrips(); render();
  }catch(_){ alert('Не удалось прочитать файл'); }
  e.target.value='';
};
document.getElementById('clearBtn').onclick = ()=>{
  if(page===0 && flights.length && confirm('Удалить все перелёты? Совет: сначала сделайте экспорт.')){ flights=[]; selected=null; save(); render(); }
  if(page===1 && trips.length && confirm('Удалить все поездки? Совет: сначала сделайте экспорт.')){ trips=[]; selTrip=null; saveTrips(); render(); }
  if(page===2 && journeys.length && confirm('Удалить все путешествия? Перелёты и поездки останутся.')){ journeys=[]; selJourney=null; saveJourneys(); render(); }
};

// ---------- Mobile bottom sheet ----------
let sheet = 'half';
const sheetTop = document.getElementById('sheetTop');
function sheetH(){ return panel.getBoundingClientRect().height; }
function peekH(){ return sheetTop.offsetHeight + 4 + (parseFloat(getComputedStyle(panel).paddingBottom)||0); }
function visibleFor(state){
  const H = sheetH();
  if(state==='peek') return peekH();
  if(state==='full') return H;
  return Math.min(H, Math.max(peekH()+180, innerHeight*0.5));
}
function applySheet(){
  if(!isMobile()){
    panel.style.removeProperty('--sheet-y');
    setMapInsets(panel.classList.contains('hidden') ? 0 : 392, 0);
    sizeGlobe(innerHeight); return;
  }
  const vis = visibleFor(sheet);
  panel.style.setProperty('--sheet-y', (sheetH()-vis)+'px');
  const covered = sheet==='full' ? visibleFor('half') : vis;
  // карта занимает весь экран (под шторкой и статус-баром), а центр смещается в видимую часть
  setMapInsets(0, covered);
  sizeGlobe(innerHeight - covered + 16);
}
function setMapInsets(left, bottom){
  if(!map) return;
  const top = isMobile() ? 56 : 0;
  const p = map.getPadding();
  if(p.left===left && p.bottom===bottom && p.top===top) return;
  map.easeTo({padding:{left, bottom, top, right:0}, duration: mapReady ? 300 : 0});
}
function setSheet(state){ sheet = state; applySheet(); }
function updatePeek(){ if(isMobile() && sheet==='peek') applySheet(); }
function sizeGlobe(h){
  h = Math.max(200, Math.round(h));
  document.getElementById('globe').style.height = h+'px';
  if(globe) globe.width(innerWidth).height(h);
}

let drag = null;
sheetTop.addEventListener('pointerdown', e=>{
  if(!isMobile() || e.target.closest('button')) return;
  drag = { x0:e.clientX, y0:e.clientY, start: sheetH()-visibleFor(sheet), moved:false };
  panel.classList.add('dragging'); sheetTop.setPointerCapture(e.pointerId);
});
sheetTop.addEventListener('pointermove', e=>{
  if(!drag) return;
  const dy = e.clientY - drag.y0; if(Math.abs(dy)>4) drag.moved = true;
  const y = Math.min(sheetH()-peekH(), Math.max(0, drag.start + dy));
  panel.style.setProperty('--sheet-y', y+'px');
});
function endDrag(e){
  if(!drag) return;
  panel.classList.remove('dragging');
  const dy = e.clientY - drag.y0, dx = e.clientX - drag.x0, moved = drag.moved; drag = null;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.3){   // свайп по шапке — смена страницы
    applySheet(); setPage(dx < 0 ? Math.min(2, page+1) : Math.max(0, page-1)); return;
  }
  const order = ['peek','half','full'];
  let i = order.indexOf(sheet);
  if(!moved) i = sheet==='peek' ? 1 : 0;
  else if(dy < -40) i = Math.min(2, i+1);
  else if(dy > 40) i = Math.max(0, i-1);
  if(order[i]==='peek') panel.classList.remove('adding');
  setSheet(order[i]);
}
sheetTop.addEventListener('pointerup', endDrag);
sheetTop.addEventListener('pointercancel', endDrag);

document.getElementById('addToggle').onclick = ()=>{
  const on = !panel.classList.contains('adding');
  panel.classList.toggle('adding', on);
  setSheet(on ? 'full' : 'half');
  if(on) setTimeout(()=>{
    if(page===2){ document.getElementById('jCountry').focus(); return; }
    const [f,t] = page===1 ? ['tFrom','tTo'] : ['from','to'];
    document.getElementById(document.getElementById(f).value ? t : f).focus();
  }, 320);
};

function saveTrips(){ try{ localStorage.setItem(TKEY, JSON.stringify(trips)); }catch(e){ alert('Не удалось сохранить в localStorage'); } }
const MODES = {
  train:{ ico:'🚆', name:'Поезд',   color:'#a066ff' },
  bus:  { ico:'🚌', name:'Автобус', color:'#22b573' },
  car:  { ico:'🚗', name:'Машина',  color:'#14b8a6' },
  ferry:{ ico:'⛴', name:'Паром',   color:'#3b8bff' },
};
const EMPTY_FC = {type:'FeatureCollection',features:[]};
let TRIPS = [], selTrip = null, selCountry = null;
let FSTATS = [], TSTATS = [], CSTATS = [];
let COUNTRY_GEO = null, countryLoading = null, countriesOnMap = false, VISITED = [], COUNTRIES = [];
let COUNTRY_PARTS = {}, VISITED_FC = EMPTY_FC, FLAGS_FC = EMPTY_FC, VISITED_PTS = {};
let page = Math.max(0, Math.min(2, parseInt(lsGet('flights.page','0'))||0));

function kmShort(n){ return n >= 100000 ? Math.round(n/1000)+'k' : fmtKm(n); }
function pluralRu(n, one, few, many){ const m=n%10, h=n%100; return (m===1&&h!==11)?one:(m>=2&&m<=4&&(h<12||h>14))?few:many; }
function flagEmoji(cc){ return cc && cc.length===2 ? String.fromCodePoint(...[...cc.toUpperCase()].map(c=>0x1F1E6+c.charCodeAt(0)-65)) : '🏳'; }
const countryName = (()=>{ try{ const dn = new Intl.DisplayNames(['ru'],{type:'region'}); return cc=>{ try{ return dn.of(cc) || cc; }catch(e){ return cc; } }; }catch(e){ return cc=>cc; } })();

// ---------- геоданные поездок ----------
function tripsGeo(){
  return {type:'FeatureCollection',features:(J ? J.trips : TRIPS).map(t=>({type:'Feature',properties:{id:t.id, mode:t.mode, up:!!t.up},
    geometry:{type:'LineString',coordinates:t.line}}))};
}
function tripPtsGeo(){
  const seen = new Map();
  for(const t of (J ? J.trips : TRIPS)) for(const p of [t.from,t.to]){
    const k = p.lat.toFixed(4)+','+p.lon.toFixed(4);
    if(!seen.has(k)) seen.set(k, {type:'Feature',properties:{name:p.name, mode:t.mode},geometry:{type:'Point',coordinates:[p.lon,p.lat]}});
  }
  return {type:'FeatureCollection',features:[...seen.values()]};
}

// ---------- список поездок ----------
function renderTrips(){
  TRIPS = trips.filter(t=> yearFilter==='all' || yearOf(t)===yearFilter)
    .map(t=>({...t, up:isUpcoming(t), routed: !!t.line, line: t.line || greatCircle(t.from, t.to, 24)}));
  if(selTrip!=null && !TRIPS.some(t=>t.id===selTrip)) selTrip = null;
  const done = TRIPS.filter(t=>!t.up);
  const places = new Set(done.flatMap(t=>[t.from.name, t.to.name]));
  const ccs = new Set(done.flatMap(t=>[t.from.cc, t.to.cc]).filter(Boolean));
  TSTATS = [[done.length,'поездок'], [kmShort(done.reduce((s,t)=>s+(t.km||0),0)),'км'], [places.size,'мест'], [ccs.size,'стран']];

  const list = document.getElementById('tripList');
  if(!TRIPS.length){
    list.innerHTML = trips.length ? '<div class="empty">За этот период поездок нет.</div>'
      : '<div class="empty">Пока нет поездок.<br>Нажмите «Добавить» — поезд, автобус, машина или паром.</div>';
    return;
  }
  const upcoming = TRIPS.filter(t=>t.up).sort((x,y)=>x.date.localeCompare(y.date));
  const past = TRIPS.filter(t=>!t.up).sort((x,y)=>(y.date||'').localeCompare(x.date||'') || y.id-x.id);
  let lastYear = null, html = upcoming.length ? '<div class="year up">Предстоящие</div>' : '';
  for(const t of [...upcoming, ...past]){
    if(!t.up){ const y = t.date ? t.date.slice(0,4) : 'Без даты'; if(y!==lastYear){ html += `<div class="year">${y}</div>`; lastYear=y; } }
    const m = MODES[t.mode] || MODES.train;
    html += `
    <div class="flight trip${t.id===selTrip?' active':''}${t.up?' upcoming':''}" data-tid="${t.id}">
      <div class="mode-ico">${m.ico}</div>
      <div class="info">
        <div class="route">${esc(t.from.name)} → ${esc(t.to.name)}${t.up?`<span class="badge">${untilLabel(t.date)}</span>`:''}</div>
        <div class="meta">${m.name} · ${t.routed?'':'≈'}${fmtKm(t.km||0)} км${t.date?' · '+fmtDate(t.date):''}${t.note?' · '+esc(t.note):''}</div>
      </div>
      <button class="del" data-tdel="${t.id}" title="Удалить" type="button">×</button>
    </div>`;
  }
  list.innerHTML = html;
}

// ---------- страны ----------
function renderCountries(){
  const m = {};
  const add = (cc, date, place, arrival, byAir)=>{
    if(!cc) return;
    const c = m[cc] || (m[cc] = {cc, arrivals:0, places:new Set(), first:null, last:null, air:false, ground:false});
    if(arrival) c.arrivals++;
    c.places.add(place);
    if(date){ if(!c.first || date<c.first) c.first=date; if(!c.last || date>c.last) c.last=date; }
    if(byAir) c.air = true; else c.ground = true;
  };
  for(const a of ARCS) if(!a.up){ add(a.a.country, a.date, a.a.iata, false, true); add(a.b.country, a.date, a.b.iata, true, true); }
  for(const t of TRIPS) if(!t.up){ add(t.from.cc, t.date, t.from.name, false, false); add(t.to.cc, t.date, t.to.name, true, false); }
  const today = todayStr();
  for(const j of journeys){
    if(j.start > today || (yearFilter!=='all' && j.start.slice(0,4)!==yearFilter)) continue;
    const it = journeyItems(j);
    for(const cc of j.countries){
      const c = m[cc] || (m[cc] = {cc, arrivals:0, places:new Set(), first:null, last:null, air:false, ground:false});
      c.trip = true;
      // визит засчитываем, только если в эти даты нет перелёта или поездки в эту страну (чтобы не считать дважды)
      const arrived = it.f.some(f=>BY_IATA[f.to]?.country===cc) || it.t.some(t=>t.to.cc===cc);
      if(!arrived) c.arrivals++;
      if(!c.first || j.start<c.first) c.first=j.start; if(!c.last || j.end>c.last) c.last=j.end;
    }
  }
  COUNTRIES = Object.values(m).sort((x,y)=>(y.last||'').localeCompare(x.last||'') || y.arrivals-x.arrivals);
  VISITED = COUNTRIES.map(c=>c.cc);
  const ptsBy = {};
  const addPt = (cc,lon,lat)=>{ if(cc) (ptsBy[cc] ||= []).push([lon,lat]); };
  for(const a of ARCS) if(!a.up){ addPt(a.a.country,a.a.lon,a.a.lat); addPt(a.b.country,a.b.lon,a.b.lat); }
  for(const t of TRIPS) if(!t.up){ addPt(t.from.cc,t.from.lon,t.from.lat); addPt(t.to.cc,t.to.lon,t.to.lat); }
  for(const c of COUNTRIES) if(!ptsBy[c.cc]) ptsBy[c.cc] = [];   // страны только из путешествий — закрашиваем материк
  VISITED_PTS = ptsBy;
  [VISITED_FC, FLAGS_FC] = Object.keys(COUNTRY_PARTS).length ? buildVisitedGeo(ptsBy) : [EMPTY_FC, EMPTY_FC];
  if(selCountry && !VISITED.includes(selCountry)) selCountry = null;
  if(selJourney!=null && !journeys.some(j=>j.id===selJourney)) selJourney = null;
  buildJ();
  CSTATS = [[COUNTRIES.length, pluralRu(COUNTRIES.length,'страна','страны','стран')],
            [Math.round(COUNTRIES.length/195*100)+'%', 'мира'],
            [COUNTRIES.filter(c=>c.air).length, 'самолётом'],
            [COUNTRIES.filter(c=>c.ground).length, 'наземно']];
  const list = document.getElementById('countryList');
  const jHtml = journeyRows();
  if(!COUNTRIES.length){ list.innerHTML = jHtml + '<div class="empty">Страны появятся, когда вы добавите перелёты, поездки или путешествия.</div>'; return; }
  list.innerHTML = jHtml + (jHtml ? '<div class="year">Страны</div>' : '') + COUNTRIES.map(c=>{
    const pl = [...c.places], more = pl.length>4 ? ` +${pl.length-4}` : '';
    const how = [c.air?'✈':'', c.ground?'🚆':'', c.trip?'🧳':''].join('');
    return `
    <div class="flight country${c.cc===selCountry?' active':''}" data-cc="${c.cc}">
      <div class="flag">${flagEmoji(c.cc)}</div>
      <div class="info">
        <div class="route">${esc(countryName(c.cc))}</div>
        <div class="meta">${how} ${esc(pl.slice(0,4).join(', '))}${more}${c.last?' · '+fmtDate(c.last):''}</div>
      </div>
      <div class="cnt">${c.arrivals ? c.arrivals+'×' : ''}</div>
    </div>`;
  }).join('');
}

// ======================================================================
//  Путешествия (страница Country): страны + даты, перелёты и поездки подтягиваются по датам

const JKEY = 'journeys.v1';
let journeys = (()=>{ try{ return JSON.parse(localStorage.getItem(JKEY)) || []; }catch(e){ return []; } })();
function saveJourneys(){ try{ localStorage.setItem(JKEY, JSON.stringify(journeys)); }catch(e){ alert('Не удалось сохранить в localStorage'); } }
let selJourney = null, J = null;   // J — данные выбранного путешествия для карты

function mkArc(f){
  const a=BY_IATA[f.from], b=BY_IATA[f.to]; if(!a||!b) return null;
  return {...f, a, b, up:isUpcoming(f), km:dist(a,b), line:greatCircle(a,b)};
}
function mkTrip(t){ return {...t, up:isUpcoming(t), routed:!!t.line, line: t.line || greatCircle(t.from, t.to, 24)}; }
const inRange = (d, j) => !!d && d >= j.start && d <= j.end;
function journeyItems(j){
  return { f: flights.filter(f=>inRange(f.date, j)), t: trips.filter(t=>inRange(t.date, j)) };
}
function journeyTitle(j){ return j.title || j.countries.map(countryName).join(', '); }
function fmtRange(a, b){
  if(!b || a===b) return fmtDate(a);
  const [y1,m1,d1]=a.split('-'), [y2,m2,d2]=b.split('-');
  if(y1!==y2) return `${d1}.${m1}.${y1} – ${d2}.${m2}.${y2}`;
  if(m1!==m2) return `${d1}.${m1} – ${d2}.${m2}.${y2}`;
  return `${d1}–${d2}.${m2}.${y2}`;
}
// данные выбранного путешествия: только его страны, перелёты и поездки
function buildJ(){
  const j = journeys.find(x=>x.id===selJourney);
  if(!j){ J = null; return; }
  const it = journeyItems(j);
  const arcs = it.f.map(mkArc).filter(Boolean), tr = it.t.map(mkTrip);
  const used = {};
  for(const a of arcs) for(const x of [a.a,a.b]) used[x.iata] = (used[x.iata]||0)+1;
  const pts = Object.entries(used).map(([k,n])=>({...BY_IATA[k], n}));
  // страны путешествия + точки внутри них (чтобы закрасить и острова, где были)
  const ptsBy = {}; for(const cc of j.countries) ptsBy[cc] = [];
  for(const a of arcs) for(const x of [a.a,a.b]) if(ptsBy[x.country]) ptsBy[x.country].push([x.lon,x.lat]);
  for(const t of tr) for(const x of [t.from,t.to]) if(ptsBy[x.cc]) ptsBy[x.cc].push([x.lon,x.lat]);
  const [fc, flags] = Object.keys(COUNTRY_PARTS).length ? buildVisitedGeo(ptsBy) : [EMPTY_FC, EMPTY_FC];
  J = { j, arcs, trips: tr, pts, fc, flags };
}
function journeyRows(){
  const list = journeys.filter(j=> yearFilter==='all' || j.start.slice(0,4)===yearFilter)
    .sort((a,b)=> b.start.localeCompare(a.start));
  if(!list.length) return '';
  const today = todayStr();
  return '<div class="year">Путешествия</div>' + list.map(j=>{
    const it = journeyItems(j), up = j.start > today;
    const parts = [fmtRange(j.start, j.end)];
    if(it.f.length) parts.push(`✈ ${it.f.length}`);
    if(it.t.length) parts.push(`🚆 ${it.t.length}`);
    return `
    <div class="flight journey${j.id===selJourney?' active':''}${up?' upcoming':''}" data-jid="${j.id}">
      <div class="flags">${j.countries.slice(0,3).map(flagEmoji).join('')}</div>
      <div class="info">
        <div class="route">${esc(journeyTitle(j))}${up?`<span class="badge">${untilLabel(j.start)}</span>`:''}</div>
        <div class="meta">${parts.join(' · ')}</div>
      </div>
      <button class="del" data-jdel="${j.id}" title="Удалить" type="button">×</button>
    </div>`;
  }).join('');
}

// по датам подсказываем страны из перелётов и поездок (кроме «домашней»)
function homeCountry(){
  const c = {};
  for(const f of flights){ for(const k of [f.from,f.to]){ const cc=BY_IATA[k]?.country; if(cc) c[cc]=(c[cc]||0)+1; } }
  for(const t of trips){ for(const x of [t.from,t.to]) if(x.cc) c[x.cc]=(c[x.cc]||0)+1; }
  return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0];
}
function jDatesChanged(){

function unwrapRing(ring){
  let prev = null;
  return ring.map(([lon,lat])=>{
    if(prev!==null){ while(lon-prev>180) lon-=360; while(lon-prev<-180) lon+=360; }
    prev = lon; return [lon,lat];
  });
}
function ringArea(r){ let a=0; for(let i=0,j=r.length-1;i<r.length;j=i++) a += (r[j][0]+r[i][0])*(r[j][1]-r[i][1]); return a/2; }
function inRing(x, y, r){
  let ins = false;
  for(let i=0,j=r.length-1;i<r.length;j=i++){
    const [xi,yi]=r[i], [xj,yj]=r[j];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) ins = !ins;
  }
  return ins;
}
function partHas(part, lon, lat){
  for(const x of [lon, lon+360, lon-360]){
    const [a,b,c,d] = part.bbox;
    if(x<a || x>c || lat<b || lat>d) continue;
    if(inRing(x, lat, part.rings[0])) return true;
  }
  return false;
}
function partDist(part, lon, lat){
  let best = Infinity; const r = part.rings[0], step = Math.max(1, Math.floor(r.length/200));
  for(let i=0;i<r.length;i+=step){ for(const x of [lon, lon+360, lon-360]){ const d=(r[i][0]-x)**2+(r[i][1]-lat)**2; if(d<best) best=d; } }
  return best;
}
function ringCentroid(r){
  let a=0, cx=0, cy=0;
  for(let i=0,j=r.length-1;i<r.length;j=i++){ const f=r[j][0]*r[i][1]-r[i][0]*r[j][1]; a+=f; cx+=(r[j][0]+r[i][0])*f; cy+=(r[j][1]+r[i][1])*f; }
  return a ? [cx/(3*a), cy/(3*a)] : r[0];
}
// какие части страны закрашивать: основная (материковая) часть + острова и территории, где вы были
// (Испания закрашивается без Канар, если на Канарах не были)
function buildVisitedGeo(pointsByCc){
  const feats = [], flags = [];
  for(const [cc, pts] of Object.entries(pointsByCc)){
    const parts = COUNTRY_PARTS[cc]; if(!parts) continue;
    const used = new Set();
    for(const [lon,lat] of pts){
      let i = parts.findIndex(p=>partHas(p, lon, lat));
      if(i<0){ let bd=Infinity; parts.forEach((p,k)=>{ const d=partDist(p,lon,lat); if(d<bd){ bd=d; i=k; } }); }
      if(i>=0) used.add(i);
    }
    let mainI = 0; parts.forEach((p,k)=>{ if(p.area > parts[mainI].area) mainI = k; });
    used.add(mainI);
    const biggest = parts[mainI];   // флаг ставим над основной частью страны
    for(const i of used){
      const p = parts[i];
      feats.push({type:'Feature',properties:{iso:cc},geometry:{type:'Polygon',coordinates:p.rings}});
    }
    if(biggest){
      let [x,y] = ringCentroid(biggest.rings[0]);
      if(!inRing(x, y, biggest.rings[0])){ const pt = pts.find(([lo,la])=>partHas(biggest,lo,la)); if(pt) [x,y] = pt; }
      while(x>180) x-=360; while(x<-180) x+=360;
      flags.push({type:'Feature',properties:{iso:cc, area:biggest.area},geometry:{type:'Point',coordinates:[x,y]}});
    }
  }
  return [{type:'FeatureCollection',features:feats}, {type:'FeatureCollection',features:flags}];
}

function loadCountries(){
  if(COUNTRY_GEO) return Promise.resolve();
  if(!countryLoading) countryLoading = (async ()=>{
    try{
      await loadScriptOnce('lib/topojson-client.min.js');

      const parts = {};
      for(const f of fc.features){
        const polys = f.geometry.type==='Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
        parts[f.id] = polys.map(poly=>{
          const rings = poly.map(unwrapRing);
          const outer = rings[0];
          let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
          for(const [x,y] of outer){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
          return { iso:f.id, rings, bbox:[minX,minY,maxX,maxY], area: Math.abs(ringArea(outer)) };
        });

}

const KIND_ICO = { station:'🚉', halt:'🚉', train_station:'🚉', bus_station:'🚏', bus_stop:'🚏', ferry_terminal:'⛴', city:'🏙', town:'🏘', village:'🏡' };
async function geoSearch(q, signal){
  const c = map ? map.getCenter() : {lat:50,lng:20};
  try{
    const r = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=8&lat=${c.lat.toFixed(2)}&lon=${c.lng.toFixed(2)}`, {signal});
    if(!r.ok) throw new Error('photon '+r.status);
    const j = await r.json();
    return j.features.map(f=>{
      const p = f.properties, [lon,lat] = f.geometry.coordinates;
      const city = (p.city && p.city!==p.name) ? p.city : null;
      return { name: p.name || p.city || q, sub: [city, p.state, p.country].filter(Boolean).join(', '),
               lat, lon, cc: (p.countrycode||'').toUpperCase(), kind: p.osm_value || p.type || '' };
    });
  }catch(e){
    if(signal.aborted) throw e;
    // запасной вариант — Nominatim
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&accept-language=ru&q=${encodeURIComponent(q)}`, {signal});
    const j = await r.json();
    return j.map(x=>{ const parts = x.display_name.split(',').map(s=>s.trim());
      return { name: x.name || parts[0], sub: parts.slice(1,4).join(', '), lat:+x.lat, lon:+x.lon,
               cc: (x.address?.country_code||'').toUpperCase(), kind: x.type || '' }; });
  }
}
function setupGeoAC(input){
  const box = input.nextElementSibling; let items = [], idx = -1, timer = null, ctrl = null;
  const close = ()=>{ box.style.display='none'; idx=-1; };
  const pick = p=>{ input.value = p.name; input._place = {name:p.name, sub:p.sub, lat:+p.lat.toFixed(5), lon:+p.lon.toFixed(5), cc:p.cc}; close(); };
  const show = html=>{ box.innerHTML = html; box.style.display='block'; };
  input.addEventListener('input', ()=>{
    input._place = null;
    clearTimeout(timer); ctrl?.abort();
    const q = input.value.trim();
    if(q.length < 2){ close(); return; }
    timer = setTimeout(async ()=>{
      ctrl = new AbortController();
      show('<div class="sub" style="cursor:default">Ищу…</div>');
      try{
        const res = await geoSearch(q, ctrl.signal);
        const seen = new Set();
        items = res.filter(p=>{ const k=p.name+'|'+p.sub; if(seen.has(k)) return false; seen.add(k); return true; });
        if(!items.length){ show('<div class="sub" style="cursor:default">Ничего не найдено</div>'); return; }
        show(items.map((p,i)=>`<div data-i="${i}"><span class="kind">${KIND_ICO[p.kind]||'📍'}</span>${esc(p.name)}<div class="sub">${esc(p.sub)}</div></div>`).join(''));
        idx = -1;
      }catch(e){ if(!ctrl.signal.aborted) show('<div class="sub" style="cursor:default">Нет связи с поиском — проверьте интернет</div>'); }
    }, 300);
  });
  input.addEventListener('keydown', e=>{
    if(box.style.display!=='block' || !items.length) return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault(); idx = (idx + (e.key==='ArrowDown'?1:-1) + items.length) % items.length;
      [...box.children].forEach((c,i)=>c.classList.toggle('active', i===idx));
    } else if(e.key==='Enter'){ e.preventDefault(); pick(items[Math.max(idx,0)]); }
    else if(e.key==='Escape') close();
  });
  box.addEventListener('pointerdown', e=>{ const d=e.target.closest('[data-i]'); if(d){ e.preventDefault(); pick(items[d.dataset.i]); } });
  input.addEventListener('blur', ()=> setTimeout(close,150));
}

    let lb=b.lon; if(lb-a.lon>180) lb-=360; else if(lb-a.lon<-180) lb+=360;
    for(const sh of [0, lb>180?-360:lb<-180?360:null]){
      if(sh===null) continue;
      const [x1,y1]=proj(a.lon+sh,a.lat), [x2,y2]=proj(lb+sh,b.lat);
      const d=Math.hypot(x2-x1,y2-y1)||1; let nx=-(y2-y1)/d, ny=(x2-x1)/d; if(ny>0){nx=-nx;ny=-ny;}
      const bend=Math.min(110,d*0.25);
      ctx.strokeStyle=ORANGE; ctx.globalAlpha=0.9; ctx.lineWidth=3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.quadraticCurveTo((x1+x2)/2+nx*bend,(y1+y2)/2+ny*bend,x2,y2); ctx.stroke();
      ctx.globalAlpha=1;
    }
    ends.set(a.iata, proj(a.lon,a.lat)); ends.set(b.iata, proj(b.lon,b.lat));
  }
  for(const [x,y] of ends.values()){ ctx.beginPath(); ctx.arc(x,y,7,0,7); ctx.fillStyle=INK; ctx.fill(); ctx.beginPath(); ctx.arc(x,y,3,0,7); ctx.fillStyle=PAPER; ctx.fill(); }
  ctx.restore();

  // поля талона
  const days=Math.floor(S.hours/24), hrs=Math.round(S.hours%24);
  const cols = [60, 400, 740];
  const rows = [
    [['Flights', String(S.list.length)], ['Distance', fmtN(S.km)+' km'], ['Airborne', days?`${days}d ${hrs}h`:`${Math.round(S.hours)}h`]],
    [['Airports', String(S.airports)], ['Countries', String(S.countries.length)], ['Airlines', String(S.airlines||'—')]],
    [['Longest', S.longest ? `${S.longest.f.from}–${S.longest.f.to}` : '—'], ['First flight', S.first ? fmtD(S.first) : '—'], ['Last flight', S.last ? fmtD(S.last) : '—']],
  ];
  rows.forEach((row,ri)=>{
    const y = 870 + ri*96;
    row.forEach(([l,v],ci)=>{ label(l, cols[ci], y); value(v, cols[ci], y+46, ri===2?34:46); });
  });

  // линия отрыва + вырезы
  ctx.save(); ctx.setLineDash([14,12]); ctx.strokeStyle='rgba(22,33,62,0.35)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(50,STUB_Y); ctx.lineTo(W-50,STUB_Y); ctx.stroke(); ctx.restore();

  // корешок: флаги + штрихкод
  label('Countries visited', 60, 1200);
  const flags = S.countries.slice(0,10), extra = S.countries.length-flags.length;
  let fx = 84;
  for(const cc of flags){
    ctx.save(); ctx.beginPath(); ctx.arc(fx,1248,24,0,7); ctx.fillStyle='#fff'; ctx.fill(); ctx.clip();
    ctx.font='58px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(flagEmoji(cc), fx, 1251); ctx.restore();
    ctx.beginPath(); ctx.arc(fx,1248,24,0,7); ctx.strokeStyle=PAPER; ctx.lineWidth=4; ctx.stroke();
    fx += 42;
  }
  if(extra>0){ ctx.beginPath(); ctx.arc(fx,1248,24,0,7); ctx.fillStyle=INK; ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='700 18px Inter, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('+'+extra,fx,1249); }
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  if(!flags.length){ ctx.fillStyle=INK2; ctx.font='500 26px Inter, sans-serif'; ctx.fillText('—', 60, 1258); }

  // штрихкод (уникален для набора перелётов)
  const seedStr = S.list.map(f=>f.from+f.to+(f.date||'')).join('|') + period;
  const R2 = rng(hash(seedStr)||1);
  let bx = 60; const bw = W-120;
  ctx.fillStyle=INK;
  while(bx < 60+bw){ const w = 2 + Math.floor(R2()*4)*2; if(R2()>0.42) ctx.fillRect(bx, 1300, Math.min(w, 60+bw-bx), 72); bx += w + 2; }
  ctx.fillStyle=INK2; ctx.font='500 22px "JetBrains Mono", monospace';
  const seq = String(hash(seedStr)%1000000).padStart(6,'0');
  ctx.fillText(`SEQ ${seq}  ·  HOME ${S.home}  ·  ISSUED ${fmtD(todayStr())}`, 60, 1410);

  ctx.restore();

  // вырезы по краям линии отрыва (прозрачные)
  ctx.save(); ctx.globalCompositeOperation='destination-out';
  for(const x of [0, W]){ ctx.beginPath(); ctx.arc(x, STUB_Y, 30, 0, 7); ctx.fill(); }
  ctx.restore();
}


  function loadLand(){
