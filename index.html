<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>Diary Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
  :root{
    --bg:#05070d; --glass:rgba(28,30,38,.72); --glass2:rgba(255,255,255,.08); --line:rgba(255,255,255,.08);
    --text:#eef1f8; --muted:#8a93a8; --accent:#ffb347; --accent2:#5ad1ff; --green:#3ddc84; --danger:#ff5f57;
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
    --ink:#1a1206;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  input,select,textarea{font:inherit;color:inherit}
  #map{position:fixed;inset:0;background:var(--bg)}
  .maplibregl-ctrl-attrib{font-size:10px}

  /* ---------- стекло ---------- */
  .glass{background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid rgba(255,255,255,.12)}
  .gcircle{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);flex:none}
  .gcircle svg{width:18px;height:18px}
  .plus{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--ink);flex:none;box-shadow:0 4px 18px rgba(255,179,71,.35)}
  .plus svg{width:20px;height:20px}
  #profileBtn{position:fixed;top:calc(12px + var(--safe-t));right:14px;z-index:6;width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
  #profileBtn svg{width:22px;height:22px}

  /* ---------- шторка / панель ---------- */
  #panel{position:fixed;z-index:5;display:flex;flex-direction:column;overflow:hidden;border-radius:30px}
  .grip{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);margin:9px auto 0;flex:none}
  .dots{display:flex;gap:7px;justify-content:center;padding:10px 0 2px;flex:none}
  .dots button{height:7px;width:7px;border-radius:4px;background:rgba(255,255,255,.25);transition:all .25s}
  .dots button.on{width:20px;background:var(--accent)}
  .track{flex:1;display:flex;min-height:0;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
  .page{flex:0 0 100%;width:100%;display:flex;flex-direction:column;min-height:0}
  .pg-head{display:flex;align-items:center;gap:10px;padding:10px 18px 12px}
  .pg-head h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.02em;flex:1;white-space:nowrap}
  .pg-head h1 span{color:var(--accent)}
  .chip{height:40px;padding:0 14px;border-radius:20px;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);font-size:14px;font-weight:500;white-space:nowrap}
  .chip svg{width:15px;height:15px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 18px 10px;cursor:pointer}
  .tile{background:rgba(255,255,255,.06);border-radius:14px;padding:9px 4px;text-align:center;min-width:0}
  .tile b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile small{display:block;font-size:9px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px;white-space:nowrap}
  .tiles:hover .tile{background:rgba(255,255,255,.09)}
  .list{flex:1;overflow-y:auto;min-height:0;padding:0 0 calc(24px + var(--safe-b));-webkit-overflow-scrolling:touch}
  .sec{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 18px 6px;position:sticky;top:0;z-index:1;background:linear-gradient(rgba(24,26,33,.96),rgba(24,26,33,.85))}
  .sec.blue{color:var(--accent2)}
  .row{display:flex;gap:12px;padding:10px 18px;cursor:pointer;border-bottom:1px solid var(--line);align-items:flex-start;position:relative}
  .row:hover{background:rgba(255,255,255,.03)}
  .row.on{background:rgba(255,179,71,.13)}
  .row.on.green{background:rgba(61,220,132,.14)}
  .row .main{flex:1;min-width:0}
  .row .top{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);font-weight:500}
  .row .top .num{font-weight:600}
  .row .top .date{margin-left:auto;white-space:nowrap}
  .row .title{font-size:17px;font-weight:600;margin:3px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .title.up{color:#ccd2de}
  .row .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .lead{width:50px;flex:none;display:flex;justify-content:center;align-items:center;gap:4px;min-height:40px;font-size:28px}
  .row .more{opacity:0;position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center}
  .row:hover .more{opacity:1}
  .chips{display:flex;gap:6px;overflow:hidden}
  .ch{font-size:12.5px;font-weight:500;color:#d7dbe4;border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:3px 9px;white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
  .badge{font-size:11px;font-weight:600;color:var(--accent2);background:rgba(90,209,255,.13);border-radius:6px;padding:2px 6px;white-space:nowrap}
  .logo{width:44px;height:44px;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;margin-top:2px}
  .logo img{max-width:100%;max-height:100%;object-fit:contain;filter:brightness(0) invert(1)}
  .logo.sm{width:22px;height:22px;font-size:9px;margin:0}
  .empty{padding:40px 30px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
  .empty .ico{font-size:34px;margin-bottom:8px}
  .selcard{margin:0 18px 8px;padding:12px;border-radius:16px;background:rgba(255,179,71,.13);border:1px solid rgba(255,179,71,.35);display:flex;align-items:center;gap:12px}
  .selcard .main{flex:1;min-width:0}
  .selcard b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .selcard small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .selcard .more-btn{color:var(--accent);font-weight:600;font-size:13px}
  .xbtn{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;color:var(--muted);flex:none}
  .flag{display:inline-block;line-height:1}
  .rflag{display:inline-block;vertical-align:middle;border-radius:3px}

  /* меню выбора года */
  .menu{position:absolute;z-index:30;min-width:170px;padding:6px;border-radius:14px;max-height:50vh;overflow:auto}
  .menu button{display:flex;width:100%;padding:9px 12px;border-radius:9px;font-size:15px;justify-content:space-between;gap:12px}
  .menu button:hover,.menu button.on{background:rgba(255,255,255,.1)}
  .menu button.on::after{content:'✓';color:var(--accent)}

  /* ---------- телефон: шторка снизу ---------- */
  @media (max-width: 760px){
    #panel{left:8px;right:8px;bottom:calc(6px + var(--safe-b));top:auto;height:calc(100% - 70px - var(--safe-t));
      transition:transform .35s cubic-bezier(.2,.8,.2,1);touch-action:none;border-radius:32px}
    #panel.dragging{transition:none}
    .list{touch-action:pan-y}
  }
  /* ---------- компьютер: панель слева ---------- */
  @media (min-width: 761px){
    #panel{top:16px;left:16px;bottom:16px;width:410px}
    .grip{display:none}
  }

  /* ---------- окна ---------- */
  body.modal-open #panel, body.modal-open #profileBtn{pointer-events:none}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
  @keyframes fade{from{opacity:0}}
  @keyframes up{from{transform:translateY(40px);opacity:.4}}
  .mbox{width:100%;max-width:560px;max-height:calc(100% - 30px - var(--safe-t));background:#1c1d22;border-radius:28px 28px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .25s cubic-bezier(.2,.8,.2,1);border:1px solid rgba(255,255,255,.08)}
  .mbox.tall{height:calc(100% - 30px - var(--safe-t))}
  @media (min-width: 761px){ .modal{align-items:center} .mbox{border-radius:24px;max-height:min(860px,calc(100% - 60px))} .mbox.tall{height:min(860px,calc(100% - 60px))} .mbox.wide{max-width:760px} }
  .mhead{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;flex:none}
  .mhead h2{flex:1;text-align:center;margin:0;font-size:17px;font-weight:600}
  .mbtn{height:38px;padding:0 16px;border-radius:19px;background:rgba(255,255,255,.1);color:var(--accent);font-weight:500;font-size:16px;white-space:nowrap}
  .mbtn.primary{font-weight:700}
  .mbtn:disabled{opacity:.4;cursor:default}
  .mbody{overflow-y:auto;padding:4px 16px calc(24px + var(--safe-b));flex:1}
  .grp{background:rgba(255,255,255,.06);border-radius:14px;margin:12px 0 6px;overflow:hidden}
  .grp > *{border-bottom:1px solid var(--line)}
  .grp > *:last-child{border-bottom:0}
  .ghead{font-size:13px;color:var(--muted);margin:18px 4px -4px;font-weight:500}
  .gfoot{font-size:12.5px;color:var(--muted);margin:2px 4px 6px;line-height:1.45}
  .gi{display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:46px;width:100%;text-align:left}
  .gi .lbl{color:var(--muted);flex:none}
  .gi .val{margin-left:auto;display:flex;gap:8px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap}
  .gi .code{font-family:"JetBrains Mono",monospace;color:var(--accent)}
  .gi input,.gi select{flex:1;background:none;border:0;outline:0;font-size:16px;min-width:0}
  .gi input::placeholder{color:#6b7385}
  .gi select{appearance:none;text-align:right;color:var(--muted)}
  .gi.link{color:var(--accent)}
  .gi.danger{color:var(--danger);justify-content:center}
  .gi.note{font-size:13px;color:var(--muted);display:block;line-height:1.45}
  .gi.err{color:var(--danger);font-size:13px}
  .gi.ok{color:var(--green)}
  .gi.blue{color:var(--accent2);font-size:13px}
  .toggle{margin-left:auto;width:51px;height:31px;border-radius:16px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .2s}
  .toggle::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
  .toggle.on{background:var(--accent)}
  .toggle.on::after{transform:translateX(20px)}
  .search{display:flex;align-items:center;gap:8px;margin:2px 0 6px;padding:0 12px;height:40px;border-radius:12px;background:rgba(255,255,255,.1)}
  .search input{flex:1;background:none;border:0;outline:0;font-size:16px}
  .seg{display:flex;background:rgba(255,255,255,.08);border-radius:10px;padding:2px;margin:10px 0}
  .seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:500;display:flex;gap:5px;justify-content:center;align-items:center}
  .seg button.on{background:rgba(255,255,255,.18)}
  .pchips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
  .pchips::-webkit-scrollbar{display:none}
  .pchips button{height:34px;padding:0 14px;border-radius:17px;background:rgba(255,255,255,.1);font-size:14px;font-weight:600;white-space:nowrap}
  .pchips button.on{background:var(--accent);color:var(--ink)}
  .check{margin-left:auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:#06210f;background:var(--green);flex:none}
  .check.auto{background:#5b6273;color:#fff}
  .found{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
  .found .days{width:48px;text-align:center;flex:none}
  .found .days b{display:block;font-size:24px;font-weight:700}
  .found .days small{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:600}
  .found .t{font-size:15px;font-weight:600;display:flex;gap:12px}
  .found .m{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
  .found.on{background:rgba(255,179,71,.12)}
  details.how summary{cursor:pointer;color:var(--accent);padding:12px 14px;list-style:none}
  details.how summary::-webkit-details-marker{display:none}
  details.how ol{margin:0;padding:0 14px 12px 34px;font-size:14px;line-height:1.5}
  details.how ol li{margin:4px 0}

  /* карточки (детали рейса, статистика) */
  .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:16px;margin:12px 0}
  .card h3{margin:0 0 12px;font-size:19px;font-weight:700;display:flex;gap:8px;align-items:center}
  .big{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .big b{display:block;font-size:26px;font-weight:700;letter-spacing:-.01em}
  .big small{font-size:12px;color:var(--muted)}
  .hbar{margin:10px 0}
  .hbar .hl{display:flex;gap:8px;align-items:center;font-size:15px;font-weight:600}
  .hbar .hl .n{margin-left:auto;font-weight:700}
  .hbar .hl .s{font-size:12px;color:var(--muted);font-weight:500}
  .hbar .tr{height:8px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden}
  .hbar .tr i{display:block;height:100%;border-radius:4px;background:var(--accent)}
  .vbars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:16px}
  .vbars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
  .vbars .c i{display:block;width:100%;max-width:38px;border-radius:6px 6px 2px 2px;background:linear-gradient(var(--accent),#e88e2a);min-height:2px}
  .vbars .c small{font-size:10.5px;color:var(--muted);white-space:nowrap}
  .vbars .c em{font-style:normal;font-size:10.5px;color:var(--muted)}
  .vbars.blue .c i{background:linear-gradient(var(--accent2),#2f9fd0)}
  .vbars.green .c i{background:linear-gradient(var(--green),#21a35e)}
  .boxes{display:grid;gap:4px}
  .boxes > div{background:rgba(255,255,255,.05);border-radius:10px;padding:8px 4px;text-align:center}
  .boxes > div.hot{background:rgba(255,179,71,.18)}
  .boxes b{display:block;font-size:18px}
  .boxes small{font-size:11px;color:var(--muted)}
  .donut{display:flex;gap:16px;align-items:center}
  .donut ul{list-style:none;margin:0;padding:0;font-size:14px;line-height:1.7}
  .donut i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  .seatmap{position:relative;width:100%;aspect-ratio:1327/610}
  .seatmap img,.seatmap canvas{position:absolute;inset:0;width:100%;height:100%}
  .seatmap img{opacity:.55}
  .prog{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0 10px}
  .prog i{display:block;height:100%;background:var(--accent2)}
  .route{display:flex;align-items:center;gap:8px}
  .route .end b{display:block;font-size:34px;font-weight:800}
  .route .end small{display:block;font-size:12px;color:var(--muted)}
  .route .mid{flex:1;text-align:center;font-size:12px;color:var(--muted)}
  .route .mid .pl{color:var(--accent);font-size:20px}
  .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .kv small{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
  .kv b{font-size:16px}
  .btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;height:48px;border-radius:14px;background:rgba(255,255,255,.1);font-weight:600;margin-top:10px}
  .btn.red{color:var(--danger)}
  .btn.acc{background:var(--accent);color:var(--ink)}

  /* поделиться */
  .pcard{width:100%;max-height:52vh;display:flex;justify-content:center;position:relative;margin:4px 0 10px}
  .pcard canvas{max-width:100%;max-height:52vh;height:auto;filter:drop-shadow(0 12px 24px rgba(0,0,0,.45))}
  .ploading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}

  .toast{position:fixed;left:50%;top:calc(16px + var(--safe-t));transform:translateX(-50%);z-index:80;padding:10px 16px;border-radius:14px;font-size:14px;max-width:90%}
  .maplibregl-popup-content{background:#1c1d22;color:var(--text);border-radius:12px;font-size:13px}
  .maplibregl-popup-tip{border-top-color:#1c1d22!important;border-bottom-color:#1c1d22!important}
  @media (hover:none){ .row .more{display:none} }
  .mbox.dlg{max-width:400px}
  .prog.lap{height:12px;border-radius:6px;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
  .prog.lap.full{background:linear-gradient(180deg, rgba(255,255,255,.22), rgba(0,0,0,.08)), var(--c)}
  .prog.lap i{border-radius:6px;background:linear-gradient(180deg, rgba(255,255,255,.25), rgba(0,0,0,.12)), var(--c);
    box-shadow:0 1px 3px rgba(0,0,0,.45), 3px 0 6px rgba(0,0,0,.35)}
  .sub-t{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .lchart .plot{position:relative;height:120px;margin:14px 0 6px}
  .lchart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .lchart polyline{fill:none;stroke:var(--accent2);stroke-width:2.5;stroke-linejoin:round}
  .lchart i{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--accent2);transform:translate(-50%,-50%)}
  .lchart em{position:absolute;transform:translate(-50%,-170%);font:normal 11px Inter,sans-serif;color:var(--text);white-space:nowrap}
  .lchart .xl{display:flex;gap:6px}
  .lchart .xl small{flex:1;text-align:center;font-size:10.5px;color:var(--muted);min-width:0}
  .layerseg{margin:2px 0 8px}
  .city-row .lead{font-size:20px}

  img.plane.hero{display:block;width:100%;max-width:460px;height:auto;margin:2px auto 12px}
  img.plane.mini{width:52px;height:18px;object-fit:contain;flex:none;margin-right:8px}
  @media (max-width:760px){ .mbox.dlg{margin:0 8px calc(8px + var(--safe-b));border-radius:24px} }
  .gi[disabled]{cursor:default}
  .menu hr{display:block}
  #profileBtn{color:#fff}
  .row .lead .flag{font-size:inherit}
</style>
</head>
<body>
<div id="map"></div>

<button id="profileBtn" class="glass" aria-label="Профиль"></button>

<div id="panel" class="glass">
  <div class="grip"></div>
  <div class="dots" id="dots"><button data-p="0" class="on" aria-label="Fly"></button><button data-p="1" aria-label="Country"></button></div>
  <div class="track" id="track">
    <section class="page" id="pFly">
      <div class="pg-head">
        <h1>Diary <span>Fly</span></h1>
        <button class="gcircle" id="flyShare" aria-label="Поделиться"></button>
        <button class="chip" id="yearBtn"></button>
        <button class="plus" id="addFlight" aria-label="Добавить перелёт"></button>
      </div>
      <div class="tiles" id="flyTiles"></div>
      <div id="selCard"></div>
      <div class="list" id="flyList"></div>
    </section>
    <section class="page" id="pCountry">
      <div class="pg-head">
        <h1>Diary <span>Country</span></h1>
        <button class="gcircle" id="countryShare" aria-label="Поделиться"></button>
        <button class="plus" id="addCountry" aria-label="Добавить"></button>
      </div>
      <div class="tiles" id="countryTiles"></div>
      <div class="seg layerseg" id="layerSeg"><button data-l="countries">🗺 Страны</button><button data-l="cities">📍 Города</button></div>
      <div class="list" id="countryList"></div>
    </section>
  </div>
</div>

<canvas id="passCv" width="1080" height="1440" hidden></canvas>

<script src="lib/maplibre-gl.js"></script>
<script>
// =====================================================================
//  Diary Travel — веб-версия, повторяет приложение для iPhone
// =====================================================================
const $ = s => document.querySelector(s);
const isMobile = () => matchMedia('(max-width: 760px)').matches;
const RAD = Math.PI/180;

// ---------- иконки (линейные, как SF Symbols) ----------
const ICON = {

// ---------- утилиты ----------
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function lsGet(k,d){ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function loadJ(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } }
function saveJ(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ toast('Не удалось сохранить: '+e.message); } }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function dist(a,b){ const dLat=(b.lat-a.lat)*RAD, dLon=(b.lon-a.lon)*RAD; const h=Math.sin(dLat/2)**2+Math.cos(a.lat*RAD)*Math.cos(b.lat*RAD)*Math.sin(dLon/2)**2; return 2*6371*Math.asin(Math.min(1,Math.sqrt(h))); }
function greatCircle(a,b,n){
  const v = p=>[Math.cos(p.lat*RAD)*Math.cos(p.lon*RAD), Math.cos(p.lat*RAD)*Math.sin(p.lon*RAD), Math.sin(p.lat*RAD)];
  const A=v(a), B=v(b), d=Math.acos(Math.max(-1,Math.min(1,A[0]*B[0]+A[1]*B[1]+A[2]*B[2])));
  if(d<1e-6) return [[a.lon,a.lat],[b.lon,b.lat]];
  n = n || Math.max(16, Math.round(d/RAD*1.5));
  const out=[]; let prev=null;
  for(let i=0;i<=n;i++){
    const f=i/n, s1=Math.sin((1-f)*d)/Math.sin(d), s2=Math.sin(f*d)/Math.sin(d);
    const x=s1*A[0]+s2*B[0], y=s1*A[1]+s2*B[1], z=s1*A[2]+s2*B[2];
    let lon=Math.atan2(y,x)/RAD; const lat=Math.atan2(z,Math.hypot(x,y))/RAD;
    if(prev!==null){ while(lon-prev>180) lon-=360; while(lon-prev<-180) lon+=360; }
    out.push([lon,lat]); prev=lon;
  }
  return out;
}
const fmtKm = n => Math.round(n).toLocaleString('ru-RU');
const kmShort = n => n >= 100000 ? Math.round(n/1000)+'k' : fmtKm(n);
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return `${d}.${m}.${y}`; }
const MON_RU = ['янв.','февр.','мар.','апр.','мая','июня','июля','авг.','сент.','окт.','нояб.','дек.'];
function dateShort(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return `${+d} ${MON_RU[+m-1]} ${y}`; }
function plural(n, one, few, many){ const m=n%10, h=n%100; return (m===1&&h!==11)?one:(m>=2&&m<=4&&(h<12||h>14))?few:many; }
function hm(min){ const h=Math.floor(min/60), m=min%60; return h>0 ? `${h}ч ${m}м` : `${m}м`; }
const estMin = km => Math.round(km/800*60 + 30);
function daysUntil(date){ const a=new Date(todayStr()+'T00:00'), b=new Date(date+'T00:00'); return Math.round((b-a)/864e5); }
function untilLabel(date){ const n=daysUntil(date); if(n<=0) return 'сегодня'; if(n===1) return 'завтра'; return `через ${n} ${plural(n,'день','дня','дней')}`; }
function flagEmoji(cc){ return cc && /^[A-Z]{2}$/.test(cc) ? String.fromCodePoint(...[...cc].map(c=>0x1F1E6+c.charCodeAt(0)-65)) : ''; }
function toast(msg, ms=2600){ const t=document.createElement('div'); t.className='toast glass'; t.textContent=msg; document.body.append(t); setTimeout(()=>t.remove(), ms); }
const yearOf = f => f.date ? f.date.slice(0,4) : 'none';

// ---------- страны, территории, острова ----------
const SOVEREIGN = new Set(`AF AL DZ AD AO AG AR AM AU AT AZ BS BH BD BB BY BE BZ BJ BT BO BA BW BR BN BG BF BI CV KH CM CA CF TD CL CN CO KM CG CD CR CI HR CU CY CZ DK DJ DM DO EC EG SV GQ ER EE SZ ET FJ FI FR GA GM GE DE GH GR GD GT GN GW GY HT HN HU IS IN ID IR IQ IE IL IT JM JP JO KZ KE KI KP KR KW KG LA LV LB LS LR LY LI LT LU MG MW MY MV ML MT MH MR MU MX FM MD MC MN ME MA MZ MM NA NR NP NL NZ NI NE NG MK NO OM PK PW PA PG PY PE PH PL PT QA RO RU RW KN LC VC WS SM ST SA SN RS SC SL SG SK SI SB SO ZA SS ES LK SD SR SE CH SY TJ TZ TH TL TG TO TT TN TR TM TV UG UA AE GB US UY UZ VU VE VN YE ZM ZW VA PS XK TW`.split(/\s+/));
const REGIONS = { 'ES-CN':['Канарские острова','ES'], 'ES-IB':['Балеарские острова','ES'], 'PT-30':['Мадейра','PT'], 'PT-20':['Азорские острова','PT'] };
const isCountry = cc => SOVEREIGN.has(cc);
const isRegion = cc => !!REGIONS[cc];
const countryName = (()=>{ let dn=null; try{ dn=new Intl.DisplayNames(['ru'],{type:'region'}); }catch(e){} const cache={};
  return cc => cache[cc] ??= (REGIONS[cc]?.[0] || (dn && /^[A-Z]{2}$/.test(cc) ? dn.of(cc) : cc) || cc); })();

/** флаг островов-регионов, у которых нет эмодзи: рисуем упрощённо */
function drawRegionFlag(ctx, cc, x, y, w, h){
  const f=(c,a,b,cw,ch)=>{ ctx.fillStyle=c; ctx.fillRect(a,b,cw,ch); };
  if(cc==='ES-CN'){ f('#fff',x,y,w/3,h); f('#0768A9',x+w/3,y,w/3,h); f('#FFCC00',x+2*w/3,y,w/3+1,h); }
  else if(cc==='PT-30'){ f('#0033A0',x,y,w,h); f('#FFD100',x+w/4,y,w/2,h); const cx=x+w/2, cy=y+h/2, s=h*.36, t=s*.36;
    f('#D52B1E',cx-t/2,cy-s/2,t,s); f('#D52B1E',cx-s/2,cy-t/2,s,t); f('#fff',cx-t/6,cy-s/2.6,t/3,s/1.3); f('#fff',cx-s/2.6,cy-t/6,s/1.3,t/3); }
  else if(cc==='PT-20'){ f('#fff',x,y,w,h); f('#0F47AF',x,y,w*.4,h); ctx.fillStyle='#C9A227'; ctx.beginPath(); ctx.arc(x+w*.4,y+h/2,h*.14,0,7); ctx.fill(); }
  else { f('#FCDD09',x,y,w,h); const hh=h/9; for(let i=1;i<9;i+=2) f('#DA121A',x,y+i*hh,w,hh); f('#5E2C79',x,y,w*.4,hh*5); f('#fff',x+w*.14,y+hh*1.6,w*.12,hh*1.8); }
}
const rflagCache = {};
function regionFlagURL(cc){
  if(rflagCache[cc]) return rflagCache[cc];
  const c=document.createElement('canvas'); c.width=48; c.height=32; const x=c.getContext('2d');
  drawRegionFlag(x, cc, 0, 0, 48, 32); return rflagCache[cc]=c.toDataURL();
}
/** флаг для списков: эмодзи или картинка для острова */
function flagHTML(cc, size=24){
  if(isRegion(cc)) return `<img class="rflag" src="${regionFlagURL(cc)}" style="width:${Math.round(size*1.05)}px;height:${Math.round(size*.7)}px" alt="">`;
  return `<span class="flag" style="font-size:${size}px">${flagEmoji(cc)}</span>`;
}

// ---------- данные (формат как у приложения и старого сайта) ----------
let flights  = loadJ('flights.v1', []);
let trips    = loadJ('trips.v1', []);
let journeys = loadJ('journeys.v1', []);
let manual   = loadJ('countries.v1', []);
function saveFlights(){ saveJ('flights.v1', flights); refresh(); }
function saveTrips(){ saveJ('trips.v1', trips); refresh(); }
function saveJourneys(){ saveJ('journeys.v1', journeys); refresh(); }
function saveManual(){ saveJ('countries.v1', manual); refresh(); }

let AIRPORTS = [], BY_IATA = {}, BY_ICAO = {}, AIRLINES = {};
let PARTS = {}, REGION_BOX = {};   // контуры стран: PARTS[cc] = [{rings, bbox, area}], часть 0 — основная

async function loadData(){
  const [ap, al, ct] = await Promise.all([
    fetch('airports.json').then(r=>r.json()),
    fetch('airlines.json').then(r=>r.json()).catch(()=>({})),
    fetch('countries.json').then(r=>r.json()).catch(()=>({})),
  ]);
  AIRPORTS = ap.map(([iata,icao,name,city,country,lat,lon])=>({iata,icao,name,city,country,lat,lon}));
  for(const a of AIRPORTS){ BY_IATA[a.iata] ??= a; if(a.icao) BY_ICAO[a.icao.toUpperCase()] ??= a; }
  AIRLINES = al;
  for(const [cc, parts] of Object.entries(ct)){
    PARTS[cc] = parts.map(rings=>{
      const r=rings[0]; let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
      for(const [x,y] of r){ if(x<a)a=x; if(x>c)c=x; if(y<b)b=y; if(y>d)d=y; }
      return { rings, bbox:[a,b,c,d], area:(c-a)*(d-b) };
    });
  }
  for(const code of Object.keys(REGIONS)){
    const ps=PARTS[code]; if(!ps) continue;
    REGION_BOX[code] = [Math.min(...ps.map(p=>p.bbox[0]))-.3, Math.min(...ps.map(p=>p.bbox[1]))-.3,
                        Math.max(...ps.map(p=>p.bbox[2]))+.3, Math.max(...ps.map(p=>p.bbox[3]))+.3];
  }
}

function regionOf(lon, lat, parent){
  for(const [code,[,par]] of Object.entries(REGIONS)){
    if(par!==parent) continue; const b=REGION_BOX[code];
    if(b && lon>=b[0] && lon<=b[2] && lat>=b[1] && lat<=b[3]) return code;
  }
  return null;
}
function inRing(x,y,r){ let ins=false; for(let i=0,j=r.length-1;i<r.length;j=i++){ const [xi,yi]=r[i],[xj,yj]=r[j]; if(((yi>y)!==(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi)) ins=!ins; } return ins; }
function partIndex(cc, lon, lat){
  const ps=PARTS[cc]; if(!ps) return -1;
  const i=ps.findIndex(p=>{ const [a,b,c,d]=p.bbox; return lon>=a&&lon<=c&&lat>=b&&lat<=d && inRing(lon,lat,p.rings[0]); });
  if(i>=0) return i;
  let best=-1, bd=Infinity;
  ps.forEach((p,k)=>{ const r=p.rings[0], st=Math.max(1,Math.floor(r.length/150)); for(let j=0;j<r.length;j+=st){ const dd=(r[j][0]-lon)**2+(r[j][1]-lat)**2; if(dd<bd){ bd=dd; best=k; } } });
  return bd < 4 ? best : -1;
}
function centroid(cc){
  const ps=PARTS[cc]; if(!ps) return null;
  if(isRegion(cc)){ const b=REGION_BOX[cc]; return [(b[0]+b[2])/2,(b[1]+b[3])/2]; }
  const r=ps[0].rings[0]; let a=0,x=0,y=0;
  for(let i=0,j=r.length-1;i<r.length;j=i++){ const f=r[j][0]*r[i][1]-r[i][0]*r[j][1]; a+=f; x+=(r[j][0]+r[i][0])*f; y+=(r[j][1]+r[i][1])*f; }
  if(a){ const c=[x/(3*a), y/(3*a)]; if(inRing(c[0],c[1],r)) return c; }
  const [b0,b1,b2,b3]=ps[0].bbox, m=[(b0+b2)/2,(b1+b3)/2];
  return inRing(m[0],m[1],r) ? m : r[Math.floor(r.length/2)];
}

// ---------- перелёты как дуги ----------
function mkArc(f){
  const a=BY_IATA[f.from], b=BY_IATA[f.to]; if(!a||!b) return null;
  return { f, a, b, km:dist(a,b), up: !!f.date && f.date > todayStr(), id:f.id };
}
const allArcs = () => flights.map(mkArc).filter(Boolean);
const doneArcs = () => allArcs().filter(x=>!x.up);
const arcMin = a => a.f.durMin > 0 ? a.f.durMin : estMin(a.km);

// ---------- авиакомпании ----------
function parseAirline(text){
  const t=(text||'').trim().toUpperCase(); if(!t) return null;
  const m=t.match(/^([A-Z0-9]{2})\s*(\d{1,4}[A-Z]?)$/);
  if(m && /[A-Z]/.test(m[1])) return {code:m[1], number:m[2]};
  if(t.length===2 && AIRLINES[t]) return {code:t, number:null};
  const norm=t.toLowerCase().replace(/[^a-zа-я]/g,''); if(norm.length<3) return null;
  for(const code of ['W6','FR','U2','LO','LH','BA','AF','KL','TK', ...Object.keys(AIRLINES)]){
    const n=(AIRLINES[code]?.[0]||'').toLowerCase().replace(/[^a-z]/g,''); if(!n) continue;
    if(n===norm || n.startsWith(norm) || norm.startsWith(n)) return {code, number:null};
  }
  return null;
}
const airlineCode = f => parseAirline(f.airline)?.code || null;
const flightNumber = f => { const p=parseAirline(f.airline); return p?.number ? `${p.code} ${p.number}` : null; };
const airlineName = f => { const c=airlineCode(f); return (c && AIRLINES[c]?.[0]) || f.airline || null; };
/** логотип: белый силуэт с pics.avs.io, если нет — код */
function logoHTML(code, cls=''){
  if(!code) return `<div class="logo ${cls}">${ICON.plane}</div>`;
  return `<div class="logo ${cls}"><img src="https://pics.avs.io/120/120/${esc(code)}.png" alt="${esc(code)}" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(code)}'))"></div>`;
}

// ---------- посещения ----------
/** собрать посещения: перелёты, путешествия, ручные отметки, наземные поездки */
function collect(arcs, js, mn, ts){
  const map = {};
  const touch = (cc, lon, lat, date, kind)=>{
    if(!cc) return; const v = map[cc] ??= {cc, flights:0, journeys:0, trips:0, manual:false, last:'', pts:[]};
    if(kind==='f') v.flights++; if(kind==='t') v.trips++;
    if(lon!=null) v.pts.push([lon,lat]); if(date && date>v.last) v.last=date;
  };
  for(const a of arcs) for(const p of [a.a, a.b]){
    touch(p.country, p.lon, p.lat, a.f.date, 'f');
    const r=regionOf(p.lon,p.lat,p.country); if(r) touch(r, p.lon, p.lat, a.f.date, 'f');
  }
  for(const t of (ts||[])) for(const p of [t.from, t.to]){
    const cc=(p.cc||'').toUpperCase(); if(!cc) continue;
    touch(cc, p.lon, p.lat, t.date, 't');
    const r=regionOf(p.lon,p.lat,cc); if(r) touch(r, p.lon, p.lat, t.date, 't');
  }
  for(const j of js) for(const cc of j.countries){ const v = map[cc] ??= {cc, flights:0, journeys:0, trips:0, manual:false, last:'', pts:[]}; v.journeys++; if(j.end>v.last) v.last=j.end; }
  for(const cc of mn){ (map[cc] ??= {cc, flights:0, journeys:0, trips:0, manual:false, last:'', pts:[]}).manual = true; }
  return map;
}
const doneTrip = t => !t.date || t.date <= todayStr();
function visitedMap(){
  const t=todayStr();
  return collect(doneArcs(), journeys.filter(j=>j.start<=t), manual, trips.filter(doneTrip));
}
/** части стран для закраски: основная + где были; острова-регионы — целиком */
function fillsGeo(map){
  const features=[];
  for(const [cc, v] of Object.entries(map)){
    const ps=PARTS[cc]; if(!ps) continue;
    const idx=new Set(isRegion(cc) ? ps.map((_,i)=>i) : [0]);
    if(!isRegion(cc)) for(const [lon,lat] of v.pts){ const i=partIndex(cc,lon,lat); if(i>=0) idx.add(i); }
    for(const i of idx) features.push({type:'Feature', properties:{iso:cc}, geometry:{type:'Polygon', coordinates:ps[i].rings}});
  }
  return {type:'FeatureCollection', features};
}
function journeyArcs(j){ return allArcs().filter(a=>a.f.date && a.f.date>=j.start && a.f.date<=j.end); }
function journeyTrips(j){ return trips.filter(t=>t.date && t.date>=j.start && t.date<=j.end); }
function journeyMap(j){
  const set=new Set(j.countries), m=collect(journeyArcs(j), [j], [], journeyTrips(j)), out={};
  for(const [cc,v] of Object.entries(m)) if(set.has(cc) || (REGIONS[cc] && set.has(REGIONS[cc][1]))) out[cc]=v;
  return out;
}
function journeyTitle(j){ return j.title?.trim() || (j.countries.slice(0,3).map(countryName).join(', ') + (j.countries.length>3 ? ` и ещё ${j.countries.length-3}` : '')); }
function journeyDates(j){ if(j.start===j.end) return fmtDate(j.start); return j.start.slice(0,4)===j.end.slice(0,4) ? fmtDate(j.start).slice(0,5)+' – '+fmtDate(j.end) : fmtDate(j.start)+' – '+fmtDate(j.end); }
/** наземные поездки, сгруппированные по group (одна поездка Прага → Брно → Вена = несколько участков) */
function tripGroups(){
  const order=[], g={};
  for(const t of trips){ const k=t.group ?? t.id; if(!g[k]){ g[k]=[]; order.push(k); } g[k].push(t); }
  return order.map(k=>g[k].sort((a,b)=>(a.date||'').localeCompare(b.date||'') || a.id-b.id))
    .sort((a,b)=>(b[0].date||'').localeCompare(a[0].date||''));
}
const legsTitle = legs => [legs[0].from.name, ...legs.map(l=>l.to.name)].join(' → ');
const legsCountries = legs => [...new Set(legs.flatMap(l=>[l.from.cc,l.to.cc]).filter(Boolean).map(c=>c.toUpperCase()))];
</script>

<script>
// =====================================================================
//  Состояние, глобус, шторка, страницы
// =====================================================================
let page = 0, selected = null, selJourney = null, selCountry = null;
let year = lsGet('flights.year', 'all');
let layer = lsGet('map.layer', 'countries') === 'cities' ? 'cities' : 'countries';
let map = null, mapReady = false;
const EMPTY_FC = {type:'FeatureCollection', features:[]};

// ---------- глобус: карта OpenFreeMap (Liberty), как раньше на сайте ----------
const MAP_STYLE = 'https://tiles.openfreemap.org/styles/liberty';
const C = { line:'#ff5a1f', line2:'#1f7aff', sel:'#d10068', up:'#7d8696', upSel:'#4b5363', dot:'#ff5a1f', halo:'#ffffff', text:'#1b1f2a', fill:'#22c55e' };

function initMap(){
  map = new maplibregl.Map({
    container:'map', style:MAP_STYLE, center:[18,46], zoom: isMobile() ? 0.9 : 1.7,
    attributionControl:{compact:true}, renderWorldCopies:false, maxPitch:0, dragRotate:false,
  });
  map.touchZoomRotate.disableRotation();
  map.on('style.load', ()=>{
    map.setProjection({type:'globe'});
    try{ map.setSky({'atmosphere-blend':['interpolate',['linear'],['zoom'],0,1,5,1,7,0]}); }catch(e){}
    if(!isMobile()) map.setPadding({left:426, top:0, right:0, bottom:0});
    addLayers(); mapReady = true; updateMap(true);
  });
  map.on('styleimagemissing', e=>{
    if(e.id.startsWith('flag-') && !map.hasImage(e.id)) map.addImage(e.id, flagImage(e.id.slice(5)), {pixelRatio:2});
  });
  map.on('click', e=>{
    const hit = map.queryRenderedFeatures([[e.point.x-8,e.point.y-8],[e.point.x+8,e.point.y+8]], {layers:['flights-hit','country-flags','country-fill'].filter(l=>map.getLayer(l))});
    const fl = hit.find(f=>f.layer.id==='flights-hit'), cf = hit.find(f=>f.layer.id!=='flights-hit');
    if(page===0 && fl) return selectFlight(Number(fl.properties.id));
    if(page===1 && cf){ const cc=cf.properties.iso; selJourney=null; selCountry = selCountry===cc ? null : cc; refresh(); if(selCountry) focusCountry(selCountry); }
  });
  for(const l of ['flights-hit','country-fill','country-flags']){
    map.on('mouseenter',l,()=>{ if((l==='flights-hit')===(page===0)) map.getCanvas().style.cursor='pointer'; });
    map.on('mouseleave',l,()=>map.getCanvas().style.cursor='');
  }
}

function flagImage(cc){
  const S=64, c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d');
  g.save(); g.beginPath(); g.arc(S/2,S/2,S/2-4,0,7); g.fillStyle='#fff'; g.fill(); g.clip();
  if(isRegion(cc)) drawRegionFlag(g, cc, 0, 8, S, S-16);
  else { g.font='58px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(flagEmoji(cc), S/2, S/2+3); }
  g.restore();
  g.beginPath(); g.arc(S/2,S/2,S/2-4,0,7); g.lineWidth=4; g.strokeStyle='#fff'; g.stroke();
  return g.getImageData(0,0,S,S);
}

let lastFillKey = '';
function updateMap(force){
  if(!mapReady) return;
  const arcs = mapArcs();
  map.getSource('flights').setData({type:'FeatureCollection', features: arcs.map(a=>({type:'Feature', properties:{id:a.id, up:a.up},

  map.getSource('airports').setData({type:'FeatureCollection', features:Object.values(ap).map(p=>({type:'Feature',properties:{iata:p.iata},geometry:{type:'Point',coordinates:[p.lon,p.lat]}}))});
  const cityMode = page===1 && layer==='cities';
  const fills = cityMode ? {} : currentFills(), key = page+'|'+layer+'|'+selJourney+'|'+Object.keys(fills).sort().join(',')+'|'+flights.length+'|'+trips.length;

    properties:{name:c.name, n:c.visits, key:c.key}, geometry:{type:'Point', coordinates:[c.lon,c.lat]}})) : []});
  if(force || key!==lastFillKey){

    map.getSource('countries').setData(fillsGeo(fills));
    map.getSource('cflags').setData({type:'FeatureCollection', features:Object.keys(fills).map(cc=>{ const c=centroid(cc); return c && {type:'Feature',
      properties:{iso:cc, area:PARTS[cc]?.[0]?.area||0}, geometry:{type:'Point',coordinates:c}}; }).filter(Boolean)});
  }

  map.setFilter('flights-sel', ['==',['get','id'], hasSel ? selected : -1]);

  map.setPaintProperty('flights-base','line-opacity', hasSel ? 0.22 : 0.85);

function insets(){
  if(isMobile()) return {top:70, bottom: sheetVisible()+20, left:30, right:30};
  return {top:50, bottom:50, left:40, right:50};
}
function fitCoords(pts, maxZoom=6){
  if(!mapReady || !pts.length) return;
  // разворачиваем долготы, чтобы не перескакивать через 180°
  const ref = pts[0][0]; const lons = pts.map(([x])=>{ while(x-ref>180) x-=360; while(x-ref<-180) x+=360; return x; });
  const lats = pts.map(p=>p[1]);
  const w=Math.min(...lons), e=Math.max(...lons), s=Math.min(...lats), n=Math.max(...lats);
  if(e-w > 200 || n-s > 120){ map.easeTo({center:[(w+e)/2,(s+n)/2], zoom:isMobile()?0.9:1.5, padding:insets(), duration:900}); return; }
  try{ map.fitBounds([[w,s],[e,n]], {padding:insets(), maxZoom, duration:900}); }
  catch(err){ map.easeTo({center:[(w+e)/2,(s+n)/2], zoom:3, duration:900}); }
}
function partPts(cc){ const ps=PARTS[cc]; if(!ps) return []; const pr = isRegion(cc) ? ps : [ps[0]]; return pr.flatMap(p=>[[p.bbox[0],p.bbox[1]],[p.bbox[2],p.bbox[3]]]); }
function focusFlight(id){ const a=allArcs().find(x=>x.id===id); if(a) fitCoords(greatCircle(a.a,a.b,24), 5.5); }
function focusCountry(cc){ fitCoords(partPts(cc), 5); }
function focusJourney(j){ fitCoords([...journeyArcs(j).flatMap(a=>[[a.a.lon,a.a.lat],[a.b.lon,a.b.lat]]), ...j.countries.flatMap(partPts)], 5); }

// ---------- шторка (телефон) ----------
const panel = $('#panel'), track = $('#track');
let detent = 'mid';
function vh(){ return window.innerHeight; }
function fullH(){ return panel.getBoundingClientRect().height || vh()-70; }
function detents(){ return (page===0 && selected!=null) ? ['sel','full'] : ['low','mid','full']; }
function detentPx(d){ return {low:190, mid:Math.round(vh()*0.45), sel:Math.min(310, fullH()), full:fullH()}[d]; }
function sheetVisible(){ return isMobile() ? detentPx(detent) : 0; }
function setDetent(d, anim=true){
  if(!detents().includes(d)) d = detents()[0];
  detent = d;
  if(!isMobile()){ panel.style.transform=''; return; }
  panel.classList.toggle('dragging', !anim);
  panel.style.transform = `translateY(${fullH()-detentPx(d)}px)`;
}
function nearestDetent(visible, velocity){
  const ds = detents().map(d=>[d, detentPx(d)]);
  if(Math.abs(velocity) > 0.5){
    const sorted = ds.sort((a,b)=>a[1]-b[1]);
    if(velocity < 0) return (sorted.find(([,h])=>h > visible+10) || sorted[sorted.length-1])[0];
    return ([...sorted].reverse().find(([,h])=>h < visible-10) || sorted[0])[0];
  }
  return ds.sort((a,b)=>Math.abs(a[1]-visible)-Math.abs(b[1]-visible))[0][0];
}

// жесты: вертикально — шторка, горизонтально — страницы
(function gestures(){
  let st=null;
  panel.addEventListener('touchstart', e=>{
    if(e.touches.length!==1 || document.body.classList.contains('modal-open')) return;
    const t=e.touches[0], list=e.target.closest('.list');
    st={x:t.clientX, y:t.clientY, t:performance.now(), list, mode:null, startVis:sheetVisible(), lastY:t.clientY, lastT:performance.now(), vel:0,
        chips: !!e.target.closest('.chips')};
  }, {passive:true});
  panel.addEventListener('touchmove', e=>{
    if(!st) return; const t=e.touches[0], dx=t.clientX-st.x, dy=t.clientY-st.y;
    if(!st.mode){
      if(Math.abs(dx)<6 && Math.abs(dy)<6) return;
      if(Math.abs(dx) > Math.abs(dy)*1.2) st.mode='h';
      else if(!isMobile()) st.mode='scroll';
      else if(!st.list) st.mode='v';
      else if(dy>0 && st.list.scrollTop<=0) st.mode='v';
      else if(dy<0 && detent!=='full') st.mode='v';
      else st.mode='scroll';
    }
    if(st.mode==='scroll') return;
    e.preventDefault();
    if(st.mode==='v'){
      const vis = Math.max(120, Math.min(fullH(), st.startVis - dy));
      panel.classList.add('dragging'); panel.style.transform=`translateY(${fullH()-vis}px)`;
      const now=performance.now(); st.vel = (t.clientY-st.lastY)/Math.max(1,now-st.lastT); st.lastY=t.clientY; st.lastT=now;
    } else {
      track.style.transition='none'; track.style.transform=`translateX(calc(${-page*100}% + ${dx}px))`;
    }
  }, {passive:false});
  panel.addEventListener('touchend', e=>{
    if(!st) return; const t=e.changedTouches[0], dx=t.clientX-st.x, dy=t.clientY-st.y;
    if(st.mode==='v'){ const vis=st.startVis-dy; setDetent(nearestDetent(vis, st.vel)); updateLater(); }
    if(st.mode==='h'){
      track.style.transition='';
      const np = (dx < -50 && page<1) ? 1 : (dx > 50 && page>0) ? 0 : page;
      setPage(np);
    }
    st=null;
  });
  // на компьютере: перетаскивание тачпадом по страницам
  let wheelAcc=0, wheelT=0;
  track.addEventListener('wheel', e=>{
    if(Math.abs(e.deltaX) < Math.abs(e.deltaY)*1.5) return;
    const now=performance.now(); if(now-wheelT>400) wheelAcc=0; wheelT=now; wheelAcc+=e.deltaX;
    if(wheelAcc>80 && page===0){ setPage(1); wheelAcc=-1e4; } else if(wheelAcc<-80 && page===1){ setPage(0); wheelAcc=1e4; }
  }, {passive:true});
  // клик по ручке — переключить высоту
  panel.querySelector('.grip').addEventListener('click', ()=>{ const ds=detents(); setDetent(ds[(ds.indexOf(detent)+1)%ds.length]); });
})();
let upd=null; function updateLater(){ clearTimeout(upd); upd=setTimeout(()=>{ if(page===0 && selected!=null) focusFlight(selected); }, 380); }
addEventListener('resize', ()=>setDetent(detent,false));

function setPage(p){
  const prev = page; page = p;
  track.style.transform = `translateX(${-p*100}%)`;
  document.querySelectorAll('#dots button').forEach(b=>b.classList.toggle('on', +b.dataset.p===p));
  if(prev!==p){
    if(p!==0 && detent==='sel') detent='mid';
    if(p===0 && selected!=null && detent!=='full') detent='sel';
    setDetent(detent);
    updateMap();
  }
}
$('#dots').addEventListener('click', e=>{ const b=e.target.closest('[data-p]'); if(b) setPage(+b.dataset.p); });

/** всплывающее меню (выбор года, «⋯» у строк) */
function popMenu(anchor, items, opts={}){
  closeMenu();
  const m=document.createElement('div'); m.className='menu glass'; m.id='popmenu';
  m.innerHTML = items.map((it,i)=> it==='-' ? '<hr style="border:0;border-top:1px solid var(--line);margin:4px 6px">'
    : `<button data-i="${i}" class="${it.on?'on':''}" style="${it.danger?'color:var(--danger)':''}">${esc(it.label)}</button>`).join('');
  document.body.append(m);
  const r = anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : {left:anchor.x, right:anchor.x, top:anchor.y, bottom:anchor.y};
  const w = m.offsetWidth, h = m.offsetHeight;
  let x = Math.min(innerWidth-w-8, Math.max(8, r.right - w)); let y = r.bottom + 6;
  if(y+h > innerHeight-8) y = Math.max(8, r.top - h - 6);
  m.style.left=x+'px'; m.style.top=y+'px';
  m.onclick = e=>{ const b=e.target.closest('[data-i]'); if(!b) return; closeMenu(); items[+b.dataset.i].act(); };
  setTimeout(()=>addEventListener('pointerdown', outside, true));
  function outside(e){ if(!m.contains(e.target)){ closeMenu(); } }
  m._off = ()=>removeEventListener('pointerdown', outside, true);
}
function closeMenu(){ const m=$('#popmenu'); if(m){ m._off?.(); m.remove(); } }

$('#yearBtn').onclick = e=>{
  popMenu(e.currentTarget, ['all', ...years()].map(y=>({label:yearLabel(y), on:y===year, act:()=>{ year=y; lsSet('flights.year', y); if(selected!=null && !yearArcs().some(a=>a.id===selected)) selected=null; refresh(); }})));
};

/** долгое нажатие на телефоне = контекстное меню */
function bindContext(el, items){
  el.addEventListener('contextmenu', e=>{ e.preventDefault(); popMenu({x:e.clientX, y:e.clientY}, items()); });
  let timer=null, sx=0, sy=0;
  el.addEventListener('touchstart', e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY;
    timer=setTimeout(()=>{ timer='fired'; navigator.vibrate?.(10); popMenu({x:sx,y:sy}, items()); }, 520); }, {passive:true});
  el.addEventListener('touchmove', e=>{ const t=e.touches[0]; if(Math.hypot(t.clientX-sx,t.clientY-sy)>8 && timer!=='fired'){ clearTimeout(timer); timer=null; } }, {passive:true});
  el.addEventListener('touchend', e=>{ if(timer==='fired'){ e.preventDefault(); } else clearTimeout(timer); timer=null; });
  el.addEventListener('click', e=>{ if(el._suppress){ e.stopImmediatePropagation(); el._suppress=false; } }, true);
}

    <div class="main"><div class="title" style="font-size:16px;margin:0 0 3px">${esc(legsTitle(legs))}</div>
      <div class="sub">${[m.name, legs[0].date?fmtDate(legs[0].date):null, fmtKm(km)+' км', legsCountries(legs).map(flagEmoji).join(' ')].filter(Boolean).join(' · ')}</div></div>
    <button class="more" aria-label="Ещё">${ICON.dots}</button></div>`;
}
function countryRow(v){
  const parts = [v.flights?`✈ ${v.flights}`:null, v.trips?`наземных поездок: ${v.trips}`:null, v.journeys?`путешествий: ${v.journeys}`:null, v.manual?'отмечено вручную':null].filter(Boolean);
  return `<div class="row${selCountry===v.cc?' on green':''}" data-c="${v.cc}" style="align-items:center">
    <div class="lead">${flagHTML(v.cc,28)}</div>
    <div class="main"><div class="title" style="font-size:16px;margin:0 0 3px">${esc(countryName(v.cc))}</div><div class="sub">${parts.join(' · ')}</div></div>
    ${v.manual?`<button class="more" aria-label="Ещё">${ICON.dots}</button>`:''}</div>`;
}
function renderCountry(){
  document.querySelectorAll('#layerSeg button').forEach(b=>b.classList.toggle('on', b.dataset.l===layer));
  const vm = visitedMap(), visited = Object.values(vm).sort((a,b)=>countryName(a.cc).localeCompare(countryName(b.cc),'ru'));
  const countries = visited.filter(v=>isCountry(v.cc)), terr = visited.filter(v=>!isCountry(v.cc));
  $('#countryTiles').innerHTML = [[countries.length, plural(countries.length,'страна','страны','стран')],[Math.round(countries.length/195*100)+'%','мира'],[terr.length,'террит.'],[journeys.length,'путеш.']]
    .map(([v,l])=>`<div class="tile"><b>${v}</b><small>${l}</small></div>`).join('');
  const js = [...journeys].sort((a,b)=>b.start.localeCompare(a.start)), tg = tripGroups();
  const list = $('#countryList');
  if(!visited.length && !js.length && !tg.length){
    list.innerHTML = `<div class="empty"><div class="ico">🌍</div>Страны появятся из перелётов.<br>Нажмите «+», чтобы отметить страну вручную или добавить путешествие.</div>`; return;
  }
  let h='';
  if(js.length) h += `<div class="sec">Путешествия</div>` + js.map(journeyRow).join('');
  if(tg.length) h += `<div class="sec">Наземные поездки</div>` + tg.map(tripRow).join('');
  if(layer==='cities'){
    const cs = currentCities();
    h += `<div class="sec">Города · ${cs.length}</div>` + (cs.length ? cs.map(cityRow).join('') : `<div class="empty">Города появятся из перелётов и наземных поездок</div>`);
  } else {
    if(countries.length) h += `<div class="sec">Страны</div>` + countries.map(countryRow).join('');
    if(terr.length) h += `<div class="sec">Территории и острова</div>` + terr.map(countryRow).join('');
  }
  list.innerHTML = h;
  list.querySelectorAll('[data-city]').forEach(el=>{ el.onclick = ()=>{ const c=currentCities().find(x=>x.key===el.dataset.city);
    if(c && mapReady){ setDetent('low'); setTimeout(()=>map.easeTo({center:[c.lon,c.lat], zoom:7, padding:insets(), duration:900}), 80); } }; });
  list.querySelectorAll('[data-j]').forEach(el=>{
    const j = journeys.find(x=>x.id===Number(el.dataset.j));
    const menu = ()=>[{label:'Изменить', act:()=>openJourneyForm(j)}, {label:'Удалить путешествие', danger:true, act:()=>confirmDialog('Удалить это путешествие?','Удалить',()=>{ if(selJourney===j.id) selJourney=null; journeys=journeys.filter(x=>x.id!==j.id); saveJourneys(); })}];
    el.onclick = e=>{ if(e.target.closest('.more')){ e.stopPropagation(); popMenu(e.target.closest('.more'), menu()); return; }
      selCountry=null; selJourney = selJourney===j.id ? null : j.id; refresh();
      if(selJourney!=null){ setDetent('low'); setTimeout(()=>focusJourney(j), 80); } };
    bindContext(el, menu);
  });
  list.querySelectorAll('[data-t]').forEach(el=>{
    const legs = tg.find(g=>g[0].id===Number(el.dataset.t));
    const menu = ()=>[{label:'Изменить', act:()=>openTripForm(legs)}, {label:'Удалить поездку', danger:true, act:()=>confirmDialog('Удалить эту поездку?','Удалить',()=>deleteTrip(legs))}];
    el.onclick = e=>{ if(e.target.closest('.more')){ e.stopPropagation(); popMenu(e.target.closest('.more'), menu()); return; } openTripForm(legs); };
    bindContext(el, menu);
  });
  list.querySelectorAll('[data-c]').forEach(el=>{
    const cc = el.dataset.c, v = vm[cc];
    const menu = ()=> v.manual ? [{label:'Снять отметку', danger:true, act:()=>{ manual=manual.filter(x=>x!==cc); saveManual(); }}] : [];
    el.onclick = e=>{ if(e.target.closest('.more')){ e.stopPropagation(); popMenu(e.target.closest('.more'), menu()); return; }
      selJourney=null; selCountry = selCountry===cc ? null : cc; refresh(); if(selCountry){ setDetent('low'); setTimeout(()=>focusCountry(cc), 80); } };
    if(v.manual) bindContext(el, menu);
  });
}
function deleteTrip(legs){ const ids=new Set(legs.map(l=>l.id)); trips = trips.filter(t=>!ids.has(t.id)); saveTrips(); }
$('#countryTiles').onclick = ()=>openCountryStats('all');
$('#layerSeg').onclick = e=>{ const b=e.target.closest('[data-l]'); if(!b) return; layer=b.dataset.l; lsSet('map.layer', layer); selCountry=null; refresh(); };
$('#countryShare').onclick = ()=>ShareModal.open('country');
$('#addCountry').onclick = e=>popMenu(e.currentTarget, [
  {label:'🏳  Отметить страны', act:()=>openManualPicker()},
  {label:'🧳  Новое путешествие', act:()=>openJourneyForm(null)},
  {label:'🚌  Наземная поездка', act:()=>openTripForm(null)},
]);
$('#profileBtn').onclick = ()=>openProfile();

function refresh(){
  if(selected!=null && !flights.some(f=>f.id===selected)) selected=null;
  if(selJourney!=null && !journeys.some(j=>j.id===selJourney)) selJourney=null;
  renderFly(); renderCountry(); updateMap();
}
</script>

<script>
// =====================================================================
//  Окна: формы, детали рейса, профиль, статистика
// =====================================================================
const modalStack = [];
/** окно-шторка: заголовок, кнопки слева/справа, тело */
function openModal({title='', left='Отмена', right=null, rightPrimary=true, cls='', onRight=null, onClose=null}){
  const wrap = document.createElement('div'); wrap.className='modal';
  wrap.innerHTML = `<div class="mbox ${cls}"><div class="mhead">
      <button class="mbtn" data-a="l" ${left?'':'style="visibility:hidden"'}>${esc(left||'·')}</button>
      <h2>${esc(title)}</h2>
      <button class="mbtn${rightPrimary?' primary':''}" data-a="r" ${right?'':'style="visibility:hidden"'}>${esc(right||'·')}</button>
    </div><div class="mbody"></div></div>`;
  document.body.append(wrap); document.body.classList.add('modal-open');
  const m = { el:wrap, body:wrap.querySelector('.mbody'), rightBtn:wrap.querySelector('[data-a="r"]'), titleEl:wrap.querySelector('h2'),
    close(){ const i=modalStack.indexOf(m); if(i>=0) modalStack.splice(i,1); wrap.remove(); if(!modalStack.length) document.body.classList.remove('modal-open'); onClose?.(); },
    setRight(enabled){ m.rightBtn.disabled = !enabled; } };
  wrap.querySelector('[data-a="l"]').onclick = ()=>m.close();
  m.rightBtn.onclick = ()=>{ if(!m.rightBtn.disabled) (onRight ? onRight(m) : m.close()); };
  wrap.addEventListener('pointerdown', e=>{ wrap._down = e.target===wrap; });
  wrap.addEventListener('click', e=>{ if(e.target===wrap && wrap._down) m.close(); });
  modalStack.push(m);
  return m;
}
addEventListener('keydown', e=>{ if(e.key==='Escape'){ if($('#popmenu')) return closeMenu(); modalStack[modalStack.length-1]?.close(); } });

/** диалог подтверждения (как confirmationDialog в iOS) */
function dialog({title, message='', buttons}){
  const m = openModal({title:'', left:null, cls:'dlg'});
  m.el.querySelector('.mhead').remove();
  m.body.innerHTML = `<div style="text-align:center;padding:18px 6px 6px"><div style="font-weight:600;font-size:16px">${esc(title)}</div>
    ${message?`<div class="gfoot" style="margin-top:6px">${esc(message)}</div>`:''}</div>
    <div class="grp">${buttons.map((b,i)=>`<button class="gi" data-i="${i}" style="justify-content:center;${b.danger?'color:var(--danger)':'color:var(--accent)'};${b.bold?'font-weight:600':''}">${esc(b.label)}</button>`).join('')}</div>
    <div class="grp"><button class="gi" data-x style="justify-content:center;color:var(--accent);font-weight:600">Отмена</button></div>`;
  m.body.onclick = e=>{ const b=e.target.closest('[data-i]'); if(b){ m.close(); buttons[+b.dataset.i].act(); } else if(e.target.closest('[data-x]')) m.close(); };
  return m;
}
function confirmDialog(title, label, act, message){ dialog({title, message, buttons:[{label, danger:true, act}]}); }
function alertDialog(title, message){ const m = dialog({title, message, buttons:[]}); m.body.querySelector('[data-x]').textContent='Понятно'; }

// ---------- AeroDataBox (RapidAPI) ----------
const API = {
  keyName:'aerodatabox.key',
  get key(){ return (lsGet(this.keyName,'')||'').trim(); },
  get hasKey(){ return !!this.key; },
  cache:{}, lastTotal:0,
  async get(path){
    if(!this.hasKey) throw new Error('Добавьте ключ AeroDataBox в профиле');
    let r;
    try{ r = await fetch('https://aerodatabox.p.rapidapi.com'+path, {headers:{'X-RapidAPI-Key':this.key,'X-RapidAPI-Host':'aerodatabox.p.rapidapi.com'}}); }
    catch(e){ throw new Error('Нет связи с сервисом расписаний'); }
    if(r.status===204 || r.status===404) return [];
    if(r.status===401 || r.status===403) throw new Error('Ключ не подходит — проверьте его в профиле');
    if(r.status===429){ const t=(await r.text()).toLowerCase(); const e=new Error(t.includes('quota') ? 'Бесплатные запросы на этот месяц закончились' : 'Слишком много запросов подряд — подождите минуту'); e.limit=t.includes('quota'); throw e; }
    if(!r.ok) throw new Error('Сервис расписаний ответил ошибкой '+r.status);
    const txt = await r.text(); try{ return JSON.parse(txt); }catch(e){ return []; }
  },
  code(m){ const ap=m?.airport; if(!ap) return ''; if(ap.iata) return ap.iata.toUpperCase(); const a=BY_ICAO[(ap.icao||'').toUpperCase()]; return a ? a.iata : ''; },
  hhmm(s){ const m=(s||'').match(/\d{2}:\d{2}/); return m ? m[0] : ''; },
  utc(s){ if(!s) return null; const d=new Date(s.replace(' ','T').slice(0,16)+'Z'); return isNaN(d) ? null : d; },
  shortModel(m){ let s=m||''; for(const p of ['Airbus ','Boeing ','Bombardier ','De Havilland Canada ']) if(s.startsWith(p)) s=s.slice(p.length);
    if(s.startsWith('Embraer ')) s='E'+s.slice(8).replace('ERJ-',''); return s; },
  parse(d, origin){
    let dep=d.departure, arr=d.arrival;
    if(!arr && d.movement && origin){ arr=d.movement; dep={airport:{iata:origin}, scheduledTime:d.movement.scheduledTime||{}}; }
    const dc=this.code(dep), from = dc || origin || '', to=this.code(arr);
    if(!from || !to) return null;
    let dur=0; const a=this.utc(dep?.scheduledTime?.utc), b=this.utc(arr?.scheduledTime?.utc);
    if((!d.movement || d.arrival) && a && b) dur=Math.max(0, Math.round((b-a)/60000));
    return { number:d.number||'', airline:d.airline?.name||'', airlineIata:d.airline?.iata||'', from, to,
      depTime:this.hhmm(dep?.scheduledTime?.local), arrTime: d.arrival ? this.hhmm(arr?.scheduledTime?.local) : '', durMin:dur,
      model:this.shortModel(d.aircraft?.model), reg:d.aircraft?.reg||'', status:d.status||'' };
  },
  async route(from, to, date){
    const ck=`r-${from}-${to}-${date}`; if(this.cache[ck]) return this.cache[ck];
    let out=[]; this.lastTotal=0;
    const q='direction=Departure&withLeg=true&withCancelled=true&withCodeshared=true&withCargo=false&withPrivate=false&withLocation=false';
    for(const [a,b] of [['00:00','11:59'],['12:00','23:59']]){
      const j = await this.get(`/flights/airports/iata/${from}/${date}T${a}/${date}T${b}?${q}`);
      const deps = j?.departures || []; this.lastTotal += deps.length;
      out.push(...deps.filter(d=>d.codeshareStatus!=='IsCodeshared').map(d=>this.parse(d, from)).filter(x=>x && x.to===to));
    }
    const seen=new Set(); out = out.filter(x=>{ const k=x.number+x.depTime; if(seen.has(k)) return false; seen.add(k); return true; }).sort((a,b)=>a.depTime.localeCompare(b.depTime));
    if(out.length) this.cache[ck]=out; return out;
  },
  async byNumber(num, date){
    const n=num.replace(/\s/g,'').toUpperCase(), ck=`n-${n}-${date}`; if(this.cache[ck]) return this.cache[ck];
    const j = await this.get(`/flights/number/${n}/${date}?withAircraftImage=false&withLocation=false`);
    const out = (Array.isArray(j)?j:[]).map(d=>this.parse(d,null)).filter(Boolean);
    if(out.length) this.cache[ck]=out; return out;
  },
};

// ---------- поиск аэропорта ----------
function searchAirports(q){
  q = q.trim().toLowerCase(); if(!q) return [];
  const up = q.toUpperCase(), out=[], seen=new Set();
  const push = a=>{ if(!seen.has(a.iata)){ seen.add(a.iata); out.push(a); } };
  if(BY_IATA[up]) push(BY_IATA[up]);
  if(q.length===4 && BY_ICAO[up]) push(BY_ICAO[up]);
  for(const a of AIRPORTS){ if(out.length>60) break; if((a.city||'').toLowerCase().startsWith(q)) push(a); }
  for(const a of AIRPORTS){ if(out.length>60) break; const s=`${a.city} ${a.name} ${countryName(a.country)}`.toLowerCase(); if(s.includes(q)) push(a); }
  return out;
}
function pickAirport(title, cb){
  const m = openModal({title, left:'Назад'});
  m.body.innerHTML = `<div class="search">${ICON.search}<input placeholder="WAW, Варшава…" autocomplete="off" autocapitalize="characters"></div><div class="grp" id="apRes" hidden></div><div class="empty" id="apHint">Код (WAW), город или название</div>`;
  const inp = m.body.querySelector('input'), res = m.body.querySelector('#apRes'), hint = m.body.querySelector('#apHint');
  inp.oninput = ()=>{
    const r = searchAirports(inp.value); res.hidden = !r.length; hint.hidden = !!r.length || !!inp.value; if(inp.value && !r.length){ hint.hidden=false; hint.textContent='Ничего не найдено'; }
    res.innerHTML = r.map(a=>`<button class="gi" data-i="${a.iata}"><span class="code" style="width:46px">${a.iata}</span><span style="min-width:0"><div>${esc(a.city||a.name)}</div><div style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.name)} · ${a.country}</div></span></button>`).join('');
  };
  res.onclick = e=>{ const b=e.target.closest('[data-i]'); if(b){ m.close(); cb(BY_IATA[b.dataset.i]); } };
  setTimeout(()=>inp.focus(), 50);
}

// ---------- форма перелёта ----------
function openFlightForm(editing){
  const lastTo = flights[flights.length-1]?.to;
  const s = editing ? { from:BY_IATA[editing.from], to:BY_IATA[editing.to], hasDate:!!editing.date, date:editing.date||todayStr(), airline:editing.airline||'',
      aircraft:editing.aircraft||'', reg:editing.reg||'', seat:editing.seat||'', cabin:editing.cabin||'', depTime:editing.depTime||'', arrTime:editing.arrTime||'', durMin:editing.durMin||0 }
    : { from: lastTo ? BY_IATA[lastTo] : null, to:null, hasDate:true, date:todayStr(), airline:'', aircraft:'', reg:'', seat:'', cabin:'', depTime:'', arrTime:'', durMin:0 };
  let found=[], searching=false, searched=false, apiError=null;
  const m = openModal({title: editing ? 'Изменить перелёт' : 'Новый перелёт', right: editing ? 'Сохранить' : 'Добавить', cls:'tall', onRight: save});
  m.body.innerHTML = `
    <div class="grp"><button class="gi" data-pick="from"></button><button class="gi" data-pick="to"></button></div>
    <div class="grp"><div class="gi"><span>Дата</span><span class="toggle" id="ffDateT"></span></div><div class="gi" id="ffDateRow"><span class="lbl">Дата вылета</span><input type="date" id="ffDate" style="text-align:right;color-scheme:dark"></div></div>
    <div id="ffSched"></div>
    <div class="ghead">Рейс</div>
    <div class="grp"><div class="gi"><span id="ffLogo"></span><input id="ffAirline" placeholder="Рейс, напр. W6 1441 или LO 16" autocapitalize="characters" autocomplete="off"></div><div id="ffAirInfo"></div></div>
    <div class="ghead">Детали (необязательно)</div>
    <div class="grp">
      <div class="gi"><input id="ffAircraft" placeholder="Самолёт, напр. A21N, B789" autocapitalize="characters" autocomplete="off"></div>
      <div class="gi"><input id="ffReg" placeholder="Бортовой номер, напр. 9H-WAD" autocapitalize="characters" autocomplete="off"></div>
      <div class="gi"><input id="ffSeat" placeholder="Место, напр. 18A" autocapitalize="characters" autocomplete="off"></div>
      <div class="gi"><span>Класс</span><select id="ffCabin">${CABINS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div>
    </div>
    <div id="ffWarn"></div>
    ${editing ? `<div class="grp"><button class="gi danger" id="ffDel">Удалить перелёт</button></div>` : ''}`;
  const B = m.body, q = s2=>B.querySelector(s2);
  q('#ffDate').value = s.date; q('#ffAirline').value = s.airline; q('#ffAircraft').value = s.aircraft; q('#ffReg').value = s.reg; q('#ffSeat').value = s.seat; q('#ffCabin').value = s.cabin;
  const field = (lbl, a)=>`<span class="lbl">${lbl}</span><span class="val">${a ? `<span class="code">${a.iata}</span><span style="overflow:hidden;text-overflow:ellipsis">${esc(a.city||a.name)}</span>` : '<span style="color:var(--muted)">Выбрать</span>'}<span style="color:#555">›</span></span>`;
  function outOfRange(){ const d=daysUntil(s.date); if(d < -365) return 'Перелёт старше года — бесплатная база хранит данные только за последние 365 дней. Детали можно заполнить вручную.'; if(d > 365) return 'Дата дальше чем через год — расписание на неё пока недоступно.'; return null; }
  function paint(){
    q('[data-pick="from"]').innerHTML = field('Откуда', s.from); q('[data-pick="to"]').innerHTML = field('Куда', s.to);
    q('#ffDateT').classList.toggle('on', s.hasDate); q('#ffDateRow').hidden = !s.hasDate;
    const p = parseAirline(s.airline);
    q('#ffLogo').innerHTML = logoHTML(p?.code, 'sm').replace('logo sm','logo sm" style="width:30px;height:30px');
    const al = p?.code && AIRLINES[p.code];
    q('#ffAirInfo').innerHTML = (al ? `<div class="gi note">${esc(al[0])}</div>` : '')
      + (s.depTime ? `<div class="gi blue">Вылет ${s.depTime} → прилёт ${s.arrTime||'—'}${s.durMin>0?' · '+hm(s.durMin):''}</div>` : '')
      + (API.hasKey && p?.number && s.hasDate ? `<button class="gi link" id="ffByNum" ${searching||outOfRange()?'disabled style="opacity:.45"':''}>⬇︎ ${searching?'Ищу…':'Подтянуть данные по номеру рейса'}</button>` : '');
    const bn = q('#ffByNum'); if(bn) bn.onclick = lookupNumber;
    // расписание
    if(API.hasKey){
      const oor = s.hasDate ? outOfRange() : null, can = s.from && s.to && s.hasDate && !searching && !oor;
      let h = `<div class="ghead">Расписание</div><div class="grp"><button class="gi link" id="ffRoute" ${can?'':'disabled style="opacity:.45"'}>${ICON.search} ${searching?'Ищу рейсы…':'Найти рейсы на эту дату'}</button>`;
      if(oor) h += `<div class="gi note">📅 ${oor}</div>`;
      if(searching) h += `<div class="gi note" style="text-align:center">Загрузка…</div>`;
      h += found.map((r,i)=>foundRow(r,i)).join('');
      if(searched && !found.length && !apiError && !searching) h += `<div class="gi note">${API.lastTotal>0
          ? `Из ${s.from?.iata||''} на эту дату в расписании ${API.lastTotal} вылетов, но прямых в ${s.to?.iata||''} среди них нет. Попробуйте номер рейса.`
          : `Расписания ${s.from?.iata||''} на эту дату в базе пока нет — обычно оно появляется ближе к вылету. Можно ввести номер рейса вручную.`}</div>`;
      if(apiError) h += `<div class="gi err">${esc(apiError)}</div>`;
      h += `</div><div class="gfoot">Данные: AeroDataBox. Поиск по маршруту — 4 единицы, по номеру — 2 (бесплатно 400 в месяц).</div>`;
      q('#ffSched').innerHTML = h;
      const rb=q('#ffRoute'); if(rb) rb.onclick = searchRoute;
      q('#ffSched').querySelectorAll('[data-f]').forEach(el=>el.onclick=()=>{ apply(found[+el.dataset.f]); });
    } else q('#ffSched').innerHTML = '';
    const same = s.from && s.to && s.from.iata===s.to.iata;
    q('#ffWarn').innerHTML = same ? '<div class="gfoot" style="color:var(--danger)">Аэропорты вылета и прилёта совпадают.</div>' : '';
    m.setRight(s.from && s.to && !same);
  }
  function foundRow(r, i){
    const days = Math.max(0, daysUntil(s.date)), chosen = s.airline.toUpperCase().replace(/\s/g,'')===r.number.toUpperCase().replace(/\s/g,'');
    return `<div class="found${chosen?' on':''}" data-f="${i}">
      <div class="days"><b>${days}</b><small>${plural(days,'день','дня','дней')}</small></div>

// ---------- наземная поездка ----------
async function geoSearch(q, signal){
  const c = map ? map.getCenter() : {lat:50,lng:20};
  try{
    const r = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=8&lat=${c.lat.toFixed(2)}&lon=${c.lng.toFixed(2)}`, {signal});
    if(!r.ok) throw new Error('photon '+r.status);
    const j = await r.json();
    return j.features.map(f=>{ const p=f.properties, [lon,lat]=f.geometry.coordinates, city=(p.city && p.city!==p.name) ? p.city : null;
      return { name:p.name||p.city||q, sub:[city,p.state,p.country].filter(Boolean).join(', '), lat, lon, cc:(p.countrycode||'').toUpperCase() }; });
  }catch(e){
    if(signal?.aborted) throw e;
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&accept-language=ru&q=${encodeURIComponent(q)}`, {signal});
    const j = await r.json();
    return j.map(x=>{ const parts=x.display_name.split(',').map(s=>s.trim());
      return { name:x.name||parts[0], sub:parts.slice(1,4).join(', '), lat:+x.lat, lon:+x.lon, cc:(x.address?.country_code||'').toUpperCase() }; });
  }
}

        res.innerHTML = items.map((p,i)=>`<button class="gi" data-i="${i}"><span style="min-width:0"><div>${flagEmoji(p.cc)} ${esc(p.name)}</div><div style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.sub)}</div></span></button>`).join('');

function parseImport(obj){
  const raw = Array.isArray(obj) ? obj : obj?.flights; if(!Array.isArray(raw)) throw new Error('bad');
  const num = v=> typeof v==='number' ? v : (parseInt(v)||Date.now());
  const fl = raw.filter(f=>f && BY_IATA[f.from] && BY_IATA[f.to]).map(f=>({ ...f, id:num(f.id), date:f.date||'', airline:f.airline||'', aircraft:f.aircraft||'', reg:f.reg||'', seat:f.seat||'', cabin:f.cabin||'', depTime:f.depTime||'', arrTime:f.arrTime||'', durMin:+f.durMin||0 }));
  const js = (obj?.journeys||[]).filter(j=>j && Array.isArray(j.countries) && j.countries.length && String(j.start||'').length===10).map(j=>({ ...j, id:num(j.id), end:j.end||j.start, title:j.title||'' }));
  const ts = (obj?.trips||[]).filter(t=>t && t.from && t.to && t.from.lat!=null && t.to.lat!=null).map(t=>({ ...t, id:num(t.id), mode:t.mode||'bus', date:t.date||'', note:t.note||'', km: +t.km || Math.round(dist(t.from,t.to)) }));
  const mn = (obj?.countries||[]).filter(x=>typeof x==='string');
  const apiKey = String(obj?.settings?.aerodataboxKey || '').trim();
  return { flights:fl, journeys:js, trips:ts, manual:mn, apiKey };
}
function mergeFlights(cur, inc){
  // тот же перелёт (маршрут + дата) не дублируем, а дополняем пустые поля: самолёт, борт, время…
  const out = cur.map(f=>({...f})), ids = new Set(cur.map(f=>f.id));
  for(const f of inc){
    const ex = out.find(x=>x.from===f.from && x.to===f.to && x.date===f.date);
    if(ex){ for(const k of ['airline','aircraft','reg','seat','cabin','depTime','arrTime','durMin']) if(!ex[k] && f[k]) ex[k]=f[k];
      if(f.airline && /^[A-Z0-9]{2}\s*\d/.test(f.airline) && !/^[A-Z0-9]{2}\s*\d/.test(ex.airline||'')) ex.airline=f.airline; continue; }
    if(!ids.has(f.id)){ out.push(f); ids.add(f.id); }
  }
  return out;
}
function applyImport(r, replace){
  if(r.apiKey && !API.hasKey) lsSet(API.keyName, r.apiKey);   // ключ из бэкапа, если здесь его ещё нет
  if(replace){ flights=r.flights; journeys=r.journeys; trips=r.trips; manual=r.manual; selected=selJourney=selCountry=null; }
  else {
    const add = (arr, items)=>{ const ids=new Set(arr.map(x=>x.id)); return arr.concat(items.filter(x=>!ids.has(x.id))); };
    flights=mergeFlights(flights,r.flights); journeys=add(journeys,r.journeys); trips=add(trips,r.trips); manual=[...new Set([...manual,...r.manual])].sort();
  }

}
function exportData(){

}

function parseSeat(s){ const t=(s||'').toUpperCase().trim(), m=t.match(/^(\d{1,2})([A-Z])$/); return m && +m[1]>0 ? [+m[1], m[2]] : null; }

function computeStats(period){
  const today=todayStr(), all=doneArcs();

  const S = { arcs, trips: trips.filter(t=>(!t.date||t.date<=today) && (period==='all' || (t.date||'').startsWith(period))),
    km:0, minutes:0, domestic:0, international:0, noAircraft:0, noSeat:0, seats:{}, countries:[] };

  if(S.hours.length) h += card('Время вылета','🕐', `<div style="--h:130px">${vbars(S.hours,{cls:'blue', every:6})}</div>`);
  // самолёты
  let ac='';
  if(S.aircraft.length){
    const top=S.aircraft[0];

      <div style="color:var(--accent2);font-size:14px;margin-bottom:6px">${top.n} ${plural(top.n,'перелёт','перелёта','перелётов')} · ${hm(Math.round(top.extra))}</div>`;
    ac += S.aircraft.slice(0,8).map(c=>hbar(c.label, c.n, top.n, {sub:hm(Math.round(c.extra)), lead:planeImg(c.label,'plane mini')})).join('');
    if(S.makers.length>1){ const tot=S.makers.reduce((s,c)=>s+c.n,0), ps=S.makers.map((c,i)=>({...c,color:PALETTE[i%PALETTE.length]}));
      ac += `<div class="donut" style="margin-top:12px">${donut(ps)}<ul>${ps.map(c=>`<li><i style="background:${c.color}"></i>${esc(c.label)} — ${Math.round(c.n/tot*100)}%</li>`).join('')}</ul></div>`; }
  } else ac += `<div style="color:var(--muted);font-size:14px">Тип самолёта пока не указан ни у одного перелёта.</div>`;
  if(S.noAircraft) ac += `<div class="gfoot" style="margin-top:8px">Без типа самолёта: ${S.noAircraft}. Добавьте через «Изменить» или «Подтянуть данные».</div>`;
  h += card('Самолёты','✈︎', ac);
  h += card('Авиакомпании','🏢', S.airlines.slice(0,8).map(c=>hbar(c.label, c.n, S.airlines[0].n, {sub:kmShort(c.extra)+' км', lead: c.key.length===2 ? logoHTML(c.key,'sm') : ''})).join(''));
  const home = S.airports[0] && BY_IATA[S.airports[0].key];
  h += card('Аэропорты','🏛', (home?`<div style="color:var(--accent2);font-size:14px;margin-bottom:4px">Домашний: ${home.iata} · ${esc(home.city)}</div>`:'')
    + S.airports.slice(0,8).map(c=>{ const a=BY_IATA[c.key]; return hbar(`${c.key}  ${a?.city||''}`, c.n, S.airports[0].n, {lead:flagEmoji(a?.country)}); }).join(''));
  const ext=(t,a)=>`<div style="flex:1;min-width:0"><div style="color:var(--muted);font-size:12px">${t}</div><div style="font:700 18px 'JetBrains Mono',monospace">${a.a.iata} → ${a.b.iata}</div><div style="color:var(--muted);font-size:12px">${fmtKm(a.km)} км · ${hm(arcMin(a))}</div></div>`;
  h += card('Маршруты','⇄', S.routes.slice(0,5).map(c=>hbar(c.label, c.n, S.routes[0].n, {sub:fmtKm(c.extra)+' км', color:'var(--accent2)'})).join('')
    + `<div style="display:flex;gap:10px;margin-top:12px">${S.longest?ext('Самый длинный',S.longest):''}${S.shortest && S.arcs.length>1?ext('Самый короткий',S.shortest):''}</div>`);
  h += card('Страны','🏳', `<div style="font-size:22px;line-height:1.5;letter-spacing:3px">${S.countries.map(flagEmoji).join(' ')}</div>
    <div class="donut" style="margin-top:10px">${donut([{n:S.international,color:'var(--accent)'},{n:S.domestic,color:'var(--accent2)'}],90)}<ul><li style="color:var(--accent)"><i style="background:var(--accent)"></i>Международные: ${S.international}</li><li style="color:var(--accent2)"><i style="background:var(--accent2)"></i>Внутренние: ${S.domestic}</li></ul></div>
    ${period==='all' && S.newCountries.length>1 ? `<div class="gfoot" style="margin-top:12px">Новые страны по годам</div>${vbars(S.newCountries,{cls:'green'})}` : ''}`);
  // классы и места
  const cabT=S.cabins.reduce((s,c)=>s+c.n,0), seatT=S.seatTypes.reduce((s,c)=>s+c.n,0);
  let se='';
  if(cabT) se += `<div class="boxes" style="grid-template-columns:repeat(4,1fr)">${S.cabins.map(c=>`<div class="${c.n?'hot':''}"><b>${c.n}</b><small>${c.label}</small></div>`).join('')}</div>`;
  if(seatT){
    se += `<div class="boxes" style="grid-template-columns:repeat(3,1fr);margin-top:6px">${S.seatTypes.map(c=>`<div><div>${c.ico}</div><b>${c.n}</b><small>${c.label}</small></div>`).join('')}</div>`;
    if(S.favoriteSeat) se += `<div style="font-weight:600;margin:12px 0 4px">Любимое место: ${esc(S.favoriteSeat[0])} (${S.favoriteSeat[1]} ${plural(S.favoriteSeat[1],'раз','раза','раз')})</div>`;
    se += `<div class="seatmap" id="seatmap"><img src="seatmap.png" alt=""><canvas></canvas></div>
      <div class="gfoot">Карта примерная: нос слева, места A–C — левый борт (внизу), чем ярче пятно — тем чаще там сидели.</div>`;
  } else se += `<div style="color:var(--muted);font-size:14px;margin-top:8px">Места не указаны. Впишите место (например 18A) в «Изменить» — появится тепловая карта салона.</div>`;
  h += card('Классы и места','💺', se);
  if(S.trips.length){
    const groups=new Set(S.trips.map(t=>t.group??t.id)).size, km=S.trips.reduce((s,t)=>s+(+t.km||dist(t.from,t.to)),0), by={};
    for(const t of S.trips) by[t.mode]=(by[t.mode]||0)+1; const mx=Math.max(...Object.values(by));
    h += card('Наземные поездки','🚌', `<div class="big">${bigv(groups,'поездок')}${bigv(kmShort(km),'км по земле (по прямой)')}</div>`
      + Object.keys(MODES).filter(k=>by[k]).map(k=>hbar(MODES[k].name, by[k], mx, {color:'var(--accent2)', lead:MODES[k].ico})).join(''));
  }
  return h;
}

/** пятна на схеме салона (seatmap.png: белые линии, нос слева) */
function drawSeatHeat(box, seats){
  const cv = box.querySelector('canvas'), r = box.getBoundingClientRect(), dpr = devicePixelRatio||1;
  const W = r.width, H = r.height; if(!W) return;
  cv.width = W*dpr; cv.height = H*dpr; const g = cv.getContext('2d'); g.scale(dpr,dpr);
  const keys = Object.keys(seats).map(k=>k.split(':').map(Number));
  const maxRow = Math.min(60, Math.max(30, Math.max(0,...keys.map(k=>k[0]))+2)), maxN = Math.max(1,...Object.values(seats));
  const lanesY = [0.613,0.577,0.541,0.420,0.380,0.344], x0=W*0.20, x1=W*0.84, pitch=(x1-x0)/maxRow;
  g.save(); g.beginPath(); (g.roundRect ? g.roundRect(W*0.17, H*0.325, W*0.69, H*0.30, 6) : g.rect(W*0.17, H*0.325, W*0.69, H*0.30)); g.clip();
  g.filter = `blur(${W*0.012}px)`;
  for(const [k,n] of Object.entries(seats)){
    const [row,col] = k.split(':').map(Number), q = n/maxN, cx = x0+(row-0.5)*pitch, cy = H*lanesY[Math.min(5,Math.max(0,col))], rr = W*(0.022+0.018*q);
    g.fillStyle = `rgba(33,204,102,${0.5+0.3*q})`; g.beginPath(); g.ellipse(cx,cy,rr*1.3,rr,0,0,7); g.fill();
    g.fillStyle = `rgba(199,255,115,${0.55+0.45*q})`; g.beginPath(); g.ellipse(cx,cy,rr*0.5,rr*0.5,0,0,7); g.fill();
  }
  g.restore();
}

function openStats(initial='all'){
  const today=todayStr();
  const periods = ['all', ...[...new Set(flights.filter(f=>f.date && f.date<=today).map(f=>f.date.slice(0,4)))].sort().reverse()];
  let period = periods.includes(initial) ? initial : 'all';
  const m = openModal({title:'Статистика', left:null, right:'Готово', cls:'tall wide'});
  function paint(){
    const S = computeStats(period);
    m.body.innerHTML = `<div class="pchips">${periods.map(p=>`<button data-p="${p}" class="${p===period?'on':''}">${p==='all'?'Всё время':p}</button>`).join('')}</div>` + statsHTML(S, period);
    m.body.querySelector('.pchips').onclick = e=>{ const b=e.target.closest('[data-p]'); if(b){ period=b.dataset.p; paint(); } };
    const sm = m.body.querySelector('#seatmap');
    if(sm){ const img=sm.querySelector('img'); const go=()=>drawSeatHeat(sm, S.seats); img.complete ? requestAnimationFrame(go) : (img.onload=go); }
  }
  paint();
}
