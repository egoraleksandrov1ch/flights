<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои перелёты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070d; --panel:rgba(14,18,30,.86); --line:rgba(255,255,255,.08);
    --text:#e8ecf5; --muted:#8a93a8; --accent:#ffb347; --accent2:#5ad1ff; --danger:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden}
  #globe{position:fixed;inset:0}
  .panel{position:fixed;top:16px;left:16px;bottom:16px;width:360px;background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;z-index:5;transition:transform .3s}
  .panel.hidden{transform:translateX(calc(-100% - 20px))}
  header{padding:18px 18px 10px}
  h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
  h1 span{color:var(--accent)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 18px 14px}
  .stat{background:rgba(255,255,255,.04);border-radius:10px;padding:8px 6px;text-align:center}
  .stat b{display:block;font-size:16px}
  .stat small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
  form{padding:14px 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;gap:8px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .field{position:relative}
  label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
  input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);border-radius:8px;
    padding:9px 10px;font:inherit;font-size:14px;outline:none}
  input:focus{border-color:var(--accent)}
  input[type=date]{color-scheme:dark}
  .sugg{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:#121827;border:1px solid var(--line);border-radius:8px;
    max-height:240px;overflow:auto;z-index:20;display:none}
  .sugg div{padding:8px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
  .sugg div:last-child{border:0}
  .sugg div:hover,.sugg div.active{background:rgba(255,179,71,.14)}
  .code{font-family:"JetBrains Mono",monospace;color:var(--accent);margin-right:6px}
  .sub{color:var(--muted);font-size:11px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);padding:9px 12px;font-size:13px}
  button:hover{background:rgba(255,255,255,.12)}
  button.primary{background:var(--accent);color:#1a1205;border:0;font-weight:600}
  button.primary:hover{filter:brightness(1.08)}
  .list{flex:1;overflow:auto;padding:8px 10px}
  .flight{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:10px;cursor:pointer}
  .flight:hover{background:rgba(255,255,255,.05)}
  .flight .route{font-family:"JetBrains Mono",monospace;font-size:14px}
  .flight .route i{color:var(--muted);font-style:normal;margin:0 4px}
  .flight .meta{color:var(--muted);font-size:11px;margin-top:2px}
  .flight .del{margin-left:auto;background:none;border:0;color:var(--muted);padding:4px 8px;font-size:16px}
  .flight .del:hover{color:var(--danger)}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:13px}
  footer{display:flex;gap:6px;padding:10px 18px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
  footer button{flex:1;padding:7px 8px;font-size:12px}
  .toggle{position:fixed;top:16px;left:16px;z-index:6;display:none}
  .panel.hidden ~ .toggle{display:block}
  .hide-btn{position:absolute;top:16px;right:14px;padding:4px 9px}
  .ctrls{position:fixed;right:16px;bottom:16px;z-index:5;display:flex;gap:6px}
  .ctrls button{background:var(--panel);backdrop-filter:blur(10px)}
  .err{color:var(--danger);font-size:12px;min-height:0}
  @media (max-width:640px){
    .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:58vh}
    .panel.hidden{transform:translateY(calc(100% + 20px))}
  }
</style>
</head>
<body>
<div id="globe"></div>

<aside class="panel" id="panel">
  <header>
    <h1>Мои <span>перелёты</span></h1>
    <button class="hide-btn" id="hideBtn" title="Скрыть панель">✕</button>
  </header>
  <div class="stats">
    <div class="stat"><b id="sFlights">0</b><small>рейсов</small></div>
    <div class="stat"><b id="sKm">0</b><small>км</small></div>
    <div class="stat"><b id="sAirports">0</b><small>аэроп.</small></div>
    <div class="stat"><b id="sCountries">0</b><small>стран</small></div>
  </div>
  <form id="form" autocomplete="off">
    <div class="row">
      <div class="field"><label>Откуда</label><input id="from" placeholder="WAW, Варшава…" required><div class="sugg"></div></div>
      <div class="field"><label>Куда</label><input id="to" placeholder="IST, London…" required><div class="sugg"></div></div>
    </div>
    <div class="row">
      <div><label>Дата</label><input id="date" type="date"></div>
      <div><label>Авиакомпания / рейс</label><input id="airline" placeholder="LO 123"></div>
    </div>
    <div class="err" id="err"></div>
    <button class="primary" type="submit">Добавить перелёт</button>
  </form>
  <div class="list" id="list"></div>
  <footer>
    <button id="exportBtn">Экспорт</button>
    <button id="importBtn">Импорт</button>
    <button id="clearBtn">Очистить</button>
    <input type="file" id="importFile" accept=".json" hidden>
  </footer>
</aside>
<button class="toggle" id="showBtn">☰ Перелёты</button>

<div class="ctrls">
  <button id="rotateBtn">⟳ Вращение</button>
</div>

<script src="lib/globe.gl.min.js"></script>
<script>
const KEY = 'flights.v1';
let AIRPORTS = [], BY_IATA = {};
let flights = load();
let selected = null;

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(flights)); }catch(e){ alert('Не удалось сохранить в localStorage'); } }

// ---------- Globe ----------
const globe = Globe()(document.getElementById('globe'))
  .globeImageUrl('img/earth-night.jpg')
  .bumpImageUrl('img/earth-topology.png')
  .backgroundImageUrl('img/night-sky.png')
  .atmosphereColor('#5ad1ff').atmosphereAltitude(0.18)
  .arcStartLat(d=>d.a.lat).arcStartLng(d=>d.a.lon).arcEndLat(d=>d.b.lat).arcEndLng(d=>d.b.lon)
  .arcColor(d=> d.id===selected ? ['#ffffff','#ffffff'] : ['rgba(255,179,71,0.9)','rgba(90,209,255,0.9)'])
  .arcStroke(d=> d.id===selected ? 1.1 : 0.55)
  .arcAltitudeAutoScale(0.3)
  .arcDashLength(0.5).arcDashGap(0.15).arcDashAnimateTime(4000)
  .arcLabel(d=>`<b>${d.a.iata} → ${d.b.iata}</b><br>${d.a.city} → ${d.b.city}<br>${fmtKm(d.km)} км${d.date?'<br>'+d.date:''}${d.airline?' · '+esc(d.airline):''}`)
  .pointLat('lat').pointLng('lon').pointColor(()=> '#ffb347').pointAltitude(0.005).pointRadius(d=>0.18+Math.min(d.n,20)*0.02)
  .pointLabel(d=>`<b>${d.iata}</b> ${esc(d.name)}<br>${esc(d.city)}, ${d.country} · ${d.n} рейс(ов)`)
  .labelLat('lat').labelLng('lon').labelText('iata').labelSize(0.45).labelDotRadius(0)
  .labelColor(()=> 'rgba(255,255,255,0.8)').labelAltitude(0.01).labelResolution(2)
  .onArcClick(d=>{ selected = d.id; render(); focusFlight(d); });

globe.controls().autoRotate = true;
globe.controls().autoRotateSpeed = 0.35;
globe.pointOfView({lat:52, lng:21, altitude:2.2});
window.addEventListener('resize', ()=> globe.width(innerWidth).height(innerHeight));

// ---------- Helpers ----------
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtKm(n){ return Math.round(n).toLocaleString('ru-RU'); }
function dist(a,b){
  const R=6371, r=x=>x*Math.PI/180;
  const dLat=r(b.lat-a.lat), dLon=r(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function focusFlight(d){
  globe.controls().autoRotate=false; rotBtnUpdate();
  globe.pointOfView({lat:(d.a.lat+d.b.lat)/2, lng:midLng(d.a.lon,d.b.lon), altitude: Math.min(2.5, 0.6+d.km/6000)}, 1200);
}
function midLng(a,b){ let d=b-a; if(d>180)d-=360; if(d<-180)d+=360; return a+d/2; }

// ---------- Render ----------
function render(){
  const arcs = [], used = {};
  for(const f of flights){
    const a=BY_IATA[f.from], b=BY_IATA[f.to];
    if(!a||!b) continue;
    const km = dist(a,b);
    arcs.push({...f, a, b, km});
    for(const x of [a,b]) used[x.iata] = (used[x.iata]||0)+1;
  }
  const pts = Object.entries(used).map(([k,n])=>({...BY_IATA[k], n}));
  globe.arcsData(arcs).pointsData(pts).labelsData(pts);

  document.getElementById('sFlights').textContent = arcs.length;
  document.getElementById('sKm').textContent = arcs.reduce((s,a)=>s+a.km,0) >= 100000
    ? Math.round(arcs.reduce((s,a)=>s+a.km,0)/1000)+'k' : fmtKm(arcs.reduce((s,a)=>s+a.km,0));
  document.getElementById('sAirports').textContent = pts.length;
  document.getElementById('sCountries').textContent = new Set(pts.map(p=>p.country)).size;

  const list = document.getElementById('list');
  if(!arcs.length){ list.innerHTML = '<div class="empty">Пока нет перелётов.<br>Добавьте первый — он появится дугой на глобусе.</div>'; return; }
  const sorted = [...arcs].sort((x,y)=> (y.date||'').localeCompare(x.date||'') || y.id-x.id);
  list.innerHTML = sorted.map(f=>`
    <div class="flight" data-id="${f.id}" style="${f.id===selected?'background:rgba(255,179,71,.12)':''}">
      <div>
        <div class="route">${f.a.iata}<i>→</i>${f.b.iata}</div>
        <div class="meta">${esc(f.a.city)} → ${esc(f.b.city)} · ${fmtKm(f.km)} км${f.date?' · '+f.date:''}${f.airline?' · '+esc(f.airline):''}</div>
      </div>
      <button class="del" data-del="${f.id}" title="Удалить">×</button>
    </div>`).join('');
}

document.getElementById('list').addEventListener('click', e=>{
  const del = e.target.closest('[data-del]');
  if(del){ e.stopPropagation(); flights = flights.filter(f=>f.id!=del.dataset.del); save(); render(); return; }
  const row = e.target.closest('.flight');
  if(row){
    selected = +row.dataset.id; render();
    const f = globe.arcsData().find(a=>a.id===selected); if(f) focusFlight(f);
  }
});

// ---------- Autocomplete ----------
function search(q){
  q = q.trim().toLowerCase(); if(!q) return [];
  const exact=[], start=[], rest=[];
  for(const a of AIRPORTS){
    if(a.iata.toLowerCase()===q || a.icao.toLowerCase()===q) exact.push(a);
    else if(a.city.toLowerCase().startsWith(q) || a.name.toLowerCase().startsWith(q)) start.push(a);
    else if(a.city.toLowerCase().includes(q) || a.name.toLowerCase().includes(q)) rest.push(a);
    if(exact.length+start.length > 30) break;
  }
  return [...exact,...start,...rest].slice(0,12);
}
function setupAC(input){
  const box = input.nextElementSibling; let items=[], idx=-1;
  const close=()=>{ box.style.display='none'; idx=-1; };
  const pick=a=>{ input.value = `${a.iata} — ${a.city}`; input.dataset.iata=a.iata; close(); };
  input.addEventListener('input', ()=>{
    input.dataset.iata='';
    items = search(input.value);
    if(!items.length){ close(); return; }
    box.innerHTML = items.map((a,i)=>`<div data-i="${i}"><span class="code">${a.iata}</span>${esc(a.city||a.name)}<div class="sub">${esc(a.name)} · ${a.country}</div></div>`).join('');
    box.style.display='block'; idx=-1;
  });
  input.addEventListener('keydown', e=>{
    if(box.style.display!=='block') return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault(); idx = (idx + (e.key==='ArrowDown'?1:-1) + items.length) % items.length;
      [...box.children].forEach((c,i)=>c.classList.toggle('active',i===idx));
    } else if(e.key==='Enter'){ e.preventDefault(); pick(items[Math.max(idx,0)]); }
    else if(e.key==='Escape') close();
  });
  box.addEventListener('mousedown', e=>{ const d=e.target.closest('[data-i]'); if(d){ e.preventDefault(); pick(items[d.dataset.i]); } });
  input.addEventListener('blur', ()=> setTimeout(close,100));
}
function resolve(input){
  if(input.dataset.iata) return input.dataset.iata;
  const q = input.value.trim().split(/\s|—/)[0].toUpperCase();
  if(BY_IATA[q]) return q;
  const icao = AIRPORTS.find(a=>a.icao===q); return icao ? icao.iata : null;
}

// ---------- Form ----------
document.getElementById('form').addEventListener('submit', e=>{
  e.preventDefault();
  const fromEl=document.getElementById('from'), toEl=document.getElementById('to'), err=document.getElementById('err');
  const from=resolve(fromEl), to=resolve(toEl);
  if(!from||!to){ err.textContent='Выберите аэропорты из списка или введите IATA-код (например WAW).'; return; }
  if(from===to){ err.textContent='Аэропорты вылета и прилёта совпадают.'; return; }
  err.textContent='';
  const f = { id: Date.now(), from, to, date: document.getElementById('date').value, airline: document.getElementById('airline').value.trim() };
  flights.push(f); save(); selected=f.id; render();
  const arc = globe.arcsData().find(a=>a.id===f.id); if(arc) focusFlight(arc);
  fromEl.value = toEl.value; fromEl.dataset.iata = to; toEl.value=''; toEl.dataset.iata=''; document.getElementById('airline').value=''; toEl.focus();
});

// ---------- Export / import / clear ----------
document.getElementById('exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(flights,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `flights-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = async e=>{
  const file = e.target.files[0]; if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    if(!Array.isArray(data)) throw 0;
    const clean = data.filter(f=>f && BY_IATA[f.from] && BY_IATA[f.to])
      .map((f,i)=>({id: Number(f.id)||Date.now()+i, from:f.from, to:f.to, date:String(f.date||''), airline:String(f.airline||'')}));
    const replace = flights.length && confirm(`Найдено ${clean.length} перелётов.\nОК — заменить текущие, Отмена — добавить к ним.`);
    const ids = new Set(flights.map(f=>f.id));
    flights = replace ? clean : [...flights, ...clean.filter(f=>!ids.has(f.id))];
    save(); render();
  }catch(_){ alert('Не удалось прочитать файл'); }
  e.target.value='';
};
document.getElementById('clearBtn').onclick = ()=>{
  if(flights.length && confirm('Удалить все перелёты? Совет: сначала сделайте экспорт.')){ flights=[]; save(); render(); }
};

// ---------- UI toggles ----------
const panel=document.getElementById('panel');
document.getElementById('hideBtn').onclick=()=>panel.classList.add('hidden');
document.getElementById('showBtn').onclick=()=>panel.classList.remove('hidden');
const rotBtn=document.getElementById('rotateBtn');
function rotBtnUpdate(){ rotBtn.style.color = globe.controls().autoRotate ? 'var(--accent)' : ''; }
rotBtn.onclick=()=>{ globe.controls().autoRotate=!globe.controls().autoRotate; rotBtnUpdate(); };
rotBtnUpdate();

// ---------- Boot ----------
fetch('airports.json').then(r=>r.json()).then(rows=>{
  AIRPORTS = rows.map(([iata,icao,name,city,country,lat,lon])=>({iata,icao,name,city,country,lat,lon}));
  for(const a of AIRPORTS) if(!BY_IATA[a.iata]) BY_IATA[a.iata]=a;
  setupAC(document.getElementById('from')); setupAC(document.getElementById('to'));
  render();
}).catch(()=>{
  document.getElementById('list').innerHTML='<div class="empty">Не удалось загрузить airports.json.<br>Откройте сайт через веб-сервер (GitHub Pages), а не двойным кликом по файлу.</div>';
});
</script>
</body>
</html>
