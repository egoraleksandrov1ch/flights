<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои перелёты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
  :root{
    --bg:#05070d; --panel:rgba(14,18,30,.9); --line:rgba(255,255,255,.08);
    --text:#e8ecf5; --muted:#8a93a8; --accent:#ffb347; --accent2:#5ad1ff; --danger:#ff6b6b;
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;min-height:100lvh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
  #map,#globe{position:fixed;top:0;left:0;right:0;height:100%;height:100lvh;background:var(--bg)}

  /* ---------- Panel (desktop) ---------- */
  .panel{position:fixed;top:16px;left:16px;bottom:16px;width:360px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;z-index:5;transition:transform .3s ease}
  .panel.hidden{transform:translateX(calc(-100% - 20px))}
  .grip{display:none}
  header{display:flex;align-items:center;gap:8px;padding:18px 18px 10px}
  h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;flex:1}
  h1 span{color:var(--accent)}
  .icon-btn{padding:5px 10px;font-size:15px;line-height:1}
  #addToggle{display:none}
  /* ---------- Паспорт (модальное окно) ---------- */
  .pmodal{position:fixed;inset:0;z-index:50;background:rgba(3,5,12,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
  .pbox{max-width:480px;margin:0 auto}
  .phead{display:flex;align-items:center;margin-bottom:12px}
  .phead h2{flex:1;margin:0;font-size:20px}
  .phead h2 span{color:var(--accent)}
  .phead button{padding:6px 11px;font-size:15px}
  .periods{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
  .periods::-webkit-scrollbar{display:none}
  .periods button{flex:none;border-radius:999px;padding:7px 14px;font-size:14px}
  .periods button.on{background:var(--accent);color:#1a1205;border-color:transparent}
  .pcard{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#1b2340;aspect-ratio:3/4}
  .pcard canvas{display:block;width:100%;height:auto}
  .ploading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
  .psave{width:100%;margin-top:14px;font-size:16px;height:48px;border-radius:12px}
  .psave:disabled{opacity:.5}
  .phint{color:var(--muted);font-size:12px;text-align:center;margin-top:10px}
  body.modal-open .ctrls{display:none}

  .sel{margin:0 18px 10px;padding:10px 12px;border-radius:10px;background:rgba(255,179,71,.12);border:1px solid rgba(255,179,71,.3);
    display:flex;align-items:center;gap:10px}
  .sel .route{font-family:"JetBrains Mono",monospace;font-size:15px}
  .sel .meta{color:var(--muted);font-size:12px;margin-top:2px}
  .sel button{margin-left:auto;background:none;border:0;color:var(--muted);font-size:18px;padding:2px 6px}

  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 18px 14px}
  .stat{background:rgba(255,255,255,.04);border-radius:10px;padding:8px 4px;text-align:center;min-width:0}
  .stat b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em}

  form{padding:14px 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;gap:8px}
  .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
  .field{position:relative;min-width:0}
  label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
  input{display:block;width:100%;min-width:0;max-width:100%;height:40px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);border-radius:8px;
    padding:0 10px;font:inherit;font-size:14px;outline:none;-webkit-appearance:none;appearance:none}
  input:focus{border-color:var(--accent)}
  input[type=date]{color-scheme:dark;text-align:left}
  input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
  input[type=date]::-webkit-calendar-picker-indicator{opacity:.6}
  .sugg{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:#121827;border:1px solid var(--line);border-radius:8px;
    max-height:240px;overflow:auto;z-index:20;display:none;min-width:220px}
  .field:last-child .sugg{left:auto}
  .sugg div{padding:9px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
  .sugg div:last-child{border:0}
  .sugg div:hover,.sugg div.active{background:rgba(255,179,71,.14)}
  .code{font-family:"JetBrains Mono",monospace;color:var(--accent);margin-right:6px}
  .sub{color:var(--muted);font-size:11px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);padding:9px 12px;font-size:13px}
  button:hover{background:rgba(255,255,255,.12)}
  button.primary{background:var(--accent);color:#1a1205;border:0;font-weight:600;height:42px}
  button.primary:hover{filter:brightness(1.08)}

  .list{flex:1;overflow:auto;padding:8px 10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .flight{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:10px;cursor:pointer}
  .flight:hover{background:rgba(255,255,255,.05)}
  .flight.active{background:rgba(255,179,71,.12)}
  .flight .info{min-width:0;flex:1}
  .flight .route{font-family:"JetBrains Mono",monospace;font-size:14px}
  .route i{color:var(--muted);font-style:normal;margin:0 4px}
  .flight .meta{color:var(--muted);font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .flight .del{background:none;border:0;color:var(--muted);padding:6px 10px;font-size:18px;flex:none}
  .flight .del:hover{color:var(--danger)}
  .year.up{color:var(--accent2)}
  .flight.upcoming .route{color:#c9cfdb}
  .badge{font:600 10px Inter,system-ui,sans-serif;color:var(--accent2);background:rgba(90,209,255,.12);border-radius:6px;padding:2px 6px;margin-left:8px;vertical-align:2px}
  .year{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.08em;padding:12px 8px 4px}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:13px}
  footer{display:flex;gap:6px;padding:10px 18px 14px;border-top:1px solid var(--line)}
  footer button{flex:1;padding:8px;font-size:12px}
  .err{color:var(--danger);font-size:12px}
  .err:empty{display:none}

  .toggle{position:fixed;top:16px;left:16px;z-index:6;display:none;background:var(--panel)}
  .panel.hidden ~ .toggle{display:block}

  /* ---------- Map controls ---------- */
  .ctrls{position:fixed;top:calc(var(--safe-t) + 16px);right:16px;z-index:6;display:flex;gap:6px;align-items:flex-start}
  .ctrls > button,.ctrls .layers > button{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .layers{position:relative}
  .menu{position:absolute;top:calc(100% + 6px);right:0;min-width:170px;background:#121827;border:1px solid var(--line);border-radius:12px;padding:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);display:none}
  .layers.open .menu{display:block}
  .menu button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;padding:9px 10px;border-radius:8px;text-align:left}
  .menu button:hover{background:rgba(255,255,255,.07)}
  .menu button.on{color:var(--accent)}
  .menu button.on::after{content:"✓";margin-left:auto}
  .menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
  .menu .cnt{color:var(--muted);font-size:12px;margin-left:auto}
  .menu button.on .cnt{display:none}
  #yearMenu{max-height:60vh;overflow:auto}

  .maplibregl-popup-content{background:#121827;color:var(--text);border-radius:10px;padding:10px 12px;font:13px Inter,system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .maplibregl-popup-tip{border-top-color:#121827!important;border-bottom-color:#121827!important}
  .maplibregl-popup-close-button{color:var(--muted);font-size:16px;padding:0 6px}
  .maplibregl-ctrl-bottom-right{right:6px}

  /* ---------- Mobile: bottom sheet ---------- */
  @media (max-width:640px){
    .panel{top:auto;left:0;right:0;bottom:0;width:auto;height:88dvh;border-radius:18px 18px 0 0;border-bottom:0;
      transform:translateY(var(--sheet-y,50%));transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--safe-b)}
    .panel.dragging{transition:none}
    /* шторка продолжается вниз под панель Safari — без чёрной полосы */
    .panel::after{content:"";position:absolute;left:0;right:0;top:100%;height:50vh;background:#0e121e}
    .panel{overflow:visible}
    .panel > .list{overflow:auto}
    html,body{background:#0e121e}
    .panel.hidden{transform:translateY(var(--sheet-y,50%))}
    .sheet-top{touch-action:none;cursor:grab}
    .grip{display:block;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:8px auto 0}
    header{padding:10px 16px 10px}
    h1{font-size:19px}
    #hideBtn{display:none}
    .share-lbl{display:none}
    #shareBtn{padding:7px 11px;font-size:16px}
    #addToggle{display:block;background:var(--accent);color:#1a1205;border:0;font-weight:700;padding:7px 12px;font-size:14px}
    .panel.adding #addToggle{background:rgba(255,255,255,.08);color:var(--text)}
    .sel{margin:0 16px 10px}
    .stats{padding:0 16px 12px;gap:6px}
    .stat{padding:7px 2px}
    .stat b{font-size:15px}
    .stat small{font-size:9px}
    form{display:none;padding:12px 16px}
    .panel.adding form{display:grid}
    input{font-size:16px;height:42px} /* 16px = без автозума iOS */
    .list{padding:4px 8px}
    .flight{padding:11px 8px}
    footer{padding:10px 16px 12px}
    .ctrls{top:calc(var(--safe-t) + 12px);right:12px}
    .ctrls button{padding:8px 11px}
    .ctrls .lbl{display:none}
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="globe" hidden></div>

<aside class="panel" id="panel">
  <div class="sheet-top" id="sheetTop">
    <div class="grip"></div>
    <header>
      <h1>Мои <span>перелёты</span></h1>
      <button class="icon-btn" id="shareBtn" type="button" title="Поделиться">⤴<span class="share-lbl"> Поделиться</span></button>
      <button class="icon-btn" id="addToggle" type="button">+ Добавить</button>
      <button class="icon-btn" id="hideBtn" type="button" title="Скрыть панель">✕</button>
    </header>
    <div class="sel" id="sel" hidden>
      <div><div class="route" id="selRoute"></div><div class="meta" id="selMeta"></div></div>
      <button id="selClose" type="button" title="Снять выделение">×</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="sFlights">0</b><small>рейсов</small></div>
      <div class="stat"><b id="sKm">0</b><small>км</small></div>
      <div class="stat"><b id="sAirports">0</b><small>аэроп.</small></div>
      <div class="stat"><b id="sCountries">0</b><small>стран</small></div>
    </div>
  </div>
  <form id="form" autocomplete="off">
    <div class="row">
      <div class="field"><label>Откуда</label><input id="from" placeholder="WAW, Варшава…" required><div class="sugg"></div></div>
      <div class="field"><label>Куда</label><input id="to" placeholder="IST, London…" required><div class="sugg"></div></div>
    </div>
    <div class="row">
      <div class="field"><label>Дата</label><input id="date" type="date"></div>
      <div class="field"><label>Авиакомпания / рейс</label><input id="airline" placeholder="LO 123"></div>
    </div>
    <div class="err" id="err"></div>
    <button class="primary" type="submit">Добавить перелёт</button>
  </form>
  <div class="list" id="list"></div>
  <footer>
    <button id="exportBtn" type="button">Экспорт</button>
    <button id="importBtn" type="button">Импорт</button>
    <button id="clearBtn" type="button">Очистить</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </footer>
</aside>
<button class="toggle" id="showBtn">☰ Перелёты</button>

<div class="pmodal" id="passportModal" hidden>
  <div class="pbox">
    <div class="phead">
      <h2>Лётный <span>паспорт</span></h2>
      <button id="passClose" type="button" title="Закрыть">✕</button>
    </div>
    <div class="periods" id="passPeriods"></div>
    <div class="pcard"><canvas id="passCv" width="1080" height="1440"></canvas><div class="ploading" id="passLoading">Рисую паспорт…</div></div>
    <button class="primary psave" id="passSave" type="button" disabled>Сохранить фото</button>
    <div class="phint">Только совершённые перелёты. Время в полёте — оценка по расстоянию.</div>
  </div>
</div>

<div class="ctrls">
  <div class="layers" id="years">
    <button id="yearBtn" type="button">📅 Всё время</button>
    <div class="menu" id="yearMenu"></div>
  </div>
  <button id="rotateBtn" type="button" title="Вращение">⟳<span class="lbl"> Вращение</span></button>
  <div class="layers" id="layers">
    <button id="layersBtn" type="button">🗺 Карта</button>
    <div class="menu" id="menu">
      <button data-view="map" type="button">🗺 Карта</button>
      <button data-view="dark" type="button">🌑 Тёмная</button>
      <button data-view="sat" type="button">🛰 Спутник</button>
      <button data-view="globe3d" type="button">🌍 3D глобус</button>
      <div id="dayNightWrap" hidden>
        <hr>
        <button id="dayNightBtn" type="button">☀ Дневная Земля</button>
      </div>
    </div>
  </div>
</div>

<script src="lib/maplibre-gl.js"></script>
<script>
const KEY = 'flights.v1';
let AIRPORTS = [], BY_IATA = {};
let flights = load();
let selected = null;
let ARCS = [], PTS = [];          // данные, которые рисуют обе карты
const isMobile = () => matchMedia('(max-width:640px)').matches;

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(flights)); }catch(e){ alert('Не удалось сохранить в localStorage'); } }
function lsGet(k,d){ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

// ---------- Helpers ----------
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtKm(n){ return Math.round(n).toLocaleString('ru-RU'); }
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return `${d}.${m}.${y}`; }
const RAD = Math.PI/180;
function dist(a,b){
  const dLat=(b.lat-a.lat)*RAD, dLon=(b.lon-a.lon)*RAD;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*RAD)*Math.cos(b.lat*RAD)*Math.sin(dLon/2)**2;
  return 2*6371*Math.asin(Math.sqrt(h));
}
function midLng(a,b){ let d=b-a; if(d>180)d-=360; if(d<-180)d+=360; return a+d/2; }
// дуга большого круга — реальный кратчайший путь самолёта
function greatCircle(a,b,n){
  const toV=p=>[Math.cos(p.lat*RAD)*Math.cos(p.lon*RAD), Math.cos(p.lat*RAD)*Math.sin(p.lon*RAD), Math.sin(p.lat*RAD)];
  const A=toV(a), B=toV(b);
  const d=Math.acos(Math.min(1,Math.max(-1,A[0]*B[0]+A[1]*B[1]+A[2]*B[2])));
  if(d<1e-6) return [[a.lon,a.lat],[b.lon,b.lat]];
  n = n || Math.max(16, Math.ceil(d/RAD*1.5));
  const out=[]; let prev=null;
  for(let i=0;i<=n;i++){
    const f=i/n, s1=Math.sin((1-f)*d)/Math.sin(d), s2=Math.sin(f*d)/Math.sin(d);
    const x=s1*A[0]+s2*B[0], y=s1*A[1]+s2*B[1], z=s1*A[2]+s2*B[2];
    let lon=Math.atan2(y,x)/RAD; const lat=Math.atan2(z,Math.hypot(x,y))/RAD;
    if(prev!==null){ while(lon-prev>180) lon-=360; while(lon-prev<-180) lon+=360; } // без разрыва на 180°
    out.push([lon,lat]); prev=lon;
  }
  return out;
}

// ======================================================================
//  Вид 1: MapLibre (основная карта-глобус)
// ======================================================================
const SAT_STYLE = {
  version:8,
  glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
  sources:{
    sat:{type:'raster',tileSize:256,maxzoom:19,
      tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
      attribution:'Снимки © Esri, Maxar, Earthstar Geographics'},
    places:{type:'raster',tileSize:256,maxzoom:19,
      tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}']}
  },
  layers:[
    {id:'bg',type:'background',paint:{'background-color':'#0b1020'}},
    {id:'sat',type:'raster',source:'sat'},
    {id:'places',type:'raster',source:'places',paint:{'raster-opacity':0.9}}
  ]
};
const VIEWS = {
  map:    { label:'🗺 Карта',    style:'https://tiles.openfreemap.org/styles/liberty', line:'#ff5a1f', line2:'#1f7aff', selLine:'#d10068', dot:'#ff5a1f', text:'#1b1f2a', upLine:'#7d8696', upSel:'#4b5363', halo:'#ffffff' },
  dark:   { label:'🌑 Тёмная',   style:'https://tiles.openfreemap.org/styles/dark',    line:'#ffb347', line2:'#5ad1ff', selLine:'#ffffff', dot:'#ffb347', text:'#ffffff', upLine:'#8a93a8', upSel:'#c9cfdb', halo:'#05070d' },
  sat:    { label:'🛰 Спутник',  style:SAT_STYLE,                                       line:'#ffb347', line2:'#5ad1ff', selLine:'#ffffff', dot:'#ffb347', text:'#ffffff', upLine:'#c9cfdb', upSel:'#ffffff', halo:'#05070d' },
  globe3d:{ label:'🌍 3D глобус' }
};
let view = VIEWS[lsGet('flights.view','map')] ? lsGet('flights.view','map') : 'map';
let map = null, mapReady = false, popup = null;
let rotating = true;

function initMap(){
  const v = VIEWS[view === 'globe3d' ? 'map' : view];
  map = new maplibregl.Map({
    container:'map', style:v.style, center:[21,50], zoom: isMobile()?0.9:1.6,
    attributionControl:{compact:true}, renderWorldCopies:false, maxPitch:60,
    dragRotate:false
  });
  map.touchZoomRotate.disableRotation();
  if(!isMobile()) map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'bottom-right');
  map.on('style.load', ()=>{
    map.setProjection({type:'globe'});
    try{ map.setSky({'atmosphere-blend':['interpolate',['linear'],['zoom'],0,1,5,1,7,0]}); }catch(e){}
    addOverlay();
    mapReady = true;
  });
  // остановить вращение, когда пользователь трогает карту
  ['mousedown','touchstart','wheel','dragstart'].forEach(ev=> map.on(ev, ()=>{ if(rotating){ rotating=false; rotBtnUpdate(); } }));
  map.on('click','flights-hit', e=>{ const f=e.features[0]; if(f) selectFlight(Number(f.properties.id)); });
  map.on('click','airports', e=>{
    const p=e.features[0].properties, a=BY_IATA[p.iata]; if(!a) return;
    popup?.remove();
    popup = new maplibregl.Popup({offset:10,closeButton:true}).setLngLat([a.lon,a.lat])
      .setHTML(`<b>${a.iata}</b> · ${esc(a.name)}<br><span style="color:#8a93a8">${esc(a.city)}, ${a.country} · ${p.n} рейс(ов)</span>`).addTo(map);
  });
  for(const l of ['flights-hit','airports']){
    map.on('mouseenter',l,()=>map.getCanvas().style.cursor='pointer');
    map.on('mouseleave',l,()=>map.getCanvas().style.cursor='');
  }
  requestAnimationFrame(spin);
}

let lastT = 0;
function spin(t){
  if(map && view!=='globe3d' && rotating && !document.hidden && map.getZoom() < 3.5 && !map.isMoving()){
    const dt = lastT ? Math.min(100, t-lastT) : 16;
    const c = map.getCenter(); c.lng -= dt * 0.004;
    map.jumpTo({center:c});
  }
  lastT = t;
  requestAnimationFrame(spin);
}

function addOverlay(){

  if(!map.getSource('airports')) map.addSource('airports',{type:'geojson',data:airportsGeo()});

    paint:{'line-width':1.6,'line-opacity':0.4,'line-gradient':['interpolate',['linear'],['line-progress'],0,v.line,1,v.line2]}});
  // 1b) предстоящие перелёты — серый пунктир, без импульса
  map.addLayer({id:'flights-up',type:'line',source:'flights',layout:{'line-join':'round'},filter:['get','up'],
    paint:{'line-width':1.8,'line-color':v.upLine,'line-opacity':0.85,'line-dasharray':[2,2]}});
  // 2) выбранный перелёт — сплошной яркой линией

  map.addLayer({id:'flights-pulse',type:'line',source:'flights',layout:round,
    paint:{'line-width':3,'line-gradient':pulseExpr(0)}});
  map.addLayer({id:'flights-hit',type:'line',source:'flights',paint:{'line-width':16,'line-opacity':0}});
  map.addLayer({id:'airports',type:'circle',source:'airports',

    paint:{'text-color':v.text,'text-halo-color':v.halo,'text-halo-width':1.4}});
  styleOverlay();
}
function styleOverlay(){
  if(!map || !map.getLayer('flights-base')) return;
  const hasSel = selected!=null;
  map.setPaintProperty('flights-base','line-opacity', hasSel ? 0.18 : 0.4);
  map.setFilter('flights-sel', ['==',['get','id'], hasSel ? selected : -1]);
  // при выборе импульс бежит только по выбранному маршруту
  const notUp = ['!',['get','up']];
  map.setFilter('flights-pulse', hasSel ? ['all',['==',['get','id'],selected],notUp] : notUp);

// ---------- Импульс вдоль линий ----------
const PULSE_MS = 4000, PULSE_LEN = 0.4;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function hexRgb(h){ h=h.replace('#',''); return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)); }
function pulseExpr(phase){
  const v = VIEWS[view] || VIEWS.map;
  const A = hexRgb(v.line), B = hexRgb(v.line2);
  const head = phase*(1+PULSE_LEN), tail = head-PULSE_LEN;
  const col = (x,a)=>{ const c=A.map((av,i)=>Math.round(av+(B[i]-av)*x)); return `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)})`; };
  const alphaAt = x => (x>=tail && x<=head) ? Math.pow((x-tail)/PULSE_LEN, 1.1) : 0;
  const xs = new Set([0,1]);
  for(let i=1;i<40;i++) xs.add(i/40);
  for(const x of [tail, head, head+0.004]) if(x>0 && x<1) xs.add(x);
  const sorted = [...xs].sort((a,b)=>a-b);
  const expr = ['interpolate',['linear'],['line-progress']];
  let prev = -1;
  for(const x of sorted){
    if(x-prev < 1e-4) continue;
    expr.push(x, col(x, x>head ? 0 : alphaAt(x)));
    prev = x;
  }
  return expr;
}
let lastPulse = 0;
function pulse(t){
  if(map && mapReady && view!=='globe3d' && !document.hidden && !reduceMotion && t-lastPulse > 33 && map.getLayer('flights-pulse')){
    lastPulse = t;
    map.setPaintProperty('flights-pulse','line-gradient', pulseExpr((t % PULSE_MS)/PULSE_MS));
  }
  requestAnimationFrame(pulse);
}
requestAnimationFrame(pulse);
function flightsGeo(){
  return {type:'FeatureCollection',features:ARCS.map((d,i)=>({type:'Feature',
    properties:{id:d.id, up:!!d.up},
    geometry:{type:'LineString',coordinates:d.line}}))};
}
function airportsGeo(){
  return {type:'FeatureCollection',features:PTS.map(p=>({type:'Feature',properties:{iata:p.iata,n:p.n},geometry:{type:'Point',coordinates:[p.lon,p.lat]}}))};
}
function updateMap(){
  if(!map || !mapReady) return;
  map.getSource('flights')?.setData(flightsGeo());
  map.getSource('airports')?.setData(airportsGeo());
  styleOverlay();
}
function focusMap(d){
  const lons=d.line.map(c=>c[0]), lats=d.line.map(c=>c[1]);
  map.fitBounds([[Math.min(...lons),Math.min(...lats)],[Math.max(...lons),Math.max(...lats)]],
    {padding:40, maxZoom:6.5, duration:1200});
}
function setMapStyle(){

}

// ======================================================================
//  Вид 2: 3D глобус (globe.gl) — загружается только когда нужен
// ======================================================================
let globe = null, globeLoading = null, zoomK = 1;
const BASE_ALT = 2.2;
const EARTH = { night:'img/earth-night.jpg', day:'img/earth-blue-marble.jpg' };
let earthMode = lsGet('flights.map','night')==='day' ? 'day' : 'night';

function loadGlobe(){
  if(globe) return Promise.resolve();
  if(globeLoading) return globeLoading;
  globeLoading = new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src='lib/globe.gl.min.js';
    s.onload=()=>{ createGlobe(); res(); }; s.onerror=rej; document.head.appendChild(s);
  });
  return globeLoading;
}
function createGlobe(){
  globe = Globe({ rendererConfig:{ antialias:true } })(document.getElementById('globe'))
    .globeImageUrl(EARTH[earthMode])
    .bumpImageUrl('img/earth-topology.png')
    .backgroundImageUrl('img/night-sky.png')
    .atmosphereColor('#5ad1ff').atmosphereAltitude(0.18)
    .arcStartLat(d=>d.a.lat).arcStartLng(d=>d.a.lon).arcEndLat(d=>d.b.lat).arcEndLng(d=>d.b.lon)
    .arcStroke(null)   // 1px — не утолщается при приближении
    .arcAltitudeAutoScale(0.3)
    .arcDashLength(d=>d.up?0.02:0.5).arcDashGap(d=>d.up?0.015:0.15).arcDashAnimateTime(d=>d.up?0:4000)
    .arcLabel(d=>`<b>${d.a.iata} → ${d.b.iata}</b><br>${esc(d.a.city)} → ${esc(d.b.city)}<br>${fmtKm(d.km)} км${d.date?'<br>'+fmtDate(d.date):''}${d.airline?' · '+esc(d.airline):''}`)
    .pointLat('lat').pointLng('lon').pointColor(()=> '#ffb347').pointAltitude(0.002).pointResolution(12)
    .pointLabel(d=>`<b>${d.iata}</b> ${esc(d.name)}<br>${esc(d.city)}, ${d.country} · ${d.n} рейс(ов)`)
    .labelLat('lat').labelLng('lon').labelText('iata').labelDotRadius(0)
    .labelColor(()=> 'rgba(255,255,255,0.8)').labelAltitude(0.004).labelResolution(2)
    .onArcClick(d=> selectFlight(d.id))
    .onZoom(pov=>{
      const k = Math.max(0.06, Math.min(1, pov.altitude / BASE_ALT));
      if(Math.abs(k-zoomK)/zoomK > 0.08){ zoomK = k; globeSizes(); }
    });
  globeSizes();
  globe.controls().autoRotateSpeed = 0.35;
  globe.controls().addEventListener('start', ()=>{ if(rotating){ rotating=false; rotBtnUpdate(); } });
  const c = map ? map.getCenter() : {lat:50,lng:21};
  globe.pointOfView({lat:c.lat, lng:c.lng, altitude:BASE_ALT});
}
function globeSizes(){
  const k=zoomK;
  globe.pointRadius(d=>(0.16+Math.min(d.n,20)*0.015)*k).labelSize(()=>0.42*Math.max(k,0.2));
}
function updateGlobe(){
  if(!globe) return;
  globe.arcColor(d=> d.up ? (d.id===selected ? ['#ffffff','#ffffff'] : selected==null ? ['rgba(170,178,195,0.8)','rgba(170,178,195,0.8)'] : ['rgba(170,178,195,0.3)','rgba(170,178,195,0.3)'])
                  : selected==null ? ['rgba(255,179,71,0.95)','rgba(90,209,255,0.95)']
                  : d.id===selected ? ['#ffffff','#ffffff'] : ['rgba(255,179,71,0.25)','rgba(90,209,255,0.25)']);
  globe.arcsData(ARCS).pointsData(PTS).labelsData(PTS);
  globe.controls().autoRotate = rotating;
}
function focusGlobe(d){
  globe.pointOfView({lat:(d.a.lat+d.b.lat)/2, lng:midLng(d.a.lon,d.b.lon), altitude: Math.min(2.5, 0.5+d.km/5500)}, 1200);
}

function yearLabel(y){ return y==='all' ? 'Всё время' : y==='none' ? 'Без даты' : y; }
function renderYears(){

// ---------- Render ----------
let yearFilter = lsGet('flights.year','all');
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
const isUpcoming = f => !!f.date && f.date > todayStr();
function untilLabel(date){
  const days = Math.round((new Date(date+'T00:00') - new Date(todayStr()+'T00:00'))/864e5);
  if(days===1) return 'завтра';
  const m = days%10, h = days%100;
  const w = (m===1 && h!==11) ? 'день' : (m>=2 && m<=4 && (h<12||h>14)) ? 'дня' : 'дней';
  return `через ${days} ${w}`;
}
const yearOf = f => f.date ? f.date.slice(0,4) : 'none';
function render(){
  renderYears();
  const arcs = [], used = {};
  for(const f of flights){
    if(yearFilter!=='all' && yearOf(f)!==yearFilter) continue;
    const a=BY_IATA[f.from], b=BY_IATA[f.to];
    if(!a||!b) continue;
    const up = isUpcoming(f);
    arcs.push({...f, a, b, up, km: dist(a,b), line: greatCircle(a,b)});
    for(const x of [a,b]) used[x.iata] = (used[x.iata]||0)+1;
  }
  // статистика — только по совершённым перелётам
  const done = arcs.filter(a=>!a.up), doneAp = new Set(done.flatMap(a=>[a.a.iata,a.b.iata]));
  ARCS = arcs;
  PTS = Object.entries(used).map(([k,n])=>({...BY_IATA[k], n}));
  if(selected!=null && !arcs.some(a=>a.id===selected)) selected=null;
  updateMap(); updateGlobe();

  const total = done.reduce((s,a)=>s+a.km,0);
  document.getElementById('sFlights').textContent = done.length;
  document.getElementById('sKm').textContent = total >= 100000 ? Math.round(total/1000)+'k' : fmtKm(total);
  document.getElementById('sAirports').textContent = doneAp.size;
  document.getElementById('sCountries').textContent = new Set([...doneAp].map(k=>BY_IATA[k].country)).size;

  const s = arcs.find(a=>a.id===selected), sel = document.getElementById('sel');
  if(s){
    sel.hidden = false;
    document.getElementById('selRoute').innerHTML = `${s.a.iata}<i>→</i>${s.b.iata}`;
    document.getElementById('selMeta').textContent = `${s.a.city} → ${s.b.city} · ${fmtKm(s.km)} км${s.date?' · '+fmtDate(s.date):''}${s.airline?' · '+s.airline:''}`;
  } else sel.hidden = true;
  updatePeek();

  const list = document.getElementById('list');
  if(!arcs.length){ list.innerHTML = flights.length ? '<div class="empty">За этот период перелётов нет.</div>' : '<div class="empty">Пока нет перелётов.<br>Нажмите «Добавить» — перелёт появится линией на карте.</div>'; return; }
  // предстоящие — сверху, ближайший первым; дальше прошедшие по годам
  const upcoming = arcs.filter(a=>a.up).sort((x,y)=> x.date.localeCompare(y.date));
  const past = arcs.filter(a=>!a.up).sort((x,y)=> (y.date||'').localeCompare(x.date||'') || y.id-x.id);
  let lastYear = null, html = '';
  if(upcoming.length) html += `<div class="year up">Предстоящие</div>`;
  for(const f of [...upcoming, ...past]){
    if(!f.up){
      const y = f.date ? f.date.slice(0,4) : 'Без даты';
      if(y!==lastYear){ html += `<div class="year">${y}</div>`; lastYear=y; }
    }
    html += `
    <div class="flight${f.id===selected?' active':''}${f.up?' upcoming':''}" data-id="${f.id}">
      <div class="info">
        <div class="route">${f.a.iata}<i>→</i>${f.b.iata}${f.up?`<span class="badge">${untilLabel(f.date)}</span>`:''}</div>
        <div class="meta">${esc(f.a.city)} → ${esc(f.b.city)} · ${fmtKm(f.km)} км${f.date?' · '+fmtDate(f.date):''}${f.airline?' · '+esc(f.airline):''}</div>
      </div>
      <button class="del" data-del="${f.id}" title="Удалить" type="button">×</button>
    </div>`;
  }
  list.innerHTML = html;
}

// ---------- Autocomplete ----------
function search(q){
  q = q.trim().toLowerCase(); if(!q) return [];
  const exact=[], start=[], rest=[];
  for(const a of AIRPORTS){
    if(a.iata.toLowerCase()===q || a.icao.toLowerCase()===q) exact.push(a);
    else if(a.city.toLowerCase().startsWith(q) || a.name.toLowerCase().startsWith(q)) start.push(a);
    else if(rest.length<20 && (a.city.toLowerCase().includes(q) || a.name.toLowerCase().includes(q))) rest.push(a);
    if(exact.length+start.length > 30) break;
  }
  return [...exact,...start,...rest].slice(0,12);
}
function setupAC(input){
  const box = input.nextElementSibling; let items=[], idx=-1;
  const close=()=>{ box.style.display='none'; idx=-1; };
  const pick=a=>{ input.value = `${a.iata} — ${a.city}`; input.dataset.iata=a.iata; close(); };
  input.addEventListener('input', ()=>{
    input.dataset.iata='';
    items = search(input.value);
    if(!items.length){ close(); return; }
    box.innerHTML = items.map((a,i)=>`<div data-i="${i}"><span class="code">${a.iata}</span>${esc(a.city||a.name)}<div class="sub">${esc(a.name)} · ${a.country}</div></div>`).join('');
    box.style.display='block'; idx=-1;
  });
  input.addEventListener('keydown', e=>{
    if(box.style.display!=='block') return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault(); idx = (idx + (e.key==='ArrowDown'?1:-1) + items.length) % items.length;
      [...box.children].forEach((c,i)=>c.classList.toggle('active',i===idx));
    } else if(e.key==='Enter'){ e.preventDefault(); pick(items[Math.max(idx,0)]); }
    else if(e.key==='Escape') close();
  });
  box.addEventListener('pointerdown', e=>{ const d=e.target.closest('[data-i]'); if(d){ e.preventDefault(); pick(items[d.dataset.i]); } });
  input.addEventListener('blur', ()=> setTimeout(close,150));
}
function resolve(input){
  if(input.dataset.iata) return input.dataset.iata;
  const q = input.value.trim().split(/\s|—/)[0].toUpperCase();
  if(BY_IATA[q]) return q;
  const icao = AIRPORTS.find(a=>a.icao===q); return icao ? icao.iata : null;
}

document.getElementById('form').addEventListener('submit', e=>{

};

// ---------- Mobile bottom sheet ----------
let sheet = 'half';
const sheetTop = document.getElementById('sheetTop');
function sheetH(){ return panel.getBoundingClientRect().height; }
function peekH(){ return sheetTop.offsetHeight + 4 + (parseFloat(getComputedStyle(panel).paddingBottom)||0); }
function visibleFor(state){
  const H = sheetH();
  if(state==='peek') return peekH();
  if(state==='full') return H;
  return Math.min(H, Math.max(peekH()+180, innerHeight*0.5));
}
function applySheet(){
  if(!isMobile()){
    panel.style.removeProperty('--sheet-y');
    setMapInsets(panel.classList.contains('hidden') ? 0 : 392, 0);
    sizeGlobe(innerHeight); return;
  }
  const vis = visibleFor(sheet);
  panel.style.setProperty('--sheet-y', (sheetH()-vis)+'px');
  const covered = sheet==='full' ? visibleFor('half') : vis;
  // карта занимает весь экран (под шторкой и статус-баром), а центр смещается в видимую часть
  setMapInsets(0, covered);
  sizeGlobe(innerHeight - covered + 16);
}
function setMapInsets(left, bottom){
  if(!map) return;
  const top = isMobile() ? 56 : 0;
  const p = map.getPadding();
  if(p.left===left && p.bottom===bottom && p.top===top) return;
  map.easeTo({padding:{left, bottom, top, right:0}, duration: mapReady ? 300 : 0});
}
function setSheet(state){ sheet = state; applySheet(); }
function updatePeek(){ if(isMobile() && sheet==='peek') applySheet(); }
function sizeGlobe(h){
  h = Math.max(200, Math.round(h));
  document.getElementById('globe').style.height = h+'px';
  if(globe) globe.width(innerWidth).height(h);
}

let drag = null;
sheetTop.addEventListener('pointerdown', e=>{
  if(!isMobile() || e.target.closest('button')) return;
  drag = { y0:e.clientY, start: sheetH()-visibleFor(sheet), moved:false };
  panel.classList.add('dragging'); sheetTop.setPointerCapture(e.pointerId);
});
sheetTop.addEventListener('pointermove', e=>{
  if(!drag) return;
  const dy = e.clientY - drag.y0; if(Math.abs(dy)>4) drag.moved = true;
  const y = Math.min(sheetH()-peekH(), Math.max(0, drag.start + dy));
  panel.style.setProperty('--sheet-y', y+'px');
});
function endDrag(e){
  if(!drag) return;
  panel.classList.remove('dragging');
  const dy = e.clientY - drag.y0, moved = drag.moved; drag = null;
  const order = ['peek','half','full'];
  let i = order.indexOf(sheet);
  if(!moved) i = sheet==='peek' ? 1 : 0;
  else if(dy < -40) i = Math.min(2, i+1);
  else if(dy > 40) i = Math.max(0, i-1);
  if(order[i]==='peek') panel.classList.remove('adding');
  setSheet(order[i]);
}
sheetTop.addEventListener('pointerup', endDrag);
sheetTop.addEventListener('pointercancel', endDrag);

document.getElementById('addToggle').onclick = ()=>{
  const on = !panel.classList.contains('adding');
  panel.classList.toggle('adding', on);
  setSheet(on ? 'full' : 'half');
  if(on) setTimeout(()=>document.getElementById(document.getElementById('from').value ? 'to' : 'from').focus(), 320);
};
addEventListener('resize', ()=> applySheet());

viewUi();
applySheet();

});

<script>
// ======================================================================
//  Лётный паспорт — модальное окно «Поделиться»
// ======================================================================
const Passport = (()=>{
  const W = 1080, H = 1440;
  const MAP = { x:40, y:120, w:1000, h:560 };
  const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const modal = document.getElementById('passportModal');
  const cv = document.getElementById('passCv'), ctx = cv.getContext('2d');
  let LAND = null, landLoading = null, period = 'all';

  const isDone = f => !f.date || f.date <= todayStr();
  function fmtD(s, compact){ const [y,m,d]=s.split('-'); return compact ? `${d}${MON[+m-1]}${y.slice(2)}` : `${d} ${MON[+m-1]} ${y.slice(2)}`; }
  function flagEmoji(cc){ return cc && cc.length===2 ? String.fromCodePoint(...[...cc.toUpperCase()].map(c=>0x1F1E6+c.charCodeAt(0)-65)) : ''; }
  function mix(c1,c2,t){ return c1.map((v,i)=>Math.round(v+(c2[i]-v)*t)); }

  function loadLand(){
    if(LAND) return Promise.resolve();
    if(landLoading) return landLoading;
    landLoading = new Promise((res)=>{
      const s=document.createElement('script'); s.src='lib/topojson-client.min.js';
      s.onload = async ()=>{
        try{
          const topo = await fetch('lib/land-50m.json').then(r=>r.json());
          const geo = topojson.feature(topo, topo.objects.land);
          LAND = geo.features.flatMap(f => f.geometry.type==='Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates);
        }catch(e){}
        res();
      };
      s.onerror = ()=>res();
      document.head.appendChild(s);
    });
    return landLoading;
  }

  function compute(){
    const all = flights.filter(f=>BY_IATA[f.from] && BY_IATA[f.to] && isDone(f));
    const list = (period==='all' ? all : all.filter(f=>(f.date||'').startsWith(period)))
      .sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
    let km = 0; const apCount = {}, routes = {}, countries = [], airlines = new Set();
    for(const f of list){
      const a=BY_IATA[f.from], b=BY_IATA[f.to];
      km += dist(a,b);
      for(const x of [a,b]) apCount[x.iata]=(apCount[x.iata]||0)+1;
      const key = [f.from,f.to].sort().join('-'); routes[key]=(routes[key]||0)+1;
      const al = (f.airline||'').replace(/\s*\d+\s*$/,'').trim().toLowerCase();
      if(al) airlines.add(al);
    }
    // флаги — страны прилёта, от последнего перелёта к первому
    for(const f of [...list].reverse()){
      const c = BY_IATA[f.to].country;
      if(c && !countries.includes(c)) countries.push(c);
    }
    const top = o => Object.entries(o).sort((a,b)=>b[1]-a[1])[0]?.[0];
    const home = top(apCount) || '---';
    let route = top(routes)?.split('-') || [home, home];
    if(route[1]===home) route = [route[1], route[0]];   // маршрут начинается с «домашнего» аэропорта
    const dates = list.map(f=>f.date).filter(Boolean).sort();
    const hours = list.reduce((s,f)=>s + dist(BY_IATA[f.from],BY_IATA[f.to])/780 + 0.5, 0);
    return { list, km, hours, airports:Object.keys(apCount).length, airlines:airlines.size, countries, home, route, since: dates[0] || null };
  }

  function millerY(lat){ return 1.25*Math.log(Math.tan(Math.PI/4 + 0.4*lat*RAD)); }
  const Y_TOP = millerY(83.5), Y_BOT = millerY(-57);
  function proj(lon, lat){
    const k = MAP.w/(2*Math.PI);
    return [MAP.x + (lon+180)/360*MAP.w,
            MAP.y + (Y_TOP - millerY(Math.max(-85,Math.min(85,lat))))*k + (MAP.h - (Y_TOP-Y_BOT)*k)/2];
  }
  function landPath(dx=0, dy=0){
    const p = new Path2D();
    for(const poly of LAND) for(const ring of poly){
      let prev = null; const pts = [];
      for(const [lon0,lat] of ring){
        let lon = lon0;
        if(prev!==null){ while(lon-prev>180) lon-=360; while(lon-prev<-180) lon+=360; }
        pts.push([lon,lat]); prev = lon;
      }
      const minL = Math.min(...pts.map(q=>q[0])), maxL = Math.max(...pts.map(q=>q[0]));
      const shifts = [0]; if(maxL>180) shifts.push(-360); if(minL<-180) shifts.push(360);
      for(const sh of shifts){
        pts.forEach(([lon,lat],i)=>{ const [x,y]=proj(lon+sh,lat); i ? p.lineTo(x+dx,y+dy) : p.moveTo(x+dx,y+dy); });
        p.closePath();
      }
    }
    return p;
  }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); }
  function planeIcon(x, y, s, color, rot=0){
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s/24, s/24); ctx.fillStyle=color;
    ctx.beginPath();
    ctx.moveTo(12,0); ctx.lineTo(9,-2); ctx.lineTo(1,-2); ctx.lineTo(-4,-10); ctx.lineTo(-7,-10); ctx.lineTo(-4,-2); ctx.lineTo(-9,-2);
    ctx.lineTo(-11,-5); ctx.lineTo(-13,-5); ctx.lineTo(-12,0); ctx.lineTo(-13,5); ctx.lineTo(-11,5); ctx.lineTo(-9,2); ctx.lineTo(-4,2);
    ctx.lineTo(-7,10); ctx.lineTo(-4,10); ctx.lineTo(1,2); ctx.lineTo(9,2); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function draw(){
    const S = compute();
    ctx.clearRect(0,0,W,H);
    let g = ctx.createLinearGradient(0,0,W*0.4,H);
    g.addColorStop(0,'#bfe3fb'); g.addColorStop(0.45,'#b9b6f3'); g.addColorStop(1,'#9fd0f5');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    g = ctx.createLinearGradient(0,740,0,H);
    g.addColorStop(0,'rgba(120,100,230,0.28)'); g.addColorStop(1,'rgba(90,170,240,0.10)');
    ctx.fillStyle = g; ctx.fillRect(0,740,W,H-740);

    // гильош
    ctx.save(); ctx.lineWidth = 1;
    for(let i=0;i<46;i++){
      ctx.strokeStyle = `rgba(255,255,255,${0.10 + (i%3===0?0.06:0)})`;
      ctx.beginPath();
      for(let x=0;x<=W;x+=12){ const y = i*32 + Math.sin(x/90 + i*0.7)*10 + Math.sin(x/37 + i)*3; x ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }
      ctx.stroke();
    }
    ctx.restore();

    // текстура из IATA-кодов
    ctx.save(); ctx.translate(W*0.62, 1040); ctx.rotate(-0.33);
    ctx.font = '500 22px "JetBrains Mono", monospace'; ctx.fillStyle = 'rgba(80,60,170,0.045)';
    const codes = [...new Set(S.list.flatMap(f=>[f.from,f.to]))];
    const pool = codes.length ? codes : ['WAW','LHR','JFK','CDG','IST','DXB'];
    for(let r=-12;r<12;r++){ let row=''; for(let c=0;c<14;c++) row += pool[(r*7+c*3+144)%pool.length]+' '; ctx.fillText(row, -620, r*30); }
    ctx.restore();

    // верхняя полоска: самый популярный аэропорт
    const A1=[244,114,182], A2=[94,224,200], A3=[167,139,250];
    for(let i=0;i<22;i++){
      const x=26+i*49, c=mix(i<11?A1:A3, i<11?A3:A2, (i%11)/10);
      const alpha = 0.35 + 0.65*Math.abs(Math.sin(i*0.45));
      if(i===4 || i===15){
        ctx.font='800 34px Inter, sans-serif'; ctx.fillStyle=`rgba(${c},${alpha})`;
        ctx.fillText(S.home, x-14, 82);
        i+=2; continue;
      }
      planeIcon(x, 70, 28, `rgba(${c},${alpha})`);
    }

    // карта
    if(LAND){
      ctx.save();
      ctx.beginPath(); ctx.rect(0, MAP.y-20, W, MAP.h+30); ctx.clip();
      ctx.fillStyle='rgba(90,70,200,0.18)'; ctx.fill(landPath(3,5));
      ctx.clip(landPath());
      g = ctx.createLinearGradient(MAP.x, MAP.y+MAP.h, MAP.x+MAP.w, MAP.y);
      g.addColorStop(0,'#f59ad8'); g.addColorStop(0.45,'#e9a6ee'); g.addColorStop(0.7,'#b9c2f2'); g.addColorStop(1,'#62e3c9');
      ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fillRect(0,0,W,760);
      ctx.strokeStyle = g; ctx.lineWidth = 2.6;
      ctx.beginPath();
      for(let y=MAP.y-10; y<MAP.y+MAP.h+10; y+=5.2){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
      ctx.stroke();
      ctx.restore();
    }

    // перелёты
    ctx.save();
    ctx.beginPath(); ctx.rect(0, MAP.y-40, W, MAP.h+60); ctx.clip();
    const ends = new Map();
    for(const f of S.list){
      const a=BY_IATA[f.from], b=BY_IATA[f.to];
      let lb = b.lon; if(lb-a.lon>180) lb-=360; else if(lb-a.lon<-180) lb+=360;
      for(const shift of [0, lb>180?-360:lb<-180?360:null]){
        if(shift===null) continue;
        const [x1,y1]=proj(a.lon+shift,a.lat), [x2,y2]=proj(lb+shift,b.lat);
        const dx=x2-x1, dy=y2-y1, d=Math.hypot(dx,dy) || 1;
        let nx=-dy/d, ny=dx/d; if(ny>0){ nx=-nx; ny=-ny; }
        const bend = Math.min(140, d*0.22);
        ctx.strokeStyle='rgba(55,25,150,0.85)'; ctx.lineWidth=3.2; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.quadraticCurveTo((x1+x2)/2+nx*bend,(y1+y2)/2+ny*bend,x2,y2); ctx.stroke();
      }
      ends.set(a.iata, proj(a.lon,a.lat)); ends.set(b.iata, proj(b.lon,b.lat));
    }
    for(const [x,y] of ends.values()){
      ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(x,y,7.5,0,7); ctx.fill();
      ctx.strokeStyle='#6d3cf0'; ctx.lineWidth=4; ctx.stroke();
    }
    ctx.restore();

    // флаги
    const flags = S.countries.slice(0, 12), extra = S.countries.length - flags.length;
    const R = 26, step = 40, n = flags.length + (extra>0?1:0);
    let fx = W/2 - ((n-1)*step)/2;
    for(const cc of flags){
      ctx.save();
      ctx.beginPath(); ctx.arc(fx, 705, R, 0, 7); ctx.fillStyle='#fff'; ctx.fill(); ctx.clip();
      ctx.font = '64px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(flagEmoji(cc), fx, 708);
      ctx.restore();
      ctx.beginPath(); ctx.arc(fx, 705, R, 0, 7); ctx.strokeStyle='#ffffff'; ctx.lineWidth=4; ctx.stroke();
      fx += step;
    }
    if(extra>0){
      ctx.beginPath(); ctx.arc(fx,705,R,0,7); ctx.fillStyle='#5b3fd6'; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font='700 20px Inter, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('+'+extra, fx, 706);
    }
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';

    ctx.save(); ctx.setLineDash([10,8]); ctx.strokeStyle='rgba(255,255,255,0.75)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,760); ctx.lineTo(W,760); ctx.stroke(); ctx.restore();

    const INK = '#2a1470', INK2 = '#3b2b8f', SOFT = 'rgba(42,20,112,0.72)';
    ctx.fillStyle = INK; ctx.font = '600 58px Inter, sans-serif';
    ctx.fillText('MY FLIGHT PASSPORT', 48, 850);
    roundRect(48, 872, 38, 22, 4); ctx.fillStyle=INK2; ctx.fill();
    ctx.fillStyle='#d9d3ff'; ctx.beginPath(); ctx.arc(67,883,6,0,7); ctx.fill();
    ctx.fillStyle = INK2; ctx.font = '600 24px Inter, sans-serif';
    ctx.fillText('PASSPORT • PASS • PASAPORTE', 100, 893);

    g = ctx.createLinearGradient(950,800,1032,882);
    g.addColorStop(0,'#ffd6f5'); g.addColorStop(0.5,'#c9b8ff'); g.addColorStop(1,'#a8f0e6');
    roundRect(950,800,82,82,20); ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=2; ctx.stroke();
    planeIcon(991, 841, 52, '#ffffff', -0.6);

    const N = S.list.length;
    ctx.fillStyle = INK; ctx.font = '800 150px Inter, sans-serif';
    ctx.fillText(String(N), 44, 1060);
    ctx.font = '300 86px Inter, sans-serif'; ctx.fillStyle = INK2;
    ctx.fillText(N===1 ? 'flight' : 'flights', 46, 1150);

    const today = todayStr();
    const rows = [
      ['Period', period==='all' ? 'All time' : period],
      ['Place of issue', S.home],
      ['Date of issue', fmtD(today)],
      ['First flight', S.since ? fmtD(S.since) : '—'],
    ];
    rows.forEach(([k,v],i)=>{
      const y = 960 + i*58;
      ctx.font = '400 30px Inter, sans-serif'; ctx.fillStyle = SOFT; ctx.fillText(k, 470, y);
      const kw = ctx.measureText(k+' ').width;
      ctx.fillStyle = INK; ctx.font = '600 30px Inter, sans-serif'; ctx.fillText(v, 470+kw, y);
    });

    const days = Math.floor(S.hours/24), hrs = Math.round(S.hours%24);
    const timeStr = days ? `${days}d ${hrs}h` : `${Math.round(S.hours)}h`;
    const stats = [
      ['Distance', Math.round(S.km).toLocaleString('de-DE'), 'km', 48],
      ['Flight Time', timeStr, '', 430],
      ['Airports', String(S.airports), '', 715],
      ['Airlines', String(S.airlines||'—'), '', 905],
    ];
    for(const [label,val,unit,x] of stats){
      ctx.fillStyle=SOFT; ctx.font='500 28px Inter, sans-serif'; ctx.fillText(label, x, 1232);
      ctx.fillStyle=INK; ctx.font='800 56px Inter, sans-serif'; ctx.fillText(val, x, 1296);
      if(unit){ const w=ctx.measureText(val+' ').width; ctx.font='300 52px Inter, sans-serif'; ctx.fillText(unit, x+w, 1296); }
    }

    g = ctx.createLinearGradient(40,0,W-40,0);
    g.addColorStop(0,'rgba(255,255,255,0.55)'); g.addColorStop(0.5,'rgba(220,210,255,0.55)'); g.addColorStop(1,'rgba(200,250,245,0.55)');
    roundRect(36,1328,W-72,96,10); ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=2; ctx.stroke();
    const pad = (s,n)=> (s + '<'.repeat(n)).slice(0,n);
    const per = period==='all' ? 'ALLTIME' : 'YEAR'+period;
    const L = 40;
    const l1 = pad(`P<FLT<${per}<<${N}FLIGHTS<<${S.since ? 'SINCE'+fmtD(S.since,true) : ''}`, L);
    const kmS = Math.round(S.km)+'KM';
    const l2 = pad(`ISSUED${fmtD(today,true)}${S.home}<<`, L - kmS.length) + kmS;
    ctx.fillStyle = '#20155c';
    let fs = 34; ctx.font = `500 ${fs}px "JetBrains Mono", monospace`;
    fs = Math.min(42, Math.floor(fs * (W-110) / ctx.measureText(l1).width));
    ctx.font = `500 ${fs}px "JetBrains Mono", monospace`;
    ctx.fillText(l1, 54, 1368); ctx.fillText(l2, 54, 1408);
  }

  function renderPeriods(){
    const years = [...new Set(flights.filter(f=>f.date && isDone(f)).map(f=>f.date.slice(0,4)))].sort().reverse();
    if(period!=='all' && !years.includes(period)) period='all';
    document.getElementById('passPeriods').innerHTML = [['all','Всё время'], ...years.map(y=>[y,y])]
      .map(([v,l])=>`<button type="button" data-p="${v}" class="${v===period?'on':''}">${l}</button>`).join('');
  }
  document.getElementById('passPeriods').addEventListener('click', e=>{
    const b = e.target.closest('[data-p]'); if(!b) return;
    period = b.dataset.p; renderPeriods(); draw();
  });

  async function open(){
    // по умолчанию — тот же период, что выбран на карте
    period = (typeof yearFilter!=='undefined' && /^\d{4}$/.test(yearFilter)) ? yearFilter : 'all';
    modal.hidden = false; document.body.classList.add('modal-open');
    document.getElementById('passLoading').hidden = false;
    document.getElementById('passSave').disabled = true;
    renderPeriods();
    await Promise.race([
      Promise.all([loadLand(), ...['800 50px Inter','600 50px Inter','300 50px Inter','500 30px "JetBrains Mono"'].map(f=>document.fonts.load(f).catch(()=>{}))]),
      new Promise(r=>setTimeout(r,4000))
    ]);
    draw();
    document.getElementById('passLoading').hidden = true;
    document.getElementById('passSave').disabled = false;
  }
  function close(){ modal.hidden = true; document.body.classList.remove('modal-open'); }

  document.getElementById('passClose').onclick = close;
  modal.addEventListener('click', e=>{ if(e.target===modal) close(); });
  addEventListener('keydown', e=>{ if(e.key==='Escape' && !modal.hidden) close(); });
  document.getElementById('passSave').onclick = async ()=>{
    const name = `flight-passport-${period}.png`;
    const blob = await new Promise(r=>cv.toBlob(r,'image/png'));
    const file = new File([blob], name, {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==='AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  };
  return { open };
})();
document.getElementById('shareBtn').onclick = ()=> Passport.open();
</script>
</body>
</html>
