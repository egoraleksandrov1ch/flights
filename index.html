<script>const ShareCards = {};</script>
<script>
(()=>{
  const W = 1080, H = 1440;
  const cv = document.getElementById('passCv'), ctx = cv.getContext('2d');
  let LAND = null, landLoading = null, period = 'all';

// палитра «бумага и чернила»
const PAPER = '#f7f2e8', PAPER2 = '#efe7d6', INK = '#16213e', INK2 = '#5b6478', ORANGE = '#ff6b35', ORANGE2 = '#ffb38a';
const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

const isDone = f => !f.date || f.date <= todayStr();
function fmtD(s){ const [y,m,d]=s.split('-'); return `${d} ${MON[+m-1]} ${y}`; }
function fmtN(n){ return Math.round(n).toLocaleString('en-US').replace(/,/g,' '); }
function flagEmoji(cc){ return cc && cc.length===2 ? String.fromCodePoint(...[...cc.toUpperCase()].map(c=>0x1F1E6+c.charCodeAt(0)-65)) : ''; }

function compute(){
  const all = flights.filter(f=>BY_IATA[f.from] && BY_IATA[f.to] && isDone(f));
  const list = (period==='all' ? all : all.filter(f=>(f.date||'').startsWith(period)))
    .sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
  let km = 0, longest = null; const ap = {}, routes = {}, airlines = new Set(), countries = [];
  for(const f of list){
    const a=BY_IATA[f.from], b=BY_IATA[f.to], d=dist(a,b);
    km += d; if(!longest || d>longest.d) longest = {f, d};
    ap[f.from]=(ap[f.from]||0)+1; ap[f.to]=(ap[f.to]||0)+1;
    const k=[f.from,f.to].sort().join('-'); routes[k]=(routes[k]||0)+1;
    const al=(f.airline||'').replace(/\s*\d+\s*$/,'').trim().toLowerCase(); if(al) airlines.add(al);
  }
  for(const f of [...list].reverse()){ const c=BY_IATA[f.to].country; if(c && !countries.includes(c)) countries.push(c); }
  const top = o => Object.entries(o).sort((a,b)=>b[1]-a[1])[0];
  const topAp = Object.entries(ap).sort((a,b)=>b[1]-a[1]);
  const home = topAp[0]?.[0] || '---';
  const tr = top(routes);
  let route = tr ? tr[0].split('-') : [home, '---'];
  if(route[1]===home) route=[route[1],route[0]];
  const dates = list.map(f=>f.date).filter(Boolean).sort();
  const hours = list.reduce((s,f)=>s + dist(BY_IATA[f.from],BY_IATA[f.to])/780 + 0.5, 0);
  return { list, km, hours, airports:Object.keys(ap).length, airlines:airlines.size, countries, home,
           route, routeCount: tr?.[1] || 0, top2: [topAp[0]||['---',0], topAp[1]||['---',0]], longest, first: dates[0], last: dates[dates.length-1] };
}

// ---------- проекция карты (равнопромежуточная, обрезанная) ----------
const MAP = { x:60, y:470, w:960, h:330 };
const LAT_T = 78, LAT_B = -56;
function proj(lon, lat){ return [MAP.x + (lon+180)/360*MAP.w, MAP.y + (LAT_T-lat)/(LAT_T-LAT_B)*MAP.h]; }
let landPathCache = null;
function landPath(){
  if(landPathCache) return landPathCache;
  const p = new Path2D();
  for(const poly of LAND) for(const ring of poly){
    let prev=null; const pts=[];
    for(const [l0,lat] of ring){ let l=l0; if(prev!==null){ while(l-prev>180) l-=360; while(l-prev<-180) l+=360; } pts.push([l,lat]); prev=l; }
    const minL=Math.min(...pts.map(q=>q[0])), maxL=Math.max(...pts.map(q=>q[0]));
    const shifts=[0]; if(maxL>180) shifts.push(-360); if(minL<-180) shifts.push(360);
    for(const sh of shifts){ pts.forEach(([l,lat],i)=>{ const [x,y]=proj(l+sh,lat); i?p.lineTo(x,y):p.moveTo(x,y); }); p.closePath(); }
  }
  return landPathCache = p;
}

// ---------- примитивы ----------
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); }
function plane(x,y,s,color,rot=0){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s/24,s/24); ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(12,0); ctx.lineTo(9,-2); ctx.lineTo(1,-2); ctx.lineTo(-4,-10); ctx.lineTo(-7,-10); ctx.lineTo(-4,-2); ctx.lineTo(-9,-2);
  ctx.lineTo(-11,-5); ctx.lineTo(-13,-5); ctx.lineTo(-12,0); ctx.lineTo(-13,5); ctx.lineTo(-11,5); ctx.lineTo(-9,2); ctx.lineTo(-4,2);
  ctx.lineTo(-7,10); ctx.lineTo(-4,10); ctx.lineTo(1,2); ctx.lineTo(9,2); ctx.closePath(); ctx.fill(); ctx.restore();
}
function label(t,x,y,align='left'){ ctx.textAlign=align; ctx.fillStyle=INK2; ctx.font='600 22px Inter, sans-serif'; ctx.fillText(t.toUpperCase().split('').join(' '),x,y); ctx.textAlign='left'; }
function drawBody(kind, x, y, r){
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.clip();
  if(kind==='earth'){
    let g=ctx.createRadialGradient(x-r*0.35,y-r*0.35,r*0.1,x,y,r); g.addColorStop(0,'#5fb3ff'); g.addColorStop(1,'#1d5fbf');
    ctx.fillStyle=g; ctx.fillRect(x-r,y-r,2*r,2*r);
    ctx.fillStyle='#3fa34d';
    const blob=(pts)=>{ ctx.beginPath(); pts.forEach(([a,b],i)=>{ const px=x+a*r, py=y+b*r; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }); ctx.closePath(); ctx.fill(); };
    blob([[-0.7,-0.5],[-0.3,-0.75],[0.05,-0.55],[-0.05,-0.2],[-0.35,-0.05],[-0.45,0.35],[-0.7,0.1]]);
    blob([[0.2,-0.1],[0.6,-0.35],[0.85,0.0],[0.7,0.45],[0.35,0.6],[0.25,0.25]]);
    blob([[-0.25,0.55],[0.05,0.5],[0.1,0.85],[-0.2,0.9]]);
    ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.ellipse(x-r*0.1,y-r*0.92,r*0.55,r*0.14,0,0,7); ctx.fill();
  } else if(kind==='moon'){
    let g=ctx.createRadialGradient(x-r*0.35,y-r*0.35,r*0.1,x,y,r); g.addColorStop(0,'#eceef2'); g.addColorStop(1,'#9aa1ad');
    ctx.fillStyle=g; ctx.fillRect(x-r,y-r,2*r,2*r);
    ctx.fillStyle='rgba(90,98,112,0.35)';
    for(const [a,b,c] of [[-0.35,-0.3,0.22],[0.3,-0.45,0.13],[0.35,0.2,0.26],[-0.3,0.45,0.15],[0.05,0.0,0.09],[-0.65,0.1,0.1]]){ ctx.beginPath(); ctx.arc(x+a*r,y+b*r,c*r,0,7); ctx.fill(); }
  } else if(kind==='venus'){
    let g=ctx.createRadialGradient(x-r*0.35,y-r*0.35,r*0.1,x,y,r); g.addColorStop(0,'#fbe7b0'); g.addColorStop(1,'#c99a4b');
    ctx.fillStyle=g; ctx.fillRect(x-r,y-r,2*r,2*r);
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=r*0.12;
    for(const b of [-0.45,-0.1,0.25,0.55]){ ctx.beginPath(); ctx.ellipse(x,y+b*r,r*1.1,r*0.18,-0.15,0,Math.PI); ctx.stroke(); }
  } else if(kind==='jupiter'){
    let g=ctx.createRadialGradient(x-r*0.35,y-r*0.35,r*0.1,x,y,r); g.addColorStop(0,'#f3dcb8'); g.addColorStop(1,'#b98a5c');
    ctx.fillStyle=g; ctx.fillRect(x-r,y-r,2*r,2*r);
    for(const [b,h,c] of [[-0.55,0.14,'rgba(150,95,55,0.55)'],[-0.2,0.16,'rgba(170,110,65,0.6)'],[0.15,0.12,'rgba(150,95,55,0.5)'],[0.5,0.15,'rgba(170,110,65,0.55)']]){ ctx.fillStyle=c; ctx.fillRect(x-r, y+b*r, 2*r, h*r); }
    ctx.fillStyle='rgba(190,80,50,0.8)'; ctx.beginPath(); ctx.ellipse(x+r*0.3,y+r*0.32,r*0.2,r*0.11,0,0,7); ctx.fill();
  } else {
    let g=ctx.createRadialGradient(x-r*0.35,y-r*0.35,r*0.1,x,y,r); g.addColorStop(0,'#f2884f'); g.addColorStop(1,'#a8401c');
    ctx.fillStyle=g; ctx.fillRect(x-r,y-r,2*r,2*r);
    ctx.fillStyle='rgba(110,35,12,0.35)';
    for(const [a,b,c,d] of [[-0.2,-0.2,0.45,0.16],[0.3,0.3,0.35,0.12],[-0.4,0.45,0.25,0.1]]){ ctx.beginPath(); ctx.ellipse(x+a*r,y+b*r,c*r,d*r,-0.3,0,7); ctx.fill(); }
    ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.ellipse(x,y-r*0.93,r*0.4,r*0.12,0,0,7); ctx.fill();
  }
  // тень с ночной стороны
  const sh=ctx.createRadialGradient(x-r*0.5,y-r*0.5,r*0.6,x-r*0.2,y-r*0.2,r*1.5); sh.addColorStop(0,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(0,0,0,0.35)');
  ctx.fillStyle=sh; ctx.fillRect(x-r,y-r,2*r,2*r);
  ctx.restore();
}
function value(t,x,y,size=46,align='left',color=INK){ ctx.textAlign=align; ctx.fillStyle=color; ctx.font=`800 ${size}px Inter, sans-serif`; ctx.fillText(t,x,y); ctx.textAlign='left'; }
function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ return ()=>{ seed^=seed<<13; seed^=seed>>>17; seed^=seed<<5; return (seed>>>0)/4294967296; }; }

const STUB_Y = 1150;   // линия отрыва

function draw(){
  const S = compute();
  ctx.clearRect(0,0,W,H);
  ctx.save();
  rr(0,0,W,H,40); ctx.clip();

  // бумага
  let g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,PAPER); g.addColorStop(1,PAPER2);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // лёгкая «волокнистая» фактура
  const R = rng(7);
  for(let i=0;i<1400;i++){ ctx.fillStyle=`rgba(120,100,70,${R()*0.05})`; ctx.fillRect(R()*W, R()*H, 1+R()*2, 1); }

  // шапка
  ctx.fillStyle=INK; ctx.fillRect(0,0,W,150);
  ctx.fillStyle=ORANGE; ctx.fillRect(0,150,W,8);

  ctx.save(); ctx.setLineDash([3,10]); ctx.lineCap='round'; ctx.strokeStyle=INK2; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(445,300); ctx.quadraticCurveTo(540,220,635,300); ctx.stroke(); ctx.restore();
  plane(540, 256, 46, ORANGE, 0);
  ctx.textAlign='center'; ctx.fillStyle=ORANGE; ctx.font='700 22px Inter, sans-serif';

  // разделитель
  ctx.strokeStyle='rgba(22,33,62,0.15)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(60,430); ctx.lineTo(W-60,430); ctx.stroke();

      ctx.globalAlpha=1;

  ctx.restore();

  // поля талона

  const cols = [60, 400, 740];

  ];

  if(extra>0){ ctx.beginPath(); ctx.arc(fx,1248,24,0,7); ctx.fillStyle=INK; ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='700 18px Inter, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('+'+extra,fx,1249); }
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  if(!flags.length){ ctx.fillStyle=INK2; ctx.font='500 26px Inter, sans-serif'; ctx.fillText('—', 60, 1258); }

  function loadLand(){
    if(LAND) return Promise.resolve();
    if(landLoading) return landLoading;
    landLoading = new Promise((res)=>{
      const s=document.createElement('script'); s.src='lib/topojson-client.min.js';
      s.onload = async ()=>{
        try{
          const topo = await fetch('lib/land-50m.json').then(r=>r.json());
          const geo = topojson.feature(topo, topo.objects.land);
          LAND = geo.features.flatMap(f => f.geometry.type==='Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates);
        }catch(e){}
        res();
      };
      s.onerror = ()=>res();
      document.head.appendChild(s);
    });
    return landLoading;
  }

  ShareCards.fly = {
    title: 'Посадочный <span>талон</span>', hint: 'Только совершённые перелёты. Время в воздухе — оценка по расстоянию.',
    w: W, h: H,
    periods(){
      const years = [...new Set(flights.filter(f=>f.date && isDone(f)).map(f=>f.date.slice(0,4)))].sort().reverse();
      return [['all','Всё время'], ...years.map(y=>[y,y])];
    },
    prepare(){ return Promise.all([loadLand(), ...['800 50px Inter','700 50px Inter','600 30px Inter','500 30px Inter','500 30px "JetBrains Mono"'].map(f=>document.fonts.load(f).catch(()=>{}))]); },
    draw(p){ period = p; draw(); },
    name(p){ return `boarding-pass-${p}.png`; },
  };
})();

<script>
// =====================================================================
//  Карточка «Карта стран» — Equal Earth, страны из перелётов/поездок/путешествий
// =====================================================================
(()=>{
const W = 1080, H = 1350;
const cv = document.getElementById('passCv'), ctx = cv.getContext('2d');
let LANDPOLYS = [], period = 'all', theme = 'light';
const THEMES = {
  light: { bg:'#f4f2ec', land:'#d9d5cc', border:'#f4f2ec', fill:'#22c55e', terr:'#86efac', text:'#1d2433', muted:'#7b8190', rule:'#d9d5cc' },
  dark:  { bg:'#0f1424', land:'#2a3149', border:'#0f1424', fill:'#34d399', terr:'#1f7a5a', text:'#eef1f8', muted:'#8a93a8', rule:'#2a3149' },
  sand:  { bg:'#efe6d4', land:'#d8c9aa', border:'#efe6d4', fill:'#c2410c', terr:'#f59e6b', text:'#3b2a17', muted:'#8a7558', rule:'#d8c9aa' },
};
const THEME_NAMES = { light:'Светлая', dark:'Тёмная', sand:'Песок' };
const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function fmtD(s){ const [y,m,d]=s.split('-'); return `${+d} ${MON[+m-1]} ${y}`; }

function selection(){
  const today = todayStr();
  let arcs = doneArcs(), T = trips.filter(doneTrip), title = 'All time', sub = '', vm, isJ=false;
  if(period.startsWith('j:')){
    const j = journeys.find(x=>String(x.id)===period.slice(2));
    if(j){ isJ=true; arcs = journeyArcs(j).filter(a=>!a.up); T = journeyTrips(j); vm = journeyMap(j);
      title = j.title || j.countries.map(countryName).slice(0,2).join(', '); sub = `${fmtD(j.start)} — ${fmtD(j.end)}`; }
  } else if(period!=='all'){
    arcs = arcs.filter(a=>(a.f.date||'').startsWith(period)); T = T.filter(t=>(t.date||'').startsWith(period));
    vm = collect(arcs, journeys.filter(j=>j.start<=today && j.start.startsWith(period)), [], T); title = period;
  }
  vm ??= visitedMap();
  const km = arcs.reduce((s,a)=>s+a.km,0) + T.reduce((s,t)=>s+(+t.km||dist(t.from,t.to)),0);
  const groups = new Set(T.map(t=>t.group ?? t.id)).size;
  return { vm, arcs, T, groups, title, sub, km, isJ };
}

// ---------- Equal Earth ----------
const A1=1.340264, A2=-0.081106, A3=0.000893, A4=0.003796, M=Math.sqrt(3)/2;
function ee(lon, lat){
  const l=lon*RAD, t=Math.asin(M*Math.sin(Math.max(-90,Math.min(90,lat))*RAD)), t2=t*t, t6=t2*t2*t2;
  return [ 2*Math.sqrt(3)*l*Math.cos(t) / (3*(A1+3*A2*t2+t6*(7*A3+9*A4*t2))), t*(A1+A2*t2+t6*(A3+A4*t2)) ];
}
const MAP = { x:20, y:250, w:1040, h:500 };
const EX = ee(180,0)[0], YT = ee(0,84)[1], YB = ee(0,-58)[1], K = MAP.w/(2*EX);
let V = null;
function worldView(){ const h=(YT-YB)*K; return { k:K, ox:MAP.x+MAP.w/2, oy:MAP.y+(MAP.h-h)/2+YT*K, world:true }; }
function zoomView(boxes){
  let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
  for(const pts of boxes) for(const [lon,lat] of pts){ const [x,y]=ee(Math.max(-180,Math.min(180,lon)),lat); a=Math.min(a,x); c=Math.max(c,x); b=Math.min(b,y); d=Math.max(d,y); }
  const minSpan=0.18, cx=(a+c)/2, cy=(b+d)/2, bw=Math.max(c-a,minSpan)*1.5, bh=Math.max(d-b,minSpan)*1.5, k=Math.min(MAP.w/bw, MAP.h/bh);
  return { k, ox: MAP.x+MAP.w/2 - cx*k, oy: MAP.y+MAP.h/2 + cy*k, world:false };
}
function proj(lon, lat){ const [x,y]=ee(lon,lat); return [V.ox + x*V.k, V.oy - y*V.k]; }
function outline(){
  const p = new Path2D();
  for(let lat=-90; lat<=90; lat+=2){ const [x,y]=proj(-180,lat); lat===-90?p.moveTo(x,y):p.lineTo(x,y); }
  for(let lat=90; lat>=-90; lat-=2){ const [x,y]=proj(180,lat); p.lineTo(x,y); }
  p.closePath(); return p;
}
function addRings(p, rings){
  for(const ring of rings){
    let mn=Infinity, mx=-Infinity; for(const q of ring){ if(q[0]<mn) mn=q[0]; if(q[0]>mx) mx=q[0]; }
    const shifts=[0]; if(mx>180) shifts.push(-360); if(mn<-180) shifts.push(360);
    for(const sh of shifts){ ring.forEach(([lon,lat],i)=>{ const [x,y]=proj(lon+sh,lat); i?p.lineTo(x,y):p.moveTo(x,y); }); p.closePath(); }
  }
}
/** какие части закрасить — как на глобусе: основная + где были; острова-регионы целиком */
function visitedParts(vm, only){
  const out=[];
  for(const [cc,v] of Object.entries(vm)){
    if(only && !only(cc)) continue;
    const ps=PARTS[cc]; if(!ps) continue;
    const idx=new Set(isRegion(cc) ? ps.map((_,i)=>i) : [0]);
    if(!isRegion(cc)) for(const [lon,lat] of v.pts){ const i=partIndex(cc,lon,lat); if(i>=0) idx.add(i); }
    for(const i of idx) out.push(ps[i]);
  }
  return out;
}

function draw(){
  const T_ = THEMES[theme], S = selection();
  const codes = Object.keys(S.vm), nC = codes.filter(isCountry).length, nT = codes.length - nC;
  ctx.clearRect(0,0,W,H); ctx.save();
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(0,0,W,H,40) : ctx.rect(0,0,W,H); ctx.clip();
  ctx.fillStyle=T_.bg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=T_.muted; ctx.font='600 24px Inter, sans-serif'; ctx.textAlign='left'; ctx.fillText('DIARY  COUNTRY', 60, 96);
  ctx.fillStyle=T_.text; let fs=72; ctx.font=`800 ${fs}px Inter, sans-serif`;
  while(ctx.measureText(S.title).width > 700 && fs>40){ fs-=4; ctx.font=`800 ${fs}px Inter, sans-serif`; }
  ctx.fillText(S.title, 56, 172);
  if(S.sub){ ctx.fillStyle=T_.muted; ctx.font='500 28px Inter, sans-serif'; ctx.fillText(S.sub, 60, 214); }
  ctx.textAlign='right'; ctx.fillStyle=T_.fill; ctx.font='800 72px Inter, sans-serif'; ctx.fillText(String(nC), W-60, 172);
  ctx.fillStyle=T_.muted; ctx.font='600 24px Inter, sans-serif'; ctx.fillText(nC===1 ? 'COUNTRY' : 'COUNTRIES', W-60, 96);
  if(nT){ ctx.font='500 24px Inter, sans-serif'; ctx.fillText(`+ ${nT} ${nT===1?'territory':'territories'}`, W-60, 212); }
  ctx.textAlign='left';

  const vparts = visitedParts(S.vm), cparts = visitedParts(S.vm, isCountry), tparts = visitedParts(S.vm, cc=>!isCountry(cc));
  const zoom = vparts.length && (S.isJ || codes.length <= 3);
  const routes = S.isJ ? S.arcs.map(a=>greatCircle(a.a, a.b)) : [];
  V = zoom ? zoomView([...vparts.filter(p=>Math.abs(p.bbox[2]-p.bbox[0])<200).map(p=>[[p.bbox[0],p.bbox[1]],[p.bbox[2],p.bbox[3]]]), ...routes]) : worldView();
  ctx.save();
  if(V.world) ctx.clip(outline());
  else { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(MAP.x+20,MAP.y,MAP.w-40,MAP.h,24) : ctx.rect(MAP.x+20,MAP.y,MAP.w-40,MAP.h); ctx.clip(); }
  const land = new Path2D(); for(const rings of LANDPOLYS) addRings(land, rings);
  ctx.fillStyle=T_.land; ctx.fill(land);
  const vis = new Path2D(); for(const p of cparts) addRings(vis, p.rings); ctx.fillStyle=T_.fill; ctx.fill(vis);
  const ter = new Path2D(); for(const p of tparts) addRings(ter, p.rings); ctx.fillStyle=T_.terr; ctx.fill(ter);
  ctx.strokeStyle=T_.border; ctx.lineWidth=V.world ? 1.1 : 2; ctx.stroke(land);
  // перелёты путешествия (наземных линий нет — как в приложении)
  const stops = new Map();
  for(const line of routes){
    const px = line.map(([lo,la])=>proj(lo,la));
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=9; ctx.setLineDash([]);
    ctx.beginPath(); px.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke();
    ctx.strokeStyle='#2563eb'; ctx.lineWidth=5; ctx.setLineDash([14,10]);
    ctx.beginPath(); px.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke(); ctx.setLineDash([]);
    for(const q of [px[0], px[px.length-1]]) stops.set(q[0].toFixed(0)+','+q[1].toFixed(0), q);
  }
  for(const [x,y] of stops.values()){ ctx.beginPath(); ctx.arc(x,y,7,0,7); ctx.fillStyle='#fff'; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=T_.text; ctx.stroke(); }
  ctx.restore();

  // флаги — от последнего визита к первому
  const order = [...codes].sort((a,b)=>(S.vm[b].last||'').localeCompare(S.vm[a].last||'') || (isCountry(b)-isCountry(a)));
  const perRow = 15, R = 26, gap = 62, maxFlags = perRow*2;
  const shown = order.slice(0, order.length > maxFlags ? maxFlags-1 : maxFlags), extra = order.length - shown.length;
  const items = [...shown.map(cc=>({cc})), ...(extra>0 ? [{more:extra}] : [])];
  const fy0 = MAP.y + MAP.h + 75;
  items.forEach((it,i)=>{
    const r = Math.floor(i/perRow), inRow = Math.min(perRow, items.length - r*perRow);
    const x = W/2 - (inRow-1)*gap/2 + (i%perRow)*gap, y = fy0 + r*72;
    ctx.save(); ctx.beginPath(); ctx.arc(x,y,R,0,7); ctx.fillStyle = it.more ? T_.fill : '#fff'; ctx.fill(); ctx.clip();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(it.more){ ctx.fillStyle = theme==='light' ? '#06210f' : '#fff'; ctx.font='700 20px Inter, sans-serif'; ctx.fillText('+'+it.more, x, y+1); }
    else if(isRegion(it.cc)) drawRegionFlag(ctx, it.cc, x-R, y-R*0.72, R*2, R*1.44);
    else { ctx.font='60px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; ctx.fillText(flagEmoji(it.cc), x, y+3); }
    ctx.restore();
    ctx.beginPath(); ctx.arc(x,y,R,0,7); ctx.strokeStyle=T_.bg; ctx.lineWidth=4; ctx.stroke();
  });
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';

  const pct = Math.round(nC/195*100);
  const stats = [
    [String(nC), nC===1?'country':'countries'], [pct+'%', 'of the world'],
    [String(S.arcs.length), S.arcs.length===1?'flight':'flights'], [String(S.groups), S.groups===1?'road trip':'road trips'],
    [Math.round(S.km).toLocaleString('en-US').replace(/,/g,' '), 'km travelled'],
  ];
  const y0 = 1135, colW = (W-120)/stats.length;
  ctx.strokeStyle=T_.rule; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(60, y0-70); ctx.lineTo(W-60, y0-70); ctx.stroke();
  stats.forEach(([v,l],i)=>{
    const cx = 60 + colW*i + colW/2; ctx.textAlign='center';
    ctx.fillStyle=T_.text; ctx.font=`800 ${v.length>6?40:52}px Inter, sans-serif`; ctx.fillText(v, cx, y0);
    ctx.fillStyle=T_.muted; ctx.font='500 22px Inter, sans-serif'; ctx.fillText(l, cx, y0+38);
    if(i){ ctx.strokeStyle=T_.rule; ctx.beginPath(); ctx.moveTo(60+colW*i, y0-44); ctx.lineTo(60+colW*i, y0+40); ctx.stroke(); }
  });
  ctx.textAlign='left'; ctx.fillStyle=T_.muted; ctx.font='500 20px Inter, sans-serif'; ctx.fillText('Diary Travel', 60, H-60);
  ctx.textAlign='right'; ctx.fillText(fmtD(todayStr()).toUpperCase(), W-60, H-60);
  ctx.restore();
}

const ShareModal = (()=>{
  const src = document.getElementById('passCv');
  function compose(out, card, format){
    const g = out.getContext('2d');
    if(format!=='story'){ out.width=card.w; out.height=card.h; g.clearRect(0,0,out.width,out.height); g.drawImage(src,0,0); return; }
    const SW=1080, SH=1920; out.width=SW; out.height=SH;
    const grd = g.createLinearGradient(0,0,SW*0.4,SH); grd.addColorStop(0,'#141a30'); grd.addColorStop(0.55,'#0a0e1c'); grd.addColorStop(1,'#1f160c');
    g.fillStyle=grd; g.fillRect(0,0,SW,SH);
    // мягкие пятна света
    for(const [x,y,r,c] of [[SW*0.85,SH*0.12,520,'rgba(255,179,71,0.18)'],[SW*0.1,SH*0.9,560,'rgba(90,209,255,0.14)']]){
      const rg=g.createRadialGradient(x,y,0,x,y,r); rg.addColorStop(0,c); rg.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=rg; g.fillRect(0,0,SW,SH); }
    g.fillStyle='rgba(255,255,255,0.55)'; g.font='600 30px Inter, sans-serif'; g.textAlign='center'; g.fillText('D I A R Y   T R A V E L', SW/2, 190);
    const maxW=SW-120, maxH=SH-460, k=Math.min(maxW/card.w, maxH/card.h), w=card.w*k, h=card.h*k, x=(SW-w)/2, y=(SH-h)/2+40;
    g.save(); g.shadowColor='rgba(0,0,0,0.55)'; g.shadowBlur=60; g.shadowOffsetY=24; g.drawImage(src, x, y, w, h); g.restore();
    g.fillStyle='rgba(255,255,255,0.4)'; g.font='500 26px Inter, sans-serif'; g.fillText(todayStr().split('-').reverse().join('.'), SW/2, SH-150);
    g.textAlign='left';
  }
  async function open(key){
    const card = ShareCards[key];
    const ps = card.periods().map(x=>x[0]);
    let period = (key==='fly' && ps.includes(year)) ? year : 'all';
    if(key==='country' && selJourney!=null && ps.includes('j:'+selJourney)) period = 'j:'+selJourney;
    let format = 'ticket', busy = true;
    const m = openModal({title: card.title.replace(/<[^>]+>/g,''), left:null, right:'Готово', cls:'tall'});
    m.body.innerHTML = `<div class="seg" id="shFmt"><button data-f="ticket">${card.ticketLabel||'Билет'}</button><button data-f="story">Сторис</button></div>
      <div class="pchips" id="shP"></div>${card.options?'<div class="pchips" id="shO"></div>':''}
      <div class="pcard"><canvas id="shOut"></canvas><div class="ploading" id="shL">Готовлю картинку…</div></div>
      <div style="display:flex;gap:10px"><button class="btn acc" id="shSave" style="flex:1">⬇︎ Сохранить</button><button class="btn" id="shShare" style="flex:1">⬆︎ Поделиться</button></div>
      <div class="gfoot" id="shHint" style="text-align:center;margin-top:10px"></div>`;
    const q=x=>m.body.querySelector(x), out=q('#shOut');
    function chips(){
      q('#shFmt').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.f===format));
      q('#shP').innerHTML = card.periods().map(([v,l])=>`<button data-p="${esc(v)}" class="${v===period?'on':''}">${esc(l)}</button>`).join('');
      if(card.options) q('#shO').innerHTML = card.options.items.map(([v,l])=>`<button data-o="${v}" class="${v===card.options.get()?'on':''}">${l}</button>`).join('');
      q('#shHint').textContent = format==='story' ? 'Для сторис: «Поделиться» → Instagram → Истории. На компьютере — сохраните картинку.' : card.hint;
    }
    function render(){ src.width=card.w; src.height=card.h; card.draw(period); compose(out, card, format); }
    m.body.onclick = e=>{
      const f=e.target.closest('[data-f]'), p=e.target.closest('[data-p]'), o=e.target.closest('[data-o]');
      if(busy) return;
      if(f){ format=f.dataset.f; } else if(p){ period=p.dataset.p; } else if(o){ card.options.set(o.dataset.o); } else return;
      chips(); render();
    };
    const blob = ()=>new Promise(r=>out.toBlob(r,'image/png'));
    const fname = ()=>card.name(period).replace('.png', format==='story' ? '-story.png' : '.png');
    function download(b){ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=fname(); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
    q('#shSave').onclick = async ()=>download(await blob());
    q('#shShare').onclick = async ()=>{
      const b = await blob(), file = new File([b], fname(), {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file]}); }catch(e){} }
      else { download(b); toast('Картинка сохранена — поделитесь ею из загрузок'); }
    };
    chips();
    await Promise.race([card.prepare(), new Promise(r=>setTimeout(r,6000))]);
    render(); busy=false; q('#shL').hidden = true;
  }
  return { open };
})();

/** города из перелётов (город аэропорта) и наземных поездок; близкие точки (≤40 км) — один город */
function citiesFrom(arcs, ts){
  const pts = [];
  for(const a of arcs) for(const p of [a.a,a.b]) pts.push({name:(p.city||p.iata).split('/')[0].trim(), cc:p.country, lat:p.lat, lon:p.lon, date:a.f.date||'', air:true});
  for(const t of ts) for(const p of [t.from,t.to]) if(p && p.lat!=null) pts.push({name:p.name, cc:(p.cc||'').toUpperCase(), lat:+p.lat, lon:+p.lon, date:t.date||'', air:false});
  const cl = [], norm = s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zа-я0-9]/g,'');
  // сначала наземные (точный центр города), потом аэропорты
  for(const p of [...pts.filter(x=>!x.air), ...pts.filter(x=>x.air)]){
    let c = cl.find(c=>c.cc===p.cc && (norm(c.names[0][0])===norm(p.name) || dist(c,p) < 40));
    if(!c){ c = {cc:p.cc, lat:p.lat, lon:p.lon, names:[], dates:new Set(), air:0, ground:0}; cl.push(c); }
    const nm = c.names.find(x=>x[0]===p.name); nm ? nm[1]++ : c.names.push([p.name,1]);
    if(p.date) c.dates.add(p.date); p.air ? c.air++ : c.ground++;
  }
  return cl.map(c=>{ const name = [...c.names].sort((a,b)=>b[1]-a[1])[0][0];
    return { key:c.cc+':'+name, name, cc:c.cc, lat:c.lat, lon:c.lon, visits:Math.max(1,c.dates.size), air:c.air, ground:c.ground,
      last:[...c.dates].sort().pop()||'' }; })
    .sort((a,b)=>b.visits-a.visits || a.name.localeCompare(b.name));
}
function currentCities(){
  const j = journeys.find(x=>x.id===selJourney);
  if(j) return citiesFrom(journeyArcs(j).filter(a=>!a.up), journeyTrips(j));
  return citiesFrom(doneArcs(), trips.filter(doneTrip));
}
function cityRow(c){
  const sub = [c.visits>1 ? `${c.visits} ${plural(c.visits,'визит','визита','визитов')}` : null, c.air?'✈':null, c.ground?'🚌':null, c.last?dateShort(c.last):null].filter(Boolean).join(' · ');
  return `<div class="row city-row" data-city="${esc(c.key)}" style="align-items:center"><div class="lead">${flagHTML(c.cc,22)}</div>
    <div class="main"><div class="title" style="font-size:16px;margin:0 0 3px">${esc(c.name)}</div><div class="sub">${esc(sub)}</div></div></div>`;
}

const CONTINENTS = {
  'Европа':'AD AL AT BA BE BG BY CH CY CZ DE DK EE ES FI FO FR GB GG GI GR HR HU IE IM IS IT JE LI LT LU LV MC MD ME MK MT NL NO PL PT RO RS RU SE SI SK SM UA VA XK AX SJ',
  'Азия':'AE AF AM AZ BD BH BN BT CN GE HK ID IL IN IQ IR JO JP KG KH KP KR KW KZ LA LB LK MM MN MO MV MY NP OM PH PK PS QA SA SG SY TH TJ TL TM TR TW UZ VN YE',
  'Африка':'AO BF BI BJ BW CD CF CG CI CM CV DJ DZ EG EH ER ET GA GH GM GN GQ GW KE KM LR LS LY MA MG ML MR MU MW MZ NA NE NG RE RW SC SD SL SN SO SS ST SZ TD TG TN TZ UG YT ZA ZM ZW SH',
  'Северная Америка':'AG AI AW BB BL BM BQ BS BZ CA CR CU CW DM DO GD GL GP GT HN HT JM KN KY LC MF MQ MS MX NI PA PM PR SV SX TC TT US VC VG VI',
  'Южная Америка':'AR BO BR CL CO EC FK GF GY PE PY SR UY VE',
  'Океания':'AS AU CK FJ FM GU KI MH MP NC NF NR NU NZ PF PG PN PW SB TK TO TV VU WF WS',
};
const CONT_OF = {}; for(const [k,v] of Object.entries(CONTINENTS)) for(const cc of v.split(' ')) CONT_OF[cc]=k;

function countryStatsData(period){
  const today = todayStr(), all = period==='all', inP = d => all || (d||'').startsWith(period);
  const arcs = doneArcs().filter(a=>inP(a.f.date)), ts = trips.filter(t=>doneTrip(t) && inP(t.date)), js = journeys.filter(j=>j.start<=today && (all || j.start.startsWith(period) || j.end.startsWith(period)));
  const vm = all ? visitedMap() : collect(arcs, js, [], ts);
  const codes = Object.keys(vm), countries = codes.filter(isCountry), terr = codes.filter(c=>!isCountry(c));
  // когда страна появилась впервые (по всем данным)
  const first = {}, seen = (cc, d)=>{ if(cc && d && (!first[cc] || d<first[cc])) first[cc]=d; };
  for(const a of doneArcs()) for(const p of [a.a,a.b]) seen(p.country, a.f.date);
  for(const t of trips.filter(doneTrip)) for(const p of [t.from,t.to]) seen((p.cc||'').toUpperCase(), t.date);
  for(const j of journeys.filter(j=>j.start<=today)) for(const cc of j.countries) seen(cc, j.start);
  const newBy = {}; for(const [cc,d] of Object.entries(first)) if(isCountry(cc)) (newBy[d.slice(0,4)] ??= []).push(cc);
  const conts = Object.keys(CONTINENTS).map(k=>{ const total=[...SOVEREIGN].filter(c=>CONT_OF[c]===k).length, got=countries.filter(c=>CONT_OF[c]===k);
    return {label:k, n:got.length, total, codes:got}; });
  const top = countries.map(cc=>({cc, n:vm[cc].flights+vm[cc].trips+vm[cc].journeys, v:vm[cc]})).sort((a,b)=>b.n-a.n || countryName(a.cc).localeCompare(countryName(b.cc),'ru'));
  const days = j => Math.round((new Date(j.end+'T12:00') - new Date(j.start+'T12:00'))/864e5) + 1;
  const groups = {}; for(const t of ts){ (groups[t.group ?? t.id] ??= []).push(t); }
  const gl = Object.values(groups), gkm = g=>g.reduce((s,t)=>s+(+t.km||dist(t.from,t.to)),0);
  const byMode = {}; for(const t of ts) byMode[t.mode]=(byMode[t.mode]||0)+(+t.km||dist(t.from,t.to));
  const jYears = {}; for(const j of journeys.filter(j=>j.start<=today)) jYears[j.start.slice(0,4)]=(jYears[j.start.slice(0,4)]||0)+1;
  return { vm, countries, terr, cities:citiesFrom(arcs, ts), conts, top, first, newBy, period,
    js, jDays: js.reduce((s,j)=>s+days(j),0), longest: js.reduce((b,j)=>!b||days(j)>days(b)?j:b, null), days,
    gl, gkm, groundKm: gl.reduce((s,g)=>s+gkm(g),0), byMode, jYears:Object.keys(jYears).sort().map(k=>({label:k,n:jYears[k]})) };
}

function countryStatsHTML(D){
  const nC = D.countries.length;
  if(!nC && !D.terr.length && !D.cities.length) return `<div class="empty"><div class="ico">🌍</div>За этот период стран нет</div>`;
  let h = '';
  h += card('Обзор','✨', `<div class="big">${bigv(nC, plural(nC,'страна','страны','стран'))}${bigv(Math.round(nC/195*100)+'%','мира')}
    ${bigv(D.cities.length, plural(D.cities.length,'город','города','городов'))}${bigv(D.terr.length,'территорий и островов')}
    ${bigv(D.js.length, plural(D.js.length,'путешествие','путешествия','путешествий'))}${bigv(D.jDays, plural(D.jDays,'день','дня','дней')+' в путешествиях')}
    ${bigv(D.gl.length,'наземных поездок')}${bigv(kmShort(D.groundKm),'км по земле')}</div>
    <div class="gfoot" style="margin-top:12px">Мир: ${nC} из 195</div><div class="prog lap"><i style="width:${nC/195*100}%;--c:var(--green)"></i></div>`);
  h += card('Части света','🧭', D.conts.map(c=>hbar(c.label, c.n, c.total, {sub:`из ${c.total}`, color:'var(--green)'})).join('')
    + `<div class="gfoot" style="margin-top:6px">Посещено частей света: ${D.conts.filter(c=>c.n).length} из 6</div>`);
  if(D.top.length) h += card('Где бывали чаще всего','📍', D.top.slice(0,8).map(t=>{ const v=t.v;
      return hbar(countryName(t.cc), t.n, D.top[0].n, {lead:flagHTML(t.cc,18), color:'var(--green)', sub:[v.flights?`✈ ${v.flights}`:null, v.trips?`🚌 ${v.trips}`:null, v.journeys?`🧳 ${v.journeys}`:null].filter(Boolean).join(' ')}); }).join('')
    + `<div class="gfoot">Считаются перелёты в страну и из неё, наземные участки и путешествия.</div>`);
  if(D.period==='all'){
    const ny = Object.keys(D.newBy).sort().map(k=>({label:k, n:D.newBy[k].length}));
    if(ny.length) h += card('Новые страны по годам','🆕', vbars(ny,{cls:'green'}));
  } else {
    const nw = D.newBy[D.period] || [];
    h += card(`Впервые в ${D.period}`,'🆕', nw.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px 14px">${nw.map(cc=>`<span>${flagHTML(cc,18)} ${esc(countryName(cc))}</span>`).join('')}</div>` : `<div style="color:var(--muted);font-size:14px">Новых стран в этом году не было</div>`);
  }
  if(D.cities.length) h += card('Города','🏙', `<div style="font-size:22px;font-weight:700;margin-bottom:4px">${D.cities.length} ${plural(D.cities.length,'город','города','городов')}</div>`
    + D.cities.slice(0,8).map(c=>hbar(c.name, c.visits, D.cities[0].visits, {lead:flagHTML(c.cc,18), color:'#e11d48', sub:plural(c.visits,'визит','визита','визитов')})).join('')
    + `<div class="gfoot">Визит — отдельная дата перелёта или поездки. Аэропорты рядом с городом считаются этим городом.</div>`);
  if(D.js.length){
    const L = D.longest;
    h += card('Путешествия','🧳', `<div class="big">${bigv(D.js.length,'путешествий')}${bigv(Math.round(D.jDays/D.js.length*10)/10,'дней в среднем')}</div>`
      + (L ? `<div class="gfoot" style="margin-top:10px">Самое долгое: <b style="color:var(--text)">${esc(journeyTitle(L))}</b> — ${D.days(L)} ${plural(D.days(L),'день','дня','дней')} (${journeyDates(L)})</div>` : '')
      + (D.period==='all' && D.jYears.length>1 ? `<div class="sub-t" style="margin-top:14px">Путешествий в год</div>` + vbars(D.jYears) : ''));
  }
  if(D.gl.length){
    const long = D.gl.reduce((b,g)=>!b||D.gkm(g)>D.gkm(b)?g:b, null), mx = Math.max(...Object.values(D.byMode));
    h += card('Наземные поездки','🚌', `<div class="big">${bigv(D.gl.length,'поездок')}${bigv(kmShort(D.groundKm),'км (по прямой)')}</div>`
      + Object.keys(MODES).filter(k=>D.byMode[k]).map(k=>hbar(MODES[k].name, Math.round(D.byMode[k]), mx, {lead:MODES[k].ico, color:'var(--accent2)', sub:'км'})).join('')
      + (long ? `<div class="gfoot" style="margin-top:8px">Самая длинная: ${esc(legsTitle(long))} — ${fmtKm(D.gkm(long))} км</div>` : ''));
  }
  if(D.terr.length) h += card('Территории и острова','🏝', `<div style="display:flex;flex-wrap:wrap;gap:8px 14px">${D.terr.map(cc=>`<span>${flagHTML(cc,18)} ${esc(countryName(cc))}</span>`).join('')}</div>`);
  return h;
}
function openCountryStats(initial='all'){
  const today = todayStr();
  const ys = new Set([...flights.filter(f=>f.date && f.date<=today).map(f=>f.date.slice(0,4)), ...trips.filter(t=>t.date && t.date<=today).map(t=>t.date.slice(0,4)), ...journeys.filter(j=>j.start<=today).map(j=>j.start.slice(0,4))]);
  const periods = ['all', ...[...ys].sort().reverse()];
  let period = periods.includes(initial) ? initial : 'all';
  const m = openModal({title:'Страны и путешествия', left:null, right:'Готово', cls:'tall wide'});
  function paint(){
    m.body.innerHTML = `<div class="pchips">${periods.map(p=>`<button data-p="${p}" class="${p===period?'on':''}">${p==='all'?'Всё время':p}</button>`).join('')}</div>` + countryStatsHTML(countryStatsData(period));
    m.body.querySelector('.pchips').onclick = e=>{ const b=e.target.closest('[data-p]'); if(b){ period=b.dataset.p; paint(); } };
  }
  paint();
}
